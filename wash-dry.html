*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --navy:#0d2137; --teal:#0d7fa8; --steel:#3a6b8a; --ink:#152535;

/* 헤더 */

/* 공정 스텝 탭 */

.proctab button{flex:1;min-width:80px;background:#fff;border:2px solid var(--line);border-radius:9px;padding:8px 6px;font-family:inherit;font-size:12px;font-weight:700;color:#7a90a4;cursor:pointer;transition:.2s;}

.layout{display:grid;grid-template-columns:1fr;gap:12px;}
@media(min-width:960px){.layout{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);}}

.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:12px;}
.ch{padding:9px 13px;background:#f6f9fc;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:7px;flex-wrap:wrap;}

/* 슬라이더 */
.sv{background:#f8fafc;border:1px solid var(--line);border-radius:9px;padding:9px 11px;margin-bottom:7px;}

.sv-range{position:absolute;top:0;left:0;width:100%;height:100%;opacity:0;cursor:pointer;margin:0;}

.sv-si.o{border-color:#2e7d32;background:#e8f5e9;color:#1b5e20;}

@media(max-width:520px){.kpi{grid-template-columns:1fr 1fr;}}
.kc{border-radius:10px;padding:10px 8px;text-align:center;}

.kc.k4{background:linear-gradient(135deg,#f3e5f5,#e1bee7);color:#6a1b9a;}

/* 전기료/효율 */

.cost-h{font-size:13px;font-weight:800;color:#8a6d00;margin-bottom:8px;}
.cost-in{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:9px;}
.cost-fl{display:flex;align-items:center;gap:4px;}
.cost-fl label{font-size:11px;color:#6a5a2a;font-weight:600;}
.cost-fl input{width:54px;border:1.5px solid #e0d090;border-radius:6px;padding:3px 6px;font-size:12px;font-weight:700;text-align:right;font-family:inherit;color:#5a4a1a;}
.cost-fl span{font-size:10px;color:#9a8a5a;}
.cost-res{display:flex;gap:8px;flex-wrap:wrap;}
.cost-it{flex:1;min-width:88px;background:#fff;border:1px solid #ede0b8;border-radius:8px;padding:6px 8px;text-align:center;}
.cost-it.hl{background:#fff3cd;border-color:#ffc107;}
.cost-it .cl2{font-size:10px;color:#8a7a4a;}
.cost-it .cv{font-size:15px;font-weight:800;color:#6a5310;margin-top:1px;}

.save{margin-top:9px;padding-top:9px;border-top:1px dashed #e0d090;}

/* 표 */
.tbl{width:100%;border-collapse:collapse;font-size:12px;margin-top:6px;}
.tbl th{background:#eaf2f8;color:var(--navy);padding:5px 6px;text-align:center;font-weight:700;border:1px solid #d5e2ec;font-size:11px;}
.tbl td{padding:4px 6px;text-align:center;border:1px solid #e5ecf2;}

.tbl .tg{display:inline-block;padding:1px 7px;border-radius:6px;font-size:10px;font-weight:700;}
.tg-g{background:#d4edda;color:#155724;}
.tg-w{background:#fff3cd;color:#856404;}
.tg-r{background:#f8d7da;color:#721c24;}

.rec{background:#f0f7ff;border:1px solid #cfe3f5;border-radius:9px;padding:9px 11px;margin-top:9px;}
.rec-i{font-size:11px;color:#1a4060;padding:3px 0;line-height:1.55;}

.hide{display:none !important;}
.note{font-size:10px;color:#9aabb8;margin-top:5px;line-height:1.5;}

.flowbar{display:flex;align-items:stretch;gap:4px;margin-bottom:10px;overflow-x:auto;}
.flowstep{flex:1;min-width:66px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:7px 5px;text-align:center;font-size:10px;position:relative;}
.flowstep .fe{font-size:15px;display:block;}
.flowstep .fn{font-weight:700;color:var(--navy);margin-top:1px;}

.flowstep.ad{border-top:3px solid var(--dewat);}

<script>
// ═══════════════════════════════════════════════
// 세척·탈수·건조 통합설비 시뮬레이터 v1.0
// ═══════════════════════════════════════════════
const VER='1.0';
const gi=id=>document.getElementById(id);
const gv=id=>{const e=gi(id);return e?e.value:'';};
const HP_PER_KW=1.341;

// 상태 (기본값)
const S={
  // 세척
  itemW:600,itemD:400,itemH:300,itype:'box',qty:200,dlv:3,
  wZones:3,wHole:2.5,wPress:200,wCol:4,wRow:3,wTemp:60,
  wTankL:1500,wTankW:800,wTankD:600,wTankIns:true,
  drainCount:1,drainHead:8,
  // 탈수
  knifeCount:4,knifeAng:50,knifeVel:60,knifePress:15,blowerCount:1,
  // 건조
  dryTemp:80,dryAirVol:30,dryRecirc:70,heaterCount:2,
  // 온수/유틸
  boilerType:'gas',boilerTankL:1000,boilerIns:true,makeupWater:300,inletTemp:15,
  convKW:1.5,
  // 전기료
  hours:8,days:22,rate:130,gasRate:900
};

// ── 물리 계산 함수 ──
function nozzleQ(holeMm,presKPa){const Cd=0.62,r=holeMm/1000/2,A=Math.PI*r*r;return Cd*Math.sqrt(2*presKPa*1000/1000)*A*1000*60;}
function pumpPowerKW(lpm,headM,eff){const Q=lpm/60000;return 1000*9.81*Q*headM/eff/1000;}
function lpmToKW(lpm,presKPa,eff){return (lpm/60000*presKPa*1000)/eff/1000;}

// 탱크 용량 (치수 기반)
function tankVol(L,W,D){return Math.round(L*W*D*0.75/1e6);} // L, 75%충진

// 히터 유지전력 (단열여부 반영)
function heaterMaintainKW(tankL,temp,insulated){
  const coef=insulated?0.022:0.045; // 단열 시 열손실계수 절반↓
  return tankL*coef*(Math.max(0,temp-20)/40);
}

// 에어나이프 풍량 (m³/min)
function knifeAirFlow(itemW_mm,slotW_mm,velMs,count){
  const A=(itemW_mm/1000)*(slotW_mm/1000); // 슬롯 단면적 m²
  return A*velMs*60*count; // m³/min
}
// 링블로어 동력
function blowerKW(airM3min,pressKPa,eff){return (airM3min/60)*pressKPa*1000/eff/1000;}

// 건조 열부하 (kW)
function dryerKW(residualKgH,airVolM3min,dTemp,recircPct){
  const evap=residualKgH*2260/3600; // 증발 잠열
  const airHeat=(airVolM3min/60)*1.2*1005*dTemp/1000;
  const fresh=airHeat*(1-recircPct/100); // 순환 재사용분 제외
  return evap+fresh;
}

// 탈수 후 잔류수분 추정 (에어나이프 성능 기반)
function residualWater(qtyPerH,knifeCount,knifeVel,knifeAng){
  // 기본 잔류 8kg/h → 나이프 성능으로 감소
  const base=qtyPerH*0.04; // 개당 40g 잔류 가정
  const effCount=Math.min(1,knifeCount/4);
  const effVel=Math.min(1,knifeVel/60);
  const effAng=1-Math.abs(knifeAng-50)/100; // 50°가 최적
  const removeEff=0.5+0.4*(effCount*effVel*effAng);
  return base*(1-removeEff);
}

// ═══════════════════════════════════════════════
// 슬라이더 컴포넌트
// ═══════════════════════════════════════════════
function sliderHTML(id,label,unit,min,max,step,val,optMin,optMax){
  return '<div class="sv" id="sv-'+id+'">'
    +'<div class="sv-h"><span class="sv-l">'+label+'</span>'
    +'<div class="sv-r"><span class="sv-badge" id="bd-'+id+'">—</span>'
    +'<input class="sv-n" type="number" id="'+id+'" value="'+val+'" min="'+min+'" max="'+max+'" step="'+step+'">'
    +'<span class="sv-u">'+unit+'</span></div></div>'
    +'<div class="sv-bar"><div class="sv-opt" id="op-'+id+'"></div><div class="sv-fill" id="fl-'+id+'"></div>'
    +'<input type="range" class="sv-range" id="rg-'+id+'" min="'+min+'" max="'+max+'" step="'+step+'" value="'+val+'"></div>'
    +'<div class="sv-mm"><span>'+min+unit+'</span><span>'+max+unit+'</span></div>'
    +'<div class="sv-state" id="ss-'+id+'" data-optmin="'+optMin+'" data-optmax="'+optMax+'" data-unit="'+unit+'"></div></div>';
}
function updateSlider(id){
  const el=gi(id),rg=gi('rg-'+id),fl=gi('fl-'+id),op=gi('op-'+id),bd=gi('bd-'+id),ss=gi('ss-'+id);
  if(!el||!fl)return;
  const val=+el.value,min=+el.min,max=+el.max;
  const optMin=+ss.dataset.optmin,optMax=+ss.dataset.optmax,unit=ss.dataset.unit;
  const pct=Math.min(100,Math.max(0,(val-min)/(max-min)*100));
  const pMin=Math.min(100,Math.max(0,(optMin-min)/(max-min)*100));
  const pMax=Math.min(100,Math.max(0,(optMax-min)/(max-min)*100));
  let status='opt',stxt='✅ 최적',scls='o';
  if(val<optMin){status='low';stxt='⚠️ 부족';scls='w';}
  else if(val>optMax){status='high';stxt='🔴 초과';scls='b';}
  const colors={opt:'linear-gradient(90deg,#2e7d32,#43a047)',low:'linear-gradient(90deg,#f57f17,#ffb300)',high:'linear-gradient(90deg,#c62828,#e53935)'};
  fl.style.width=pct+'%';fl.style.background=colors[status];fl.innerHTML='<span>'+val+'</span>';
  op.style.left=pMin+'%';op.style.width=(pMax-pMin)+'%';
  bd.textContent=stxt;bd.className='sv-badge '+status;
  if(rg&&+rg.value!==val)rg.value=val;
  ss.innerHTML='<span class="sv-si o">최적 '+optMin+'~'+optMax+unit+'</span>'
    +'<span class="sv-si c">현재 '+val+unit+'</span>'
    +'<span class="sv-si '+scls+'">'+stxt+'</span>';
}
function bindSlider(id){
  const el=gi(id),rg=gi('rg-'+id);
  if(!el||!rg)return;
  rg.addEventListener('input',()=>{el.value=rg.value;el.classList.add('s-user');onChange(id);});
  el.addEventListener('input',()=>{rg.value=el.value;el.classList.add('s-user');onChange(id);});
}

// 입력값 → S 갱신
function syncState(){
  ['itemW','itemD','itemH','qty','dlv','wZones','wHole','wPress','wCol','wRow','wTemp',
   'wTankL','wTankW','wTankD','drainCount','drainHead','knifeCount','knifeAng','knifeVel',
   'knifePress','blowerCount','dryTemp','dryAirVol','dryRecirc','heaterCount','boilerTankL',
   'makeupWater','inletTemp','convKW','hours','days','rate','gasRate'].forEach(k=>{
    const e=gi(k); if(e&&e.value!=='') S[k]=+e.value;
  });
  const it=gi('itype'); if(it) S.itype=it.value;
  const bt=gi('boilerType'); if(bt) S.boilerType=bt.value;
  const wi=gi('wTankIns'); if(wi) S.wTankIns=wi.checked;
  const bi=gi('boilerIns'); if(bi) S.boilerIns=bi.checked;
}

let _tab='wash';
function onChange(id){ syncState(); if(id&&gi(id))updateSlider(id); calcAll(); renderRight(); }

// ═══════════════════════════════════════════════
// 종합 계산
// ═══════════════════════════════════════════════
let R={};
function calcAll(){
  syncState();
  const qtyH=S.qty;
  // 세척
  const qEach=nozzleQ(S.wHole,S.wPress);
  const nPerFace=S.wCol*S.wRow;
  const faces=S.itype==='box'?4:2;
  const washFlow=qEach*nPerFace*faces*1.15;
  const washPumpKW=lpmToKW(washFlow,S.wPress,0.75);
  const tankL=tankVol(S.wTankL,S.wTankW,S.wTankD);
  const washHeaterEach=heaterMaintainKW(tankL,S.wTemp,S.wTankIns);
  const washHeaterTotal=washHeaterEach*S.wZones; // 단수만큼 유지히터 합산
  const washPumpTotal=washPumpKW*S.wZones;
  // 배수펌프
  const drainFlow=tankL/3; // 3분 배수
  const drainKW=pumpPowerKW(drainFlow,S.drainHead,0.6)*S.drainCount;
  // 탈수
  const airFlow=knifeAirFlow(S.itemW,1,S.knifeVel,S.knifeCount);
  const blowKW=blowerKW(airFlow,S.knifePress,0.65)*S.blowerCount;
  const residual=residualWater(qtyH,S.knifeCount,S.knifeVel,S.knifeAng);
  // 건조
  const dryKW=dryerKW(residual,S.dryAirVol,S.dryTemp-20,S.dryRecirc)*1;
  // 온수 보일러
  const boilerHeatKW=(S.makeupWater*4.18*(S.wTemp-S.inletTemp))/3600;
  const boilerLossKW=heaterMaintainKW(S.boilerTankL,S.wTemp,S.boilerIns);
  const boilerTotalKW=boilerHeatKW+boilerLossKW;
  // 전기 총부하 (보일러가 가스면 전기 제외)
  const elecHeater=(S.boilerType==='electric')?boilerTotalKW:0;
  const gasLoad=(S.boilerType==='gas')?boilerTotalKW:0;
  // 세척조 히터: 외부 보일러가 온수 공급하면 세척조 개별 히터는
  // 보조 유지용만 필요 (보일러가 주 열원). 보일러 있으면 세척조 히터 60% 경감
  const washHeatElec = washHeaterTotal * 0.4;
  const elecTotal=washPumpTotal+drainKW+blowKW+dryKW+washHeatElec+elecHeater+S.convKW;
  const elecReal=washPumpTotal+drainKW+blowKW*1+dryKW*0.7+washHeatElec*0.35+elecHeater*0.35+S.convKW;

  // 커버리지·세척율(간이)
  const covF=Math.min(100,(nPerFace*8000)/(S.itemD*S.itemH)*100);
  const washEff=Math.min(99,50+S.wZones*10+(S.wTemp-40)*0.3-(S.dlv-1)*4);
  const dewatEff=Math.min(99,(1-residual/(qtyH*0.04))*100);
  const dryEff=Math.min(99,60+S.dryTemp*0.3+S.dryRecirc*0.15);

  R={qEach,washFlow,washPumpKW,washPumpTotal,tankL,washHeaterEach,washHeaterTotal,
     drainFlow,drainKW,airFlow,blowKW,residual,dryKW,boilerHeatKW,boilerLossKW,boilerTotalKW,
     elecTotal,elecReal,gasLoad,washEff,dewatEff,dryEff,covF,nPerFace,faces,
     washHeatElec,elecHeater};
}

      +sliderHTML('knifePress','🔧 나이프 압력','kPa',5,40,1,S.knifePress,12,20)
      +'<div class="st">링블로어</div>'

      +'</div></div>';
  } else if(_tab==='dry'){
    h='<div class="card"><div class="ch"><span class="ci">🔥</span><span class="cl">건조부 설계</span><span class="cq">열풍기·순환</span></div><div class="cb">'

      +'<div class="g2" style="margin-top:6px;">'+fld('heaterCount','열풍기 댓수','대',S.heaterCount)+'</div>'

function fld(id,label,unit,val){return '<div class="fl"><label>'+label+'</label><input type="number" id="'+id+'" value="'+val+'"><span class="un">'+unit+'</span></div>';}
function sel(id,label,opts,cur){let o=opts.map(x=>'<option value="'+x[0]+'"'+(x[0]===cur?' selected':'')+'>'+x[1]+'</option>').join('');return '<div class="fl"><label>'+label+'</label><select id="'+id+'">'+o+'</select></div>';}

// ═══════════════════════════════════════════════
// 우측 결과 렌더
// ═══════════════════════════════════════════════
function renderRight(){
  calcAll();
  renderFlow();
  const Rc=gi('rightCol');
  const totalEff=((R.washEff+R.dewatEff+R.dryEff)/3);
  let h='<div class="card"><div class="ch"><span class="ci">📈</span><span class="cl">통합 성능·에너지</span></div><div class="cb">'
    +'<div class="kpi">'
    +kc('k1',R.washEff.toFixed(0)+'%','세척 효율')
    +kc('k2',R.dewatEff.toFixed(0)+'%','탈수 효율')
    +kc('k3',R.dryEff.toFixed(0)+'%','건조 효율')
    +kc('k4',R.elecTotal.toFixed(1),'전기정격(kW)')
    +kc('k5',R.elecReal.toFixed(1),'전기실운전(kW)')
    +kc('k6',R.gasLoad>0?R.gasLoad.toFixed(1)+'kW':'—','가스부하')
    +'</div>';
  // 공정별 전력표
  h+='<table class="tbl"><thead><tr><th>공정</th><th>설비</th><th>정격(kW)</th><th>실운전(kW)</th></tr></thead><tbody>'
    +row('세척','순환펌프×'+S.wZones,R.washPumpTotal,R.washPumpTotal)
    +row('세척','유지히터×'+S.wZones,R.washHeaterTotal,R.washHeaterTotal*0.35)
    +row('세척','배수펌프×'+S.drainCount,R.drainKW,R.drainKW)
    +row('탈수','링블로어×'+S.blowerCount,R.blowKW,R.blowKW)
    +row('건조','열풍기',R.dryKW,R.dryKW*0.7)
    +row('공통','컨베이어',S.convKW,S.convKW)
    +(R.elecHeater>0?row('온수','전기보일러',R.elecHeater,R.elecHeater*0.35):'')
    +'</tbody></table>';
  if(R.gasLoad>0) h+='<div class="note">※ 가스보일러 부하 '+R.gasLoad.toFixed(1)+'kW는 가스비로 별도 계산 (전기 제외)</div>';
  h+='</div></div>';

  // 최적화 권장
  h+='<div class="card"><div class="ch"><span class="ci">🎯</span><span class="cl">효율·투자비 최적화 권장</span></div><div class="cb">'+buildRecommend()+'</div></div>';
  Rc.innerHTML=h;

  // 종합결과 탭이면 전기료 렌더
  if(_tab==='result') renderCost();
}
function kc(cls,v,l){return '<div class="kc '+cls+'"><div class="kv">'+v+'</div><div class="kl">'+l+'</div></div>';}
function row(p,e,rated,real){return '<tr><td>'+p+'</td><td>'+e+'</td><td class="hi">'+rated.toFixed(1)+'</td><td>'+real.toFixed(1)+'</td></tr>';}

function renderFlow(){
  const f=gi('flowbar');
  f.innerHTML=
    fs('aw','💧','세척',R.washEff.toFixed(0)+'%')
    +fs('ad','💨','탈수',R.dewatEff.toFixed(0)+'%')
    +fs('ar','🔥','건조',R.dryEff.toFixed(0)+'%')
    +fs('','⚡','전기',R.elecReal.toFixed(1)+'kW')
    +fs('','♨️','온수',(R.gasLoad>0?'가스':'전기'));
}
function fs(cls,e,n,v){return '<div class="flowstep '+cls+'"><span class="fe">'+e+'</span><span class="fn">'+n+'</span><span class="fv">'+v+'</span></div>';}

function buildRecommend(){
  const recs=[];
  if(!S.wTankIns) recs.push('🧥 <b>세척 저수조 단열 미적용</b> → 단열재 적용 시 유지열손실 약 50%↓ (단당 '+(heaterMaintainKW(R.tankL,S.wTemp,false)-heaterMaintainKW(R.tankL,S.wTemp,true)).toFixed(1)+'kW 절감)');
  if(!S.boilerIns) recs.push('🧥 <b>보일러 탱크 단열 미적용</b> → 단열 시 손실 68%↓');
  if(S.boilerType==='electric') recs.push('♨️ <b>전기보일러 사용 중</b> → 가스보일러 전환 시 열원단가 절감 (전기 대비 가스 kWh당 약 40~60%↓)');
  if(S.knifeAng<45||S.knifeAng>60) recs.push('📐 <b>에어나이프 각도 '+S.knifeAng+'°</b> → 45~60°로 조정 시 물 제거 효율↑ → 건조부하↓');
  if(S.knifeCount<4) recs.push('🔪 <b>나이프 '+S.knifeCount+'개</b> → 4개 이상 시 잔류수분↓ → 건조 열부하 감소 (탈수 투자가 건조 에너지보다 저렴)');
  if(S.dryRecirc<60) recs.push('♻️ <b>열풍 순환 '+S.dryRecirc+'%</b> → 60~80%로 높이면 신선공기 가열부하 대폭↓');
  if(S.dryTemp>100) recs.push('🌡️ <b>건조온도 '+S.dryTemp+'°C</b> → 탈수 강화로 온도 낮추면 열부하↓');
  if(S.wTemp>65) recs.push('🌡️ <b>세척온도 '+S.wTemp+'°C</b> → 5°C 인하 시 히터·보일러 부하↓ (세척율 영향 확인)');
  // 항상 표시되는 원칙
  recs.push('💡 <b>핵심 원칙</b>: 탈수(에어나이프) 강화 → 건조 열부하 급감. 건조 히터가 가장 큰 에너지 소비원이므로, 탈수에 투자하는 것이 총 에너지·투자비 모두 유리합니다.');
  return recs.map(r=>'<div class="rec-i">'+r+'</div>').join('');
}

function renderCost(){
  const cr=gi('costResult'); if(!cr)return;
  const elecReal=R.elecReal;
  const daily=elecReal*S.hours;
  const monthly=daily*S.days;
  const cost=monthly*S.rate;
  // 가스비 (가스보일러)
  let gasCost=0,gasNote='';
  if(R.gasLoad>0){
    // 가스 kW → m³/h (LNG 발열량 약 10.4kWh/m³, 효율 90%)
    const gasM3H=R.gasLoad/(10.4*0.9);
    const gasM3Month=gasM3H*S.hours*S.days;
    gasCost=gasM3Month*S.gasRate;
    gasNote='<div class="cost-it"><div class="cl2">월 가스</div><div class="cv">'+Math.round(gasM3Month).toLocaleString()+' m³</div></div>';
  }
  const totalMonth=cost+gasCost;
  cr.innerHTML='<div class="cost-res">'
    +'<div class="cost-it"><div class="cl2">일 전력</div><div class="cv">'+Math.round(daily)+' kWh</div></div>'
    +'<div class="cost-it"><div class="cl2">월 전력</div><div class="cv">'+Math.round(monthly).toLocaleString()+' kWh</div></div>'
    +gasNote
    +'<div class="cost-it hl"><div class="cl2">월 에너지비 합계</div><div class="cv">'+Math.round(totalMonth).toLocaleString()+' 원</div></div>'
    +'</div>'
    +'<div class="note">※ 전기 실운전 부하 기준 + 가스비 합산. 심야전력·폐열회수 미반영(추가 절감 여지).</div>'
    +'<div class="save"><div class="save-h">💰 추가 절감 방안</div>'
    +'<div class="save-i">🌙 심야전력(23~09시) 예열 활용 → 전력단가 약 40%↓</div>'
    +'<div class="save-i">♻️ 세척 배수 폐열회수(열교환기)로 보충수 예열 → 보일러 부하 20~30%↓</div>'
    +'<div class="save-i">💨 탈수 강화로 건조온도 인하 → 건조 열부하가 최대 소비원</div>'
    +'</div>';
}

gi('bMB').addEventListener('click',()=>{gi('bMB').classList.add('on');gi('bPC').classList.remove('on');gi('wrap').classList.add('mobile');});
