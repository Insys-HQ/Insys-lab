<title>인시스 업무 포털</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{--navy:#1f3a5f;--navy2:#2c4f7c;--ink:#1f2933;--sub:#4a5563;--line:#d5dde8;--bg:#f2f5f9;--card:#ffffff;--tint:#e8eef7;--warn:#fff4d6;--warn-ink:#6b4a00}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:14px}
@media (min-width:768px){html{font-size:16px}}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--ink);line-height:1.45;-webkit-text-size-adjust:100%}
a{color:inherit;text-decoration:none}
.nav{background:var(--navy);color:#fff;width:100%}
.nav-inner{max-width:1100px;margin:0 auto;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.brand{font-weight:900;font-size:1.15rem;letter-spacing:-.2px}
.brand small{font-weight:400;font-size:.8rem;margin-left:6px;color:#dbe6f5}
.nav-right{display:flex;align-items:center;gap:8px}
.ver{font-size:.8rem;background:#fff;color:var(--navy);padding:2px 8px;border-radius:10px;font-weight:700}
.tg{display:inline-flex;border:1px solid #fff;border-radius:6px;overflow:hidden}
.tg button{font-family:inherit;font-size:.8rem;border:0;padding:4px 10px;cursor:pointer;background:transparent;color:#fff}
.tg button.on{background:#fff;color:var(--navy);font-weight:700}
#wrap{max-width:1100px;margin:0 auto;padding:8px 14px 12px;transition:max-width .2s}
#wrap.mobile{max-width:430px}
.hero{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.hero h1{font-size:1.2rem;font-weight:900;color:var(--navy)}
.hero p{font-size:.93rem;color:var(--sub);margin-top:2px}
.stats{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.stat{background:var(--tint);color:var(--navy);border-radius:8px;padding:3px 10px;font-size:.85rem;font-weight:700}
.sec-t{font-size:1rem;font-weight:700;color:var(--navy);margin:8px 0 4px}
.hubs{display:grid;grid-template-columns:1fr;gap:6px}
@media (min-width:768px){#wrap:not(.mobile) .hubs{grid-template-columns:repeat(4,1fr)}}
.hub{display:block;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--navy);border-radius:8px;padding:8px 10px}
.hub b{display:block;font-size:.95rem;color:var(--navy)}
.hub span{display:block;font-size:.82rem;color:var(--sub);margin-top:1px}
.hub:hover,.item:hover{border-color:var(--navy2);background:#f7faff}
.tools{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.search{width:100%;font-family:inherit;font-size:1rem;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.chip{flex:0 0 auto;font-family:inherit;font-size:.85rem;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:14px;padding:4px 10px;cursor:pointer}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.cat{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-top:8px;overflow:hidden}
.cat-h{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:var(--tint);color:var(--navy);font-weight:700;font-size:.98rem;cursor:pointer;user-select:none;border:0;width:100%;font-family:inherit;text-align:left}
.cat-h em{font-style:normal;font-size:.82rem;font-weight:500;color:var(--sub)}
.cat-note{font-size:.82rem;color:var(--sub);padding:4px 12px 0}
.list{display:grid;grid-template-columns:1fr;gap:6px;padding:8px 10px 10px}
@media (min-width:768px){#wrap:not(.mobile) .list{grid-template-columns:repeat(3,1fr)}}
.item{display:block;border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:#fff}
.item b{font-size:.93rem;font-weight:500;color:var(--ink);display:block}
.item i{font-style:normal;font-size:.78rem;color:var(--sub)}
.item .lk{color:var(--warn-ink);background:var(--warn);border-radius:6px;padding:0 5px;margin-left:4px;font-size:.75rem}
.hidden{display:none}
.empty{padding:12px;text-align:center;color:var(--sub);font-size:.93rem}
.foot{margin-top:10px;font-size:.8rem;color:var(--sub);text-align:center;line-height:1.5}
</style>
</head>

const state = {cat:'전체', q:''};
const $ = id => document.getElementById(id);
const total = CATS.reduce((s,c)=>s+c.items.length,0);

function esc(s){return String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));}

function renderStatic(){
  $('verTop').textContent = VERSION; $('verFoot').textContent = VERSION;
  $('stats').innerHTML = '<span class="stat">앱 '+total+'개</span><span class="stat">분야 '+CATS.length+'개</span>';
  $('hubs').innerHTML = HUBS.map(h=>'<a class="hub" href="'+esc(h.u)+'" target="_blank" rel="noopener"><b>'+esc(h.t)+'</b><span>'+esc(h.d)+'</span></a>').join('');
}
function renderChips(){
  const names = ['전체'].concat(CATS.map(c=>c.n));
  $('chips').innerHTML = names.map(n=>'<button type="button" class="chip'+(n===state.cat?' on':'')+'" data-c="'+esc(n)+'">'+esc(n)+'</button>').join('');
  $('chips').querySelectorAll('.chip').forEach(b=>b.addEventListener('click',()=>{state.cat=b.dataset.c;renderChips();renderList();}));
}
function renderList(){
  const q = state.q.trim().toLowerCase();
  let shown = 0, html = '';
  CATS.forEach(c=>{
    if(state.cat!=='전체' && state.cat!==c.n) return;
    const its = c.items.filter(i=>!q || (i[1]+' '+i[0]+' '+c.n).toLowerCase().includes(q));
    if(!its.length) return;
    shown += its.length;
    html += '<section class="cat"><button type="button" class="cat-h" data-h="1"><span>'+esc(c.n)+'</span><em>'+its.length+'개 ▾</em></button>'
      + (c.note?'<div class="cat-note">'+esc(c.note)+'</div>':'')
      + '<div class="list">'+its.map(i=>'<a class="item" href="'+esc((c.base||REV)+i[0])+'" target="_blank" rel="noopener"><b>'+esc(i[1])+(i[3]?'<span class="lk">🔒 로그인</span>':'')+'</b><i>'+esc(i[0])+(i[2]?' · '+esc(i[2]):'')+'</i></a>').join('')+'</div></section>';
  });
  $('cats').innerHTML = html;
  $('empty').classList.toggle('hidden', shown>0);
  $('cats').querySelectorAll('.cat-h').forEach(h=>h.addEventListener('click',()=>{
    const l = h.parentElement.querySelector('.list'); l.classList.toggle('hidden');
  }));
}
function setView(m){
  $('wrap').classList.toggle('mobile', m==='m');
  $('bM').classList.toggle('on', m==='m'); $('bP').classList.toggle('on', m==='p');
}
$('bM').addEventListener('click',()=>setView('m'));
$('bP').addEventListener('click',()=>setView('p'));
$('q').addEventListener('input',e=>{state.q=e.target.value;renderList();});
renderStatic(); renderChips(); renderList();
</script>
</body>
</html>
