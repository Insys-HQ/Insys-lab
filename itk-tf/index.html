<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>화재복구·공장신축 TF 통합관리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0D1B2A;
    --navy2:#1A4F8A;
    --accent:#2D8CCC;
    --accent-light:#EBF4FF;
    --bg:#F4F6F9;
    --card:#FFFFFF;
    --text:#1A2332;
    --text-sub:#6B7A8D;
    --border:#E2E6EC;
    --ok:#2E7D52;
    --warn:#E8961A;
    --danger:#D94F3A;
    --shadow:0 2px 12px rgba(13,27,42,0.08);
    --radius:10px;
    --fs-min:0.875rem; /* 모바일 기본 최소 폰트: 14px */
  }
  @media (min-width:768px){
    :root{ --fs-min:1rem; } /* PC(768px~): 16px로 확대 */
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  .inner{max-width:1100px;margin:0 auto;padding:0 20px;}
  body{
    font-family:'Noto Sans KR',sans-serif;
    background:var(--bg);
    color:var(--text);
    font-size:var(--fs-min);
    line-height:1.6;
  }
  #gate{display:none;}

  #updateBanner{
    display:none;position:fixed;top:0;left:0;right:0;z-index:500;
    background:var(--accent);color:#fff;padding:10px 16px;font-size:var(--fs-min);
    align-items:center;justify-content:center;gap:14px;
  }
  #updateBanner button{
    background:#fff;color:var(--accent);border:none;border-radius:6px;padding:5px 12px;font-size:var(--fs-min);font-weight:700;cursor:pointer;font-family:inherit;
  }

  header{
    background:var(--navy);color:#fff;padding:16px 20px;
    box-shadow:0 2px 16px rgba(0,0,0,0.25);
  }
  header .inner{
    max-width:1100px;margin:0 auto;padding:0;
  }
  .header-top{display:flex;justify-content:space-between;align-items:center;}
  .header-title{display:flex;align-items:center;gap:10px;}
  .icon-header{width:20px;height:20px;flex-shrink:0;color:var(--accent);}
  header h1{font-size:18px;font-weight:700;letter-spacing:-0.3px;}
  .ver-badge{
    font-size:11px;color:rgba(255,255,255,0.55);background:rgba(255,255,255,0.08);
    padding:2px 8px;border-radius:10px;font-weight:600;font-family:'JetBrains Mono',monospace;
  }
  .header-date{font-size:12px;color:rgba(255,255,255,0.55);white-space:nowrap;font-family:'JetBrains Mono',monospace;}

  #statusBar{background:var(--navy);border-top:1px solid rgba(255,255,255,0.08);}
  .status-row{
    display:flex;flex-wrap:wrap;align-items:center;padding:0;
    padding-top:9px;padding-bottom:12px;font-size:12px;color:rgba(255,255,255,0.62);gap:10px;
    font-family:'JetBrains Mono',monospace;
  }
  .status-item{display:flex;align-items:center;gap:6px;white-space:nowrap;}
  .icon-sm{width:13px;height:13px;flex-shrink:0;color:rgba(255,255,255,0.4);}
  .status-progress{color:#fff;font-weight:600;}
  .status-progress .icon-sm{color:var(--accent);}
  .status-div{width:1px;height:12px;background:rgba(255,255,255,0.15);}
  .status-email{margin-left:auto;color:rgba(255,255,255,0.3);font-size:11px;}
  @media(max-width:700px){
    .status-email{display:none;}
    .status-row{gap:8px;}
  }

  nav{
    background:var(--card);position:sticky;top:0;z-index:50;
    border-bottom:2px solid var(--border);
  }
  nav .inner{
    max-width:1100px;margin:0 auto;padding:0 20px;display:flex;gap:0;overflow-x:auto;
  }
  nav button{
    background:transparent;border:none;color:var(--text-sub);padding:14px 18px;font-size:13px;cursor:pointer;font-family:inherit;
    border-bottom:3px solid transparent;white-space:nowrap;font-weight:500;margin-bottom:-2px;transition:color .15s;
  }
  nav button:hover{color:var(--navy2);}
  nav button.active{color:var(--navy2);border-bottom-color:var(--navy2);font-weight:700;}

  main{max-width:1100px;margin:0 auto;padding:24px 20px 60px;}
  .view{display:none;}
  .view.active{display:block;}

  .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px;}
  @media(max-width:800px){.grid4{grid-template-columns:repeat(2,1fr);}}
  .track-card{
    background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px;
  }
  .track-card .label{font-size:var(--fs-min);color:var(--text-sub);font-weight:500;margin-bottom:6px;}
  .track-card .status{font-size:var(--fs-min);font-weight:700;color:var(--navy);margin-bottom:8px;min-height:20px;}
  .track-card textarea{
    width:100%;border:1px solid var(--border);border-radius:6px;padding:8px;font-size:var(--fs-min);font-family:inherit;resize:vertical;min-height:60px;color:var(--text);
  }
  .track-card .row{display:flex;gap:6px;margin-top:8px;}
  .track-card input[type=text]{
    flex:1;border:1px solid var(--border);border-radius:6px;padding:6px 8px;font-size:var(--fs-min);font-family:inherit;
  }
  .track-card button.save{
    background:var(--accent);color:#fff;border:none;border-radius:6px;padding:6px 12px;font-size:var(--fs-min);cursor:pointer;font-family:inherit;
  }
  .track-card .updated{font-size:var(--fs-min);color:#98A2AF;margin-top:6px;}

  .section-title{font-size:16px;font-weight:700;color:var(--navy);margin:26px 0 14px;padding-bottom:10px;border-bottom:2px solid var(--border);display:flex;align-items:center;gap:8px;}
  .card{background:var(--card);border:none;box-shadow:var(--shadow);border-radius:var(--radius);padding:18px;margin-bottom:16px;}

  .upload-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px;}
  .upload-row input[type=file]{font-size:var(--fs-min);}
  .upload-row input[type=text]{
    flex:1;min-width:180px;border:1px solid var(--border);border-radius:6px;padding:9px 10px;font-size:var(--fs-min);font-family:inherit;
  }
  .upload-row select{
    border:1px solid var(--border);border-radius:6px;padding:9px 10px;font-size:var(--fs-min);font-family:inherit;background:#fff;
  }
  .upload-row button{
    background:var(--navy);color:#fff;border:none;border-radius:6px;padding:9px 16px;font-size:var(--fs-min);cursor:pointer;font-family:inherit;font-weight:500;
  }
  .progress{font-size:var(--fs-min);color:var(--accent);margin-bottom:12px;}

  .photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;}
  .day-group-header{
    grid-column:1/-1;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    background:var(--card);border:1px solid var(--border);border-radius:8px;
    padding:9px 12px;margin:14px 0 2px;font-size:var(--fs-min);
  }
  .day-group-header .day-date{font-weight:700;color:var(--navy);}
  .day-group-header .day-count{color:var(--accent);background:var(--accent-light);padding:1px 8px;border-radius:10px;font-size:var(--fs-min);}
  .day-group-header .day-memo-box{
    flex:1;min-width:140px;color:var(--text);background:var(--bg);border-radius:8px;
    padding:6px 12px;cursor:pointer;display:flex;align-items:center;gap:6px;
  }
  .day-group-header .day-memo-box:hover{background:var(--accent-light);}
  .day-group-header .day-memo-box .pencil{width:13px;height:13px;flex-shrink:0;color:var(--text-sub);}
  .statusbar-sep{color:#4A5A7A;}

  .stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:16px;}
  @media(max-width:700px){.stat-grid{grid-template-columns:1fr;}}
  .stat-card{
    background:var(--card);border-radius:var(--radius);padding:16px 12px;
    box-shadow:var(--shadow);border-left:none;text-align:center;
  }
  .stat-card.sky{border-left-color:#2D8CCC;}
  .stat-card.amber{border-left-color:var(--warn);}
  .stat-card.green{border-left-color:var(--ok);}
  .stat-num{font-size:28px;font-weight:900;color:var(--navy);line-height:1.2;}
  .stat-num.sky-text{color:var(--accent);}
  .stat-num.amber-text{color:var(--warn);}
  .stat-label{font-size:12px;color:var(--text-sub);margin-top:4px;}

  /* jeju 스타일 사진 업로드 박스 */
  .upload-box{
    background:var(--accent);
    border-radius:var(--radius);padding:18px 20px;margin-bottom:16px;color:#fff;
  }
  .upload-box-title{
    display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;margin-bottom:14px;
  }
  .upload-box-title svg{width:20px;height:20px;flex-shrink:0;}
  .upload-box-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .upload-box-label{font-size:var(--fs-min);color:rgba(255,255,255,0.85);width:36px;flex-shrink:0;}
  .upload-date-input{
    flex:1;border:none;border-radius:8px;padding:10px 12px;font-size:var(--fs-min);
    font-family:inherit;background:#fff;color:var(--text);
  }
  .upload-box-actions{display:flex;gap:10px;margin-top:14px;}
  .upload-action-btn{
    flex:1;display:flex;align-items:center;justify-content:center;gap:8px;
    background:#fff;color:var(--navy2);border:none;border-radius:8px;
    padding:12px;font-size:var(--fs-min);font-weight:700;cursor:pointer;font-family:inherit;
  }
  .upload-action-btn svg{width:17px;height:17px;}
  .upload-action-btn.light{background:rgba(255,255,255,0.22);color:#fff;}
  .photo-item{background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden;position:relative;}
  .photo-item .sel-check{
    position:absolute;top:8px;left:8px;width:20px;height:20px;z-index:5;cursor:pointer;accent-color:var(--accent);
  }
  .photo-item.selected{outline:2px solid var(--accent);}
  .photo-item img{width:100%;height:150px;object-fit:cover;display:block;background:#eee;cursor:pointer;}
  .photo-item .meta{padding:10px;}
  .photo-item .tag{
    display:inline-block;font-size:var(--fs-min);background:var(--accent-light);color:var(--accent);padding:2px 8px;border-radius:10px;margin-bottom:6px;font-weight:500;
  }
  .photo-item .memo{font-size:var(--fs-min);color:var(--text);margin-bottom:4px;}
  .photo-item .date{font-size:var(--fs-min);color:var(--text-sub);}
  .photo-item .del{font-size:var(--fs-min);color:var(--danger);cursor:pointer;float:right;}

  .file-list{border:1px solid var(--border);border-radius:10px;overflow:hidden;}
  .file-row{
    display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--border);background:var(--card);font-size:var(--fs-min);
  }
  .file-row:last-child{border-bottom:none;}
  .file-row .ftag{
    font-size:var(--fs-min);background:var(--accent-light);color:var(--accent);padding:2px 8px;border-radius:10px;font-weight:500;flex-shrink:0;
  }
  .file-row .fname{flex:1;color:var(--text);}
  .file-row a{color:var(--accent);text-decoration:none;font-size:var(--fs-min);font-weight:500;}
  .file-row .fdate{font-size:var(--fs-min);color:var(--text-sub);flex-shrink:0;}
  .file-row .del{font-size:var(--fs-min);color:var(--danger);cursor:pointer;flex-shrink:0;}

  table.sched{width:100%;border-collapse:collapse;font-size:var(--fs-min);}
  table.sched th{
    background:var(--accent-light);color:var(--navy);text-align:left;padding:9px 10px;font-weight:700;font-size:var(--fs-min);
  }
  table.sched td{padding:9px 10px;border-bottom:1px solid var(--border);color:var(--text);}
  table.sched tr:last-child td{border-bottom:none;}
  .badge{padding:2px 8px;border-radius:10px;font-size:var(--fs-min);font-weight:600;}
  .badge.done{background:#DFF3E8;color:var(--ok);}
  .badge.prog{background:#FDF0DC;color:var(--warn);}
  .badge.plan{background:#E7ECF2;color:var(--text-sub);}
  .del-cell{color:var(--danger);cursor:pointer;font-size:var(--fs-min);}

  .empty{color:var(--text-sub);font-size:var(--fs-min);padding:20px;text-align:center;}

  .legal-item{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:12px;}
  .legal-item .top{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
  .legal-item .fname{flex:1;font-size:var(--fs-min);font-weight:500;color:var(--text);}
  .legal-item .fdate{font-size:var(--fs-min);color:var(--text-sub);}
  .legal-item .actions{display:flex;gap:10px;align-items:center;margin-top:6px;}
  .legal-item .actions a, .legal-item .actions span{font-size:var(--fs-min);cursor:pointer;color:var(--accent);}
  .legal-item .actions .del{color:var(--danger);}
  .legal-item .analysis{
    margin-top:10px;padding:12px;background:var(--accent-light);border-radius:8px;font-size:var(--fs-min);color:var(--text);white-space:pre-wrap;line-height:1.7;
  }
  .legal-item .analysis-label{font-size:var(--fs-min);font-weight:700;color:var(--accent);margin-bottom:4px;}
  .badge.pending{background:#E7ECF2;color:var(--text-sub);}
  .badge.error{background:#F7DEDE;color:var(--danger);}

  #lightbox{
    display:none;position:fixed;inset:0;background:rgba(10,14,22,0.9);z-index:200;align-items:center;justify-content:center;padding:20px;
  }
  #lightbox img{max-width:90%;max-height:90%;border-radius:6px;}
  #lightbox .close{position:absolute;top:20px;right:26px;color:#fff;font-size:28px;cursor:pointer;}
</style>
</head>
<body>

<div id="gate" style="display:none;"></div>

<div id="updateBanner">
  새 버전이 배포되었습니다.
  <button onclick="location.reload(true)">새로고침</button>
</div>

<div id="progressSuggestBanner" style="display:none;position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:400;background:var(--card);border:1px solid var(--accent);border-radius:10px;padding:14px 18px;box-shadow:0 4px 16px rgba(0,0,0,0.15);max-width:90%;width:420px;">
  <div style="font-weight:700;color:var(--navy);margin-bottom:8px;">진도율 자동 감지</div>
  <div id="progressSuggestBody"></div>
</div>


<header>
  <div class="inner header-top">
    <div class="header-title">
      <svg class="icon-header" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 21h18M5 21V9l6-4 6 4v12M9 21v-6h6v6M9 12h.01M13.5 12h.01"/></svg>
      <h1>화재복구·공장신축 TF 통합관리</h1>
      <span class="ver-badge">v4.2</span>
    </div>
    <div id="wxDate" class="header-date">-</div>
  </div>
</header>

<div id="statusBar">
  <div class="inner status-row">
    <span class="status-item"><svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 21s7-6.5 7-12a7 7 0 1 0-14 0c0 5.5 7 12 7 12z"/><circle cx="12" cy="9" r="2.3"/></svg><span id="wxLocation">안산시</span></span>
    <span class="status-div"></span>
    <span class="status-item"><svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M17.5 19a4.5 4.5 0 0 0 0-9 6 6 0 0 0-11.6 1.5A4 4 0 0 0 6.5 19h11z"/></svg><span id="wxWeather">불러오는 중...</span></span>
    <span class="status-div"></span>
    <span class="status-item"><svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 2.7s6 6.6 6 11a6 6 0 1 1-12 0c0-4.4 6-11 6-11z"/></svg><span id="wxHumidity">-</span></span>
    <span class="status-div"></span>
    <span class="status-item"><svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 8h10a3 3 0 1 0-3-3M3 16h13a3 3 0 1 1-3 3M3 12h16a2.5 2.5 0 1 0-2.5-2.5"/></svg><span id="wxWind">-</span></span>
    <span class="status-email">ys.kim@in-sys.co.kr</span>
  </div>
</div>

<nav>
  <div class="inner">
    <button class="active" data-view="photos">사진일지</button>
    <button data-view="log">일지</button>
    <button data-view="permit">인허가</button>
    <button data-view="files">문서</button>
    <button data-view="siteinfo">현장정보</button>
  </div>
</nav>

<main>

  <!-- 사진일지: 통계카드 + 업로드 + 날짜별 사진 + 공정 진도율 -->
  <div class="view active" id="view-photos">
    <div class="stat-grid" id="photoStatGrid">
      <div class="stat-card"><div class="stat-num" id="statElapsed">-</div><div class="stat-label">착공 경과일</div></div>
      <div class="stat-card"><div class="stat-num sky-text" id="statTotalPhotos">-</div><div class="stat-label">누적 사진</div></div>
      <div class="stat-card"><div class="stat-num amber-text" id="statRecordDays">-</div><div class="stat-label">기록일수</div></div>
    </div>
    <div class="upload-box">
      <div class="upload-box-title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 16.5a3.5 3.5 0 0 0-1.4-6.7 5.5 5.5 0 0 0-10.6-1.7A4.5 4.5 0 0 0 6.5 16.5h13.5z"/></svg>
        오늘 현장 사진 올리기
      </div>
      <div class="upload-box-row">
        <span class="upload-box-label">날짜</span>
        <input type="date" id="photoShotDate" class="upload-date-input">
      </div>
      <div class="upload-box-actions">
        <button class="upload-action-btn" onclick="document.getElementById('photoFileCamera').click()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 8a2 2 0 0 1 2-2h1l1.2-2h7.6L17 6h1a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8z"/><circle cx="12" cy="13" r="3.2"/></svg>
          촬영
        </button>
        <button class="upload-action-btn light" onclick="document.getElementById('photoFileGallery').click()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9.5" r="1.5"/><path d="M21 16l-5-5-4 4-2-2-5 5"/></svg>
          갤러리
        </button>
      </div>
      <input type="file" id="photoFileCamera" accept="image/*" capture="environment" multiple style="display:none" onchange="handlePhotoFileSelect(this)">
      <input type="file" id="photoFileGallery" accept="image/*" multiple style="display:none" onchange="handlePhotoFileSelect(this)">
      <div class="progress" id="photoProgress" style="color:rgba(255,255,255,0.9);"></div>
      <div style="background:rgba(255,255,255,0.25);border-radius:6px;height:6px;overflow:hidden;display:none;" id="photoProgressBarWrap">
        <div id="photoProgressBar" style="background:#fff;height:100%;width:0%;transition:width .2s;"></div>
      </div>
    </div>
    <div class="upload-row" style="margin-bottom:10px;">
      <span style="font-size:var(--fs-min);color:var(--text-sub);">업로드할 사진의 공정단계</span>
      <select id="photoCat">
        <option value="화재현장">화재현장</option>
        <option value="철거">철거</option>
        <option value="기초">기초</option>
        <option value="골조">골조</option>
        <option value="외부마감">외부마감</option>
        <option value="내부마감">내부마감</option>
        <option value="준공">준공</option>
        <option value="기타">기타</option>
      </select>
    </div>
    <div class="upload-row" style="margin-bottom:10px;">
      <select id="photoFilter" onchange="loadPhotos()">
        <option value="">전체 단계</option>
        <option value="화재현장">화재현장</option>
        <option value="철거">철거</option>
        <option value="기초">기초</option>
        <option value="골조">골조</option>
        <option value="외부마감">외부마감</option>
        <option value="내부마감">내부마감</option>
        <option value="준공">준공</option>
        <option value="기타">기타</option>
      </select>
      <button onclick="toggleSelectAllPhotos()" style="background:var(--card);color:var(--navy);border:1px solid var(--border);">전체선택/해제</button>

// 업로드 진행률 콜백을 지원하는 공통 업로드 함수
// 이미지 자동 압축 (긴 변 1920px 기준, JPEG 품질 80%)
function compressImage(file, maxDim=1920, quality=0.8){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = ()=> reject(new Error('파일 읽기 실패'));
    reader.onload = (e)=>{
      const img = new Image();
      img.onerror = ()=> reject(new Error('이미지 로드 실패'));
      img.onload = ()=>{
        let { width, height } = img;
        if(width > maxDim || height > maxDim){
          if(width > height){ height = Math.round(height * maxDim / width); width = maxDim; }
          else { width = Math.round(width * maxDim / height); height = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        canvas.toBlob((blob)=>{
          if(!blob){ reject(new Error('압축 실패')); return; }
          resolve(blob);
        }, 'image/jpeg', quality);
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

async function toUploadFile(file){
  if(!file.type || !file.type.startsWith('image/')) return file; // 이미지가 아니면 그대로
  try{
    const blob = await compressImage(file);
    if(blob.size >= file.size) return file; // 압축 효과 없으면 원본 유지
    const newName = file.name.replace(/\.[^.]+$/, '') + '.jpg';
    return new File([blob], newName, { type: 'image/jpeg' });
  }catch(e){
    console.warn('이미지 압축 실패, 원본으로 업로드', e);
    return file;
  }
}

function uploadWithProgress(sref, file, onProgress){
  return new Promise((resolve, reject)=>{
    const task = uploadBytesResumable(sref, file);
    task.on('state_changed',
      (snap)=>{
        const pct = Math.round((snap.bytesTransferred / snap.totalBytes) * 100);
        onProgress(pct);
      },
      (err)=> reject(err),
      async ()=>{
        const url = await getDownloadURL(sref);
        resolve(url);
      }
    );
  });
}

async function suggestProgressFromText(text){
  if(!text || !text.trim()) return;
  if(!LEGAL_ANALYZE_URL || LEGAL_ANALYZE_URL.includes('여기에')) return;
  try{
    const resp = await fetch(LEGAL_ANALYZE_URL, {

      body: JSON.stringify({ action: 'extractProgress', text })
    });

    if(!resp.ok || !data.extractions || data.extractions.length===0) return;
    showProgressSuggestions(data.extractions);
  }catch(e){
    console.error('진도율 자동감지 실패', e);
  }
}

function showProgressSuggestions(extractions){
  const banner = document.getElementById('progressSuggestBanner');

      <button onclick="applyProgressSuggestion('${ex.stage}', ${ex.progress}, ${i})" style="background:var(--accent);color:#fff;border:none;border-radius:6px;padding:5px 10px;font-size:var(--fs-min);cursor:pointer;">반영</button>
    </div>
  `).join('') + `<div style="text-align:right;"><span onclick="document.getElementById('progressSuggestBanner').style.display='none';" style="font-size:var(--fs-min);color:var(--text-sub);cursor:pointer;">닫기</span></div>`;
  banner.style.display = 'block';
}

  loadOverallProgress();

  const rows = document.querySelectorAll('#progressSuggestBody > div');
  if(rows[idx]) rows[idx].style.opacity = '0.4';
  const btn = rows[idx] ? rows[idx].querySelector('button') : null;
  if(btn){ btn.textContent = '반영됨'; btn.disabled = true; }
};

// 공정단계 진도율이 반영될 때, "공장신축" 트랙의 같은 공정단계 일정 상태도 함께 갱신
async function syncScheduleStatusForStage(stage, progress){
  const newStatus = progress >= 100 ? '완료' : (progress > 0 ? '진행중' : '계획');
  const q = query(
    collection(db,'schedule'),
    where('track','==','공장신축'),
    where('stage','==',stage)
  );
  const snap = await getDocs(q);
  if(snap.empty) return;
  for(const d of snap.docs){
    await setDoc(doc(db,'schedule',d.id), {status:newStatus}, {merge:true});
  }
  loadSchedule();
}

let photoCache = {};
let selectedPhotoIds = new Set();
let dayLogCache = {};

async function updateElapsedDaysStat(){
  const el = document.getElementById('statElapsed');
  try{
    const snap = await getDoc(doc(db,'siteInfo','main'));
    const startDate = snap.exists() ? snap.data().startDate : '';
    if(!startDate){ el.textContent = '-'; return; }
    const start = new Date(startDate);
    if(isNaN(start.getTime())){ el.textContent = '-'; return; }
    const diffDays = Math.floor((new Date() - start) / (1000*60*60*24));
    el.textContent = diffDays >= 0 ? diffDays : '-';
  }catch(e){
    el.textContent = '-';
  }
}

function formatDayLabel(dateKey){
  // dateKey: "YYYY-MM-DD" → "M월 D일 (요일)"
  const parts = (dateKey||'').split('-');
  if(parts.length!==3) return dateKey;
  const d = new Date(Number(parts[0]), Number(parts[1])-1, Number(parts[2]));
  const days = ['일','월','화','수','목','금','토'];
  return `${Number(parts[1])}월 ${Number(parts[2])}일 (${days[d.getDay()]})`;
}

async function loadPhotos(){
  const grid = document.getElementById('photoGrid');
  const filterEl = document.getElementById('photoFilter');
  const filter = filterEl ? filterEl.value : '';
  grid.innerHTML = '<div class="empty">불러오는 중...</div>';
  const q = query(collection(db,'photos'), orderBy('createdAt','desc'));
  const snap = await getDocs(q);
  photoCache = {};
  selectedPhotoIds.clear();
  updateSelCount();
  if(snap.empty){
    grid.innerHTML = '<div class="empty">등록된 사진이 없습니다.</div>';
    document.getElementById('statTotalPhotos').textContent = '0';
    document.getElementById('statRecordDays').textContent = '0';
    await updateElapsedDaysStat();
    return;
  }

  const items = [];
  const allDates = new Set();
  snap.forEach(d=>{
    const p = d.data();
    photoCache[d.id] = p;
    allDates.add(photoDateLabel(p));
    if(!filter || p.category === filter){
      items.push({ id: d.id, ...p });
    }
  });

  // 통계 카드 갱신 (필터와 무관하게 전체 기준)
  document.getElementById('statTotalPhotos').textContent = snap.size;
  document.getElementById('statRecordDays').textContent = allDates.size;
  await updateElapsedDaysStat();

  if(items.length===0){ grid.innerHTML = '<div class="empty">해당 단계의 사진이 없습니다.</div>'; return; }

  // 촬영일자(shotDate) 기준으로 그룹핑, 같은 날짜는 한 곳에 모두 배치
  const groups = {};
  items.forEach(p=>{
    const dateKey = photoDateLabel(p);
    if(!groups[dateKey]) groups[dateKey] = [];
    groups[dateKey].push(p);
  });

  // 날짜 문자열(YYYY-MM-DD) 내림차순 정렬 → 최신 날짜가 항상 맨 위
  const sortedKeys = Object.keys(groups).sort((a,b)=> a < b ? 1 : -1);

  // 일자별 작업일지 메모 불러오기
  const logSnap = await getDocs(collection(db,'dailyLogs'));
  dayLogCache = {};
  logSnap.forEach(d=>{ dayLogCache[d.id] = d.data().memo || ''; });

  grid.innerHTML = '';
  sortedKeys.forEach(dateKey=>{
    const dayHeader = document.createElement('div');
    dayHeader.className = 'day-group-header';
    dayHeader.id = 'daylog-' + dateKey;
    renderDayLogView(dayHeader, dateKey, groups[dateKey].length);
    grid.appendChild(dayHeader);

    groups[dateKey].forEach(p=>{
      const el = document.createElement('div');
      el.className = 'photo-item';
      el.id = 'photo-item-' + p.id;
      el.innerHTML = `
        <input type="checkbox" class="sel-check" onclick="event.stopPropagation(); togglePhotoSelect('${p.id}')">
        <img src="${p.url}" onclick="openLightbox('${p.url}')">
        <div class="meta">
          <span class="del" onclick="delPhoto('${p.id}','${p.storagePath}')">삭제</span>
          <span class="tag">${p.category||'기타'}</span>
          <div class="date" id="photo-date-${p.id}">
            ${photoDateLabel(p)}
            <span onclick="editPhotoDate('${p.id}')" style="color:var(--accent);cursor:pointer;margin-left:4px;">수정</span>
          </div>
        </div>
      `;
      grid.appendChild(el);
    });
  });
}

window.togglePhotoSelect = function(id){

  if(selectedPhotoIds.has(id)){

  }

};

function updateSelCount(){

window.toggleSelectAllPhotos = function(){
  const allIds = Object.keys(photoCache);
  const allSelected = allIds.length > 0 && allIds.every(id => selectedPhotoIds.has(id));
  if(allSelected){
    selectedPhotoIds.clear();
  } else {
    allIds.forEach(id => selectedPhotoIds.add(id));
  }
  allIds.forEach(id=>{
    const el = document.getElementById('photo-item-' + id);
    const cb = el ? el.querySelector('.sel-check') : null;
    if(el) el.classList.toggle('selected', selectedPhotoIds.has(id));
    if(cb) cb.checked = selectedPhotoIds.has(id);
  });
  updateSelCount();
};

async function uploadFile(){
  const fileInput = document.getElementById('docFile');
  const files = Array.from(fileInput.files);
  if(files.length===0){ alert('파일을 선택해주세요.'); return; }
  const cat = document.getElementById('docCat').value;
  const progEl = document.getElementById('fileProgress');
  const barWrap = document.getElementById('fileProgressBarWrap');
  const bar = document.getElementById('fileProgressBar');
  barWrap.style.display = 'block';
  try{
    for(let i=0; i<files.length; i++){
      let file = files[i];
      file = await toUploadFile(file);
      progEl.textContent = `업로드 중... (${i+1}/${files.length}) ${file.name} 0%`;
      bar.style.width = '0%';
      const path = `files/${Date.now()}_${file.name}`;
      const sref = ref(storage, path);
      const url = await uploadWithProgress(sref, file, (pct)=>{
        progEl.textContent = `업로드 중... (${i+1}/${files.length}) ${file.name} ${pct}%`;
        bar.style.width = pct + '%';
      });
      await addDoc(collection(db,'files'), {
        url, storagePath: path, filename: file.name, category: cat,
        uploadedAt: serverTimestamp()
      });
    }
    progEl.textContent = `업로드 완료 (${files.length}개)`;
    bar.style.width = '100%';
    setTimeout(()=>{ barWrap.style.display = 'none'; }, 800);
    fileInput.value = '';
    loadFiles();
  }catch(e){
    console.error(e);
    progEl.textContent = '업로드 실패: ' + e.message;
    barWrap.style.display = 'none';
  }
}

  const stage = document.getElementById('editStage-'+id).value;
  const title = document.getElementById('editTitle-'+id).value;
  const date = document.getElementById('editDate-'+id).value;
  const status = document.getElementById('editStatus-'+id).value;
  if(!title){ alert('내용을 입력해주세요.'); return; }
  await setDoc(doc(db,'schedule',id), {track, stage, title, date, status}, {merge:true});
  loadSchedule();
};

window.delSchedule = async function(id){
  if(!confirm('삭제하시겠습니까?')) return;
  await deleteDoc(doc(db,'schedule',id));
  loadSchedule();
};

// ==== 공사진행: 단계별 진도율 ====
const CONSTRUCTION_STAGES = ['철거','기초','골조','외부마감','내부마감','준공'];

async function loadStageProgress(){
  const grid = document.getElementById('stageGrid');
  if(!grid) return;
  grid.innerHTML = '';
  for(const stage of CONSTRUCTION_STAGES){
    const snap = await getDoc(doc(db,'constructionStages',stage));
    const data = snap.exists() ? snap.data() : {progress:0};
    const pct = data.progress || 0;
    const card = document.createElement('div');
    card.className = 'track-card';
    card.innerHTML = `
      <div class="label">${stage}</div>
      <div class="status" style="font-size:1.3em;">${pct}%</div>
      <div style="background:var(--border);border-radius:6px;height:8px;overflow:hidden;margin-bottom:8px;">
        <div style="background:var(--accent);height:100%;width:${pct}%;"></div>
      </div>
      <div class="row">
        <input type="text" id="stageInput-${stage}" placeholder="0-100" value="${pct}" style="width:60px;">
        <button class="save" onclick="saveStageProgress('${stage}')">저장</button>
      </div>
    `;
    grid.appendChild(card);
  }
}

window.saveStageProgress = async function(stage){
  let val = parseInt(document.getElementById('stageInput-'+stage).value, 10);
  if(isNaN(val)) val = 0;
  val = Math.max(0, Math.min(100, val));
  await setDoc(doc(db,'constructionStages',stage), {progress: val, updatedAt: serverTimestamp()});
  loadStageProgress();
  loadOverallProgress();
};

// ==== 법률의견 AI분석 ====
async function uploadLegal(){
  const fileInput = document.getElementById('legalFile');
  const file = fileInput.files[0];
  if(!file){ alert('법률의견 문서를 선택해주세요.'); return; }
  const cat = document.getElementById('legalCat').value;
  const progEl = document.getElementById('legalProgress');
  progEl.textContent = '업로드 중...';
  try{
    const path = `legal/${Date.now()}_${file.name}`;
    const sref = ref(storage, path);
    const url = await uploadWithProgress(sref, file, (pct)=>{
      progEl.textContent = `업로드 중... ${pct}%`;
    });
    const docRef = await addDoc(collection(db,'legalOpinions'), {
      url, storagePath: path, filename: file.name, category: cat,
      analysis: '', analysisStatus: 'pending',
      uploadedAt: serverTimestamp()
    });
    progEl.textContent = 'AI 분석 요청 중... (문서 길이에 따라 30초~1분 소요)';
    fileInput.value = '';
    loadLegal();
    await requestAnalysis(docRef.id);
    progEl.textContent = '분석 완료';
  }catch(e){
    console.error(e);
    progEl.textContent = '업로드 실패: ' + e.message;
  }
}
window.uploadLegal = uploadLegal;

async function requestAnalysis(docId){
  if(!LEGAL_ANALYZE_URL || LEGAL_ANALYZE_URL.includes('여기에')){
    alert('아직 AI 분석 함수 URL이 설정되지 않았습니다. 관리자에게 문의해주세요.');
    return;
  }
  try{
    const resp = await fetch(LEGAL_ANALYZE_URL, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ docId })
    });
    const data = await resp.json();
    if(!resp.ok) throw new Error(data.error || '분석 실패');
    await setDoc(doc(db,'legalOpinions',docId), {
      analysis: data.analysis, analysisStatus: 'done'
    }, {merge:true});
  }catch(e){
    console.error(e);
    await setDoc(doc(db,'legalOpinions',docId), {
      analysis: 'AI 분석 실패: ' + e.message, analysisStatus: 'error'
    }, {merge:true});
  }
  loadLegal();
}
window.requestAnalysis = requestAnalysis;

async function loadLegal(){
  const list = document.getElementById('legalList');
  list.innerHTML = '<div class="empty">불러오는 중...</div>';
  const q = query(collection(db,'legalOpinions'), orderBy('uploadedAt','desc'));
  const snap = await getDocs(q);
  if(snap.empty){ list.innerHTML = '<div class="empty">등록된 법률의견 문서가 없습니다.</div>'; return; }
  list.innerHTML = '';
  snap.forEach(d=>{
    const f = d.data();
    const badgeClass = f.analysisStatus === 'done' ? 'done' : (f.analysisStatus === 'error' ? 'error' : 'pending');
    const badgeLabel = f.analysisStatus === 'done' ? '분석완료' : (f.analysisStatus === 'error' ? '분석실패' : '분석대기');
    const el = document.createElement('div');
    el.className = 'legal-item';
    el.innerHTML = `
      <div class="top">
        <span class="ftag" style="background:var(--accent-light);color:var(--accent);padding:2px 8px;border-radius:10px;font-size:var(--fs-min);font-weight:500;">${f.category||'기타'}</span>
        <span class="fname">${f.filename}</span>
        <span class="badge ${badgeClass}">${badgeLabel}</span>
      </div>
      <div class="fdate">${f.uploadedAt ? formatTs(f.uploadedAt) : ''}</div>
      ${f.analysis ? `<div class="analysis"><div class="analysis-label">AI 분석 결과</div>${f.analysis}</div>` : ''}
      <div class="actions">
        <a href="${f.url}" target="_blank">원문 열기</a>
        <span onclick="requestAnalysis('${d.id}')">재분석</span>
        <span class="del" onclick="delLegal('${d.id}','${f.storagePath}')">삭제</span>
      </div>
    `;
    list.appendChild(el);
  });
}

window.delLegal = async function(id, path){
  if(!confirm('삭제하시겠습니까?')) return;
  await deleteDoc(doc(db,'legalOpinions',id));
  try{ await deleteObject(ref(storage, path)); }catch(e){}
  loadLegal();
};

// 모든 함수/상수 선언이 끝난 뒤 실행 (초기화 순서 오류 방지)
boot();
</script>
