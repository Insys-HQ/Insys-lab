<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--w:440px;--navy:#1f3a5f;--ink:#1f2937;--sub:#4b5563;--line:#d5dbe5;--bg:#eef1f6;--card:#fff;--wash:#2f5d8a;--ship:#3b7d6e;--pastel:#e6edf6;--neg:#9b2c2c;--pos:#1f6f4a}
*{box-sizing:border-box}
html{font-size:14px}
@media (min-width:768px){html{font-size:16px}}
body{margin:0;font-family:'Noto Sans KR',sans-serif;color:var(--ink);background:var(--bg);line-height:1.45}
body.mode-p{--w:1100px}
button,input,select{font-family:inherit;font-size:1rem}
[hidden]{display:none!important}

/* nav / header : 배경은 전체폭, 내용은 .nav-inner */
.nav{background:var(--navy);color:#fff}
.nav-inner{max-width:var(--w);margin:0 auto;padding:8px 12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.nav h1{margin:0;font-size:1.15rem;font-weight:700;flex:1;min-width:0}
.ver{font-size:.875rem;background:#dbe6f5;color:var(--navy);border-radius:10px;padding:1px 8px;font-weight:700}
.seg{display:flex;border:1px solid #9fb4d1;border-radius:6px;overflow:hidden}
.seg button{background:transparent;color:#dbe6f5;border:0;padding:4px 10px;cursor:pointer}
.seg button.on{background:#dbe6f5;color:var(--navy);font-weight:700}
.conf{background:#f6e3e3;color:#7a1f1f;border-bottom:1px solid #e3bcbc}
.conf .nav-inner{padding:5px 12px;justify-content:center;font-weight:700}

.wrap{max-width:var(--w);margin:8px auto;padding:0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:0 0 8px}
.card h2{margin:0 0 6px;font-size:1.05rem;color:var(--navy);font-weight:700}
.row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.btn{border:1px solid var(--navy);background:var(--navy);color:#fff;border-radius:6px;padding:6px 12px;cursor:pointer;font-weight:500}
.btn.ghost{background:#fff;color:var(--navy)}
.btn.danger{background:#fff;color:var(--neg);border-color:var(--neg)}
.btn:disabled{opacity:.45;cursor:default}
.status{font-size:.9rem;color:var(--sub);margin-top:6px}
.status.ok{color:var(--pos)}
.status.err{color:var(--neg);font-weight:500}

.drop{display:block;border:2px dashed #9fb4d1;border-radius:8px;padding:12px;text-align:center;background:#f6f9fd;cursor:pointer;color:var(--navy);font-weight:500}
.drop.over{background:#e1ecf9}
.drop input{display:none}
.drop small{display:block;color:var(--sub);font-weight:400}

.pv{border:1px solid var(--line);border-radius:6px;padding:8px 10px;margin:6px 0 0;background:#fafbfd}
.pv .pvh{font-weight:700;color:var(--navy);word-break:break-all}
.pv .pvm{font-size:.93rem;color:var(--ink);margin-top:2px}
.pv input[type=date]{border:1px solid var(--line);border-radius:4px;padding:2px 6px;color:var(--ink)}
.tag{display:inline-block;font-size:.875rem;border-radius:10px;padding:0 8px;font-weight:700;margin-left:4px}
.tag.new{background:#dcefe4;color:var(--pos)}
.tag.ow{background:#fbe9c8;color:#7a4a05}
.tag.un{background:#f6e3e3;color:var(--neg)}
.warn{color:#7a4a05;font-size:.9rem;margin-top:2px}
.pvbtn{margin-top:8px}

.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin:0 0 8px}
body.mode-p .kpis{grid-template-columns:repeat(6,1fr)}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.kpi .kl{font-size:.9rem;color:var(--sub)}
.kpi .kv{font-size:1.3rem;font-weight:700;color:var(--navy);line-height:1.25;word-break:keep-all}
.kpi .kv.neg{color:var(--neg)}
.kpi .ks{font-size:.875rem;color:var(--sub)}
.kpi.w .kv{color:var(--wash)}
.kpi.s .kv{color:var(--ship)}

.legend{font-size:.9rem;color:var(--sub);margin:0 0 4px}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin:0 3px 0 8px;vertical-align:baseline}
.sw.w{background:var(--wash)}.sw.s{background:var(--ship)}
.catrow{display:flex;gap:8px;align-items:center;padding:4px 0;border-bottom:1px solid #edf0f5}
.catrow .cn{width:76px;flex:none;font-weight:700;color:var(--navy);word-break:keep-all}
.catrow .bars{flex:1;min-width:0}
.bl{display:flex;align-items:center;gap:6px}
.bl .trk{flex:1;height:10px;background:#eef1f6;border-radius:3px;overflow:hidden}
.bl .f{display:block;height:100%;border-radius:3px}
.bl .f.w{background:var(--wash)}.bl .f.s{background:var(--ship)}
.bl b{width:78px;text-align:right;font-weight:500;font-size:.93rem}
.catsum{display:flex;justify-content:space-between;gap:8px;padding-top:6px;font-weight:700;color:var(--navy);flex-wrap:wrap}

.opts{display:flex;gap:12px;flex-wrap:wrap;margin:0 0 6px;font-size:.95rem}
.opts label{display:flex;align-items:center;gap:4px;cursor:pointer}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.93rem}
th,td{padding:5px 4px;border-bottom:1px solid #e5e9f0;text-align:right;white-space:nowrap;vertical-align:top}
th{background:var(--pastel);color:var(--navy);font-weight:700;line-height:1.25;position:sticky;top:0}
th:first-child,td:first-child{text-align:left;white-space:normal;min-width:70px}
body.mode-p th,body.mode-p td{padding:5px 8px}
th.hw{border-bottom:2px solid var(--wash)}
th.hs{border-bottom:2px solid var(--ship)}
tr.cat td{background:#f1f4f9;font-weight:700;color:var(--navy)}
tr.cur td{background:#e7eefb}
tr.clk{cursor:pointer}
tr.tot td{background:var(--pastel);font-weight:700;color:var(--navy)}
.zero{color:#7b8696}
.nt{display:block;font-size:.875rem;color:var(--sub);font-weight:400}
.optc{display:none}
table.showopt .optc{display:table-cell}
.pcc{display:none}
body.mode-p .pcc{display:table-cell}
.cnt{font-size:.9rem;color:var(--sub);margin-top:4px}

.chart{display:flex;gap:3px;align-items:flex-end;margin:4px 0 6px}
.chart .col{flex:1;min-width:0;max-width:48px;text-align:center;cursor:pointer;border-radius:4px;padding:2px 0}
.chart .col.cur{background:#e7eefb}
.chart .pair{height:92px;display:flex;align-items:flex-end;justify-content:center;gap:2px}
.chart .bb{display:block;width:42%;max-width:14px;min-height:1px;border-radius:2px 2px 0 0}
.chart .bb.w{background:var(--wash)}.chart .bb.s{background:var(--ship)}
.chart span{display:block;font-size:.875rem;color:var(--sub)}
.tscroll{max-height:300px;overflow:auto}

.foot{background:#dfe5ee;color:var(--ink);margin-top:8px}
.foot .nav-inner{justify-content:space-between;padding:6px 12px;font-size:.9rem}

.modal{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:12px}
.mbox{background:#fff;border-radius:8px;padding:12px;max-width:380px;width:100%}
.mbox p{margin:0 0 10px;word-break:keep-all}
.mbtn{display:flex;justify-content:flex-end;gap:6px}
.toast{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:#1f2937;color:#fff;padding:8px 14px;border-radius:8px;z-index:60;max-width:92vw;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.empty{color:var(--sub);text-align:center;padding:6px 0}
.prog{width:100%;height:10px;margin-top:6px}
.imgs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
body.mode-p .imgs{grid-template-columns:repeat(6,1fr)}
.imgs img{width:100%;height:84px;object-fit:cover;border:1px solid var(--line);border-radius:6px;cursor:pointer;background:#fff}
.ocrbox{margin-top:6px}
.ocrbox summary{cursor:pointer;color:var(--navy);font-weight:700}
.ocrt td:first-child,.ocrt th:first-child{min-width:120px}
.ocrt input{width:64px;border:1px solid var(--line);border-radius:4px;padding:2px 4px;text-align:right;color:var(--ink);background:#fff}
.ocrt input.nm{width:100%;text-align:left}
.ocrt input.bad,.tin input.bad{border-color:#c05050;background:#fdeeee}
.tin{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;font-size:.93rem}
.tin label{display:flex;align-items:center;gap:4px}
.tin input{width:104px;border:1px solid var(--line);border-radius:4px;padding:2px 4px;text-align:right;color:var(--ink);background:#fff}
.vimg{max-width:100%;max-height:68vh;display:block;margin:0 auto 8px}
</style>
</head>

<script>
(function(){
'use strict';
var VERSION='v1.2';
var COLL='jeonju_wash_daily';
var FBCFG={apiKey:"AIzaSyBYqd2uRr1ZvFLDCWuS15h9qFkT-Dvg5Es",authDomain:"insys-work.firebaseapp.com",projectId:"insys-work",storageBucket:"insys-work.firebasestorage.app",messagingSenderId:"225275784859",appId:"1:225275784859:web:bd12815c6dc47c0c49e03e"};

var db=null, storage=null, fbOK=false;
var imgOpen=false, viewImg=null, busy=false;
var reports={};      // date -> doc
var dates=[];        // 최신순
var cur=null;
var pending=[];
var opt={zero:false,inq:false,note:false};

function $(id){return document.getElementById(id)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function fmt(n){return Math.round(n||0).toLocaleString('ko-KR')}
function f0(n){return n?fmt(n):'-'}
function sgn(n){n=Math.round(n||0);return (n>0?'+':n<0?'-':'')+Math.abs(n).toLocaleString('ko-KR')}
function p2(n){return String(n).padStart(2,'0')}
function ns(v){return String(v==null?'':v).replace(/\s+/g,'')}
function str(v){return String(v==null?'':v).trim()}
function hasNum(v){return typeof v==='number'&&isFinite(v)}
function toNum(v){
  if(typeof v==='number')return isFinite(v)?v:0;
  if(typeof v==='string'){var t=v.replace(/[,\s]/g,'');if(t===''||t==='-')return 0;var x=parseFloat(t);return isFinite(x)?x:0}
  return 0;
}
function wd(d){var a=d.split('-');return ['일','월','화','수','목','금','토'][new Date(+a[0],+a[1]-1,+a[2]).getDay()]}
function dlabel(d){return d+' ('+wd(d)+')'}
function md(d){return d.slice(5).replace('-','/')}
function isActive(it){return !!(it.wQty||it.sQty||it.wAmt||it.sAmt)}

function toast(msg){
  var t=$('toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(toast._t);toast._t=setTimeout(function(){t.classList.remove('show')},2800);
}
function setStatus(msg,cls){var s=$('status');s.textContent=msg;s.className='status'+(cls?' '+cls:'')}
function askConfirm(msg,yes){
  return new Promise(function(res){
    $('mMsg').textContent=msg;$('mYes').textContent=yes||'확인';$('modal').hidden=false;
    function done(v){$('modal').hidden=true;$('mYes').onclick=null;$('mNo').onclick=null;res(v)}
    $('mYes').onclick=function(){done(true)};
    $('mNo').onclick=function(){done(false)};
  });
}

/* ---------- Firebase ---------- */
function initFB(){
  try{
    if(!window.firebase)throw new Error('Firebase SDK 로드 실패');
    firebase.initializeApp(FBCFG);
    db=firebase.firestore();fbOK=true;
    try{storage=firebase.storage()}catch(e2){storage=null}
  }catch(e){fbOK=false;setStatus('Firebase 연결 실패: '+(e.message||e),'err')}
}
function refreshDates(){dates=Object.keys(reports).sort().reverse()}
async function loadAll(){
  if(!fbOK){refreshDates();render();return}
  setStatus('불러오는 중…');
  try{
    var snap=await db.collection(COLL).orderBy('date','desc').limit(400).get();
    reports={};
    snap.forEach(function(d){var v=d.data();if(v&&v.date)reports[v.date]=v});
    setStatus('Firebase 연결됨 · 저장된 일보 '+Object.keys(reports).length+'건','ok');
  }catch(e){
    setStatus('불러오기 실패: '+(e.message||e)+' (Firestore 규칙·네트워크 확인)','err');
  }
  refreshDates();
  if(!cur||!reports[cur])cur=dates[0]||null;
  render();
}

/* ---------- 엑셀 파싱 ---------- */
function parseDateCell(v){
  if(typeof v==='number'&&v>30000&&v<80000){
    var o=XLSX.SSF.parse_date_code(v);
    if(o)return o.y+'-'+p2(o.m)+'-'+p2(o.d);
  }
  if(typeof v==='string'){
    var m=v.match(/(\d{4})\s*[-./년]\s*(\d{1,2})\s*[-./월]\s*(\d{1,2})/);
    if(m)return m[1]+'-'+p2(m[2])+'-'+p2(m[3]);
  }
  return null;
}
function parseRows(rows,fileName){
  var warn=[];
  var date=null,i,j,k;
  for(i=0;i<Math.min(rows.length,8)&&!date;i++){
    var r0=rows[i]||[];
    for(j=0;j<r0.length;j++){
      if(ns(r0[j]).indexOf('작업일')>=0){
        for(k=j;k<r0.length;k++){var d=parseDateCell(r0[k]);if(d){date=d;break}}
        break;
      }
    }
  }
  if(!date){
    var fm=String(fileName||'').match(/(\d{4})[-_.]?(\d{2})[-_.]?(\d{2})/);
    if(fm){date=fm[1]+'-'+fm[2]+'-'+fm[3];warn.push('작업일을 찾지 못해 파일명에서 날짜를 추정했습니다.')}
    else warn.push('작업일을 찾지 못했습니다. 날짜를 직접 입력하세요.');
  }
  var hr=-1;
  for(i=0;i<rows.length;i++){
    if((rows[i]||[]).some(function(c){return ns(c).toUpperCase()==='PAT/BOX'})){hr=i;break}
  }
  if(hr<0)return {error:'양식 헤더(PAT/BOX)를 찾지 못했습니다.'};

  var col={cat:0,item:1,sub:2,inq:3,price:4,wPat:5,wQty:6,wAmt:7,sPat:8,sQty:9,sAmt:10,note:11};
  var pat=[],amt=[];
  for(i=0;i<=hr;i++){
    (rows[i]||[]).forEach(function(c,jj){
      var t=ns(c);if(!t)return;
      if(t==='입수량')col.inq=jj;
      else if(t==='단가')col.price=jj;
      else if(t==='세척수량')col.wQty=jj;
      else if(t==='출고수량')col.sQty=jj;
      else if(t==='비고')col.note=jj;
      else if(t==='구분')col.cat=jj;
      else if(t==='품목')col.item=jj;
      else if(t.toUpperCase()==='PAT/BOX')pat.push(jj);
      else if(t==='금액')amt.push(jj);
    });
  }
  if(pat.length>=2){col.wPat=pat[0];col.sPat=pat[1]}
  if(amt.length>=2){col.wAmt=amt[0];col.sAmt=amt[1]}
  col.sub=col.item+1;

  var items=[],cat='',lastItem='';
  var dayWash=null,dayShip=null,cumWash=null,cumShip=null;
  for(i=hr+1;i<rows.length;i++){
    var r=rows[i]||[];
    var a=str(r[col.cat]),b=str(r[col.item]),c=str(r[col.sub]);
    var label=ns(r[col.cat])+ns(r[col.item]);
    if(/누적/.test(label)&&/실적/.test(label)){
      var nc=r.filter(hasNum);
      if(nc.length>=2){cumWash=nc[0];cumShip=nc[1]}else warn.push('누적 실적 값을 읽지 못했습니다.');
      continue;
    }
    if(/일일실적|^일실적/.test(label)){
      var nd=r.filter(hasNum);
      if(nd.length>=2){dayWash=nd[0];dayShip=nd[1]}else warn.push('일일 실적 값을 읽지 못했습니다.');
      continue;
    }
    var hasData=[r[col.inq],r[col.price],r[col.wQty],r[col.sQty],r[col.wAmt],r[col.sAmt],r[col.wPat],r[col.sPat]].some(function(v){return v!=null&&v!==''});
    if(!a&&!b&&!c&&!hasData)continue;
    var item;
    if(a){
      cat=a;
      if(!b){item=a;lastItem=''}else{item=b;lastItem=b}
    }else if(b){lastItem=b;item=b}
    else if(c){item=lastItem}
    else continue;
    var name=[item,c].filter(Boolean).join(' ');
    if(!name)continue;
    items.push({
      cat:cat||'(미분류)',name:name,
      inQty:toNum(r[col.inq]),price:toNum(r[col.price]),
      wPat:toNum(r[col.wPat]),wQty:toNum(r[col.wQty]),wAmt:toNum(r[col.wAmt]),
      sPat:toNum(r[col.sPat]),sQty:toNum(r[col.sQty]),sAmt:toNum(r[col.sAmt]),
      note:str(r[col.note])
    });
  }
  if(!items.length)return {error:'품목 행을 찾지 못했습니다.'};
  var calcW=0,calcS=0;
  items.forEach(function(it){calcW+=it.wAmt;calcS+=it.sAmt});
  if(dayWash==null||dayShip==null){
    dayWash=calcW;dayShip=calcS;warn.push('일일 실적 행이 없어 품목 합계로 계산했습니다.');
  }else{
    if(Math.abs(dayWash-calcW)>10)warn.push('세척 합계 차이 '+sgn(dayWash-calcW)+'원 (엑셀 합계 기준으로 표시)');
    if(Math.abs(dayShip-calcS)>10)warn.push('출고 합계 차이 '+sgn(dayShip-calcS)+'원 (엑셀 합계 기준으로 표시)');
  }
  return {doc:{
    date:date||'',items:items,
    dayWash:dayWash,dayShip:dayShip,cumWash:cumWash,cumShip:cumShip,
    calcWash:calcW,calcShip:calcS,itemCount:items.length,
    version:VERSION,sourceFile:String(fileName||''),uploadedAt:''
  },warn:warn};
}

async function handleFiles(fileList){
  var files=Array.prototype.slice.call(fileList||[]);
  if(!files.length)return;
  if(busy){toast('분석 중입니다. 잠시 후 다시 시도하세요.');return}
  if(!window.XLSX){toast('엑셀 라이브러리를 불러오지 못했습니다.');return}
  busy=true;
  try{
  pending=[];
  for(var n=0;n<files.length;n++){
    var f=files[n];
    if(isImg(f)){await handleImage(f);continue}
    try{
      var buf=await f.arrayBuffer();
      var wb=XLSX.read(buf,{type:'array'});
      var okCount=0,lastErr='';
      for(var s=0;s<wb.SheetNames.length;s++){
        var sn=wb.SheetNames[s];
        var rows=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,raw:true,defval:null,blankrows:true});
        var res=parseRows(rows,f.name);
        if(res.error){lastErr=res.error;continue}
        okCount++;
        pending.push({file:f.name,sheet:sn,doc:res.doc,warn:res.warn});
      }
      if(!okCount)pending.push({file:f.name,sheet:'',error:lastErr||'읽을 수 있는 시트가 없습니다.'});
    }catch(e){
      pending.push({file:f.name,sheet:'',error:'파일 읽기 실패: '+(e.message||e)});
    }
  }
  $('file').value='';
  setProg('',null);
  setStatus('파일 분석 완료 — 아래 미리보기를 확인하고 저장하세요.');
  renderPending();
  }finally{busy=false}
}

async function uploadImage(date,file){

function grayOf(cv){
  var W=cv.width,H=cv.height,d=cv.getContext('2d').getImageData(0,0,W,H).data,g=new Uint8Array(W*H),i,p;
  for(i=0,p=0;i<g.length;i++,p+=4)g[i]=(d[p]*299+d[p+1]*587+d[p+2]*114)/1000;
  var hist=new Array(256).fill(0),acc=0,med=0;
  for(i=0;i<g.length;i++)hist[g[i]]++;

}
function groupIdx(arr,gap,maxW){
  var out=[],st=null,pr=null;
  function push(){if(st!==null&&(pr-st+1)<=maxW)out.push(Math.round((st+pr)/2))}
  arr.forEach(function(v){if(st===null){st=v;pr=v;return}if(v-pr<=gap){pr=v}else{push();st=v;pr=v}});
  push();

}
function detectGrid(cv){
  var G=grayOf(cv),W=G.W,H=G.H,g=G.g,med=G.med,TH=35,x,y,rs=[],cs=[];
  for(y=0;y<H;y++){var c=0,o=y*W;for(x=0;x<W;x++){if(Math.abs(g[o+x]-med)>TH)c++}if(c/W>0.6)rs.push(y)}

function hasH(G,y,xa,xb){
  var n=0,t=0,x,dy,hit,yy;
  for(x=Math.max(0,Math.round(xa));x<Math.min(G.W,Math.round(xb));x++){
    t++;hit=false;

function hasV(G,x,ya,yb){
  var n=0,t=0,y,dx,hit,xx;

    t++;hit=false;
    for(dx=-1;dx<=1;dx++){xx=x+dx;if(xx>=0&&xx<G.W&&Math.abs(G.g[y*G.W+xx]-G.med)>35){hit=true;break}}
    if(hit)n++;

function inkInfo(G,x0,y0,x1,y1){
  x0=Math.max(0,Math.round(x0));y0=Math.max(0,Math.round(y0));x1=Math.min(G.W,Math.round(x1));y1=Math.min(G.H,Math.round(y1));

  var vals=[],g=G.g,x,y;
  for(y=y0;y<y1;y++)for(x=x0;x<x1;x++)vals.push(g[y*G.W+x]);
  vals.sort(function(a,b){return a-b});
  var bg=vals[vals.length>>1],n=0,mnx=1e9,mxx=-1,mny=1e9,mxy=-1;

function prepCanvas(cv,x0,y0,x1,y1,sc){
  var w=Math.max(1,Math.round(x1-x0)),h=Math.max(1,Math.round(y1-y0)),pad=8;
  var c=document.createElement('canvas');c.width=w*sc+pad*2;c.height=h*sc+pad*2;
  var ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);
  var t=document.createElement('canvas');t.width=w*sc;t.height=h*sc;
  var tc=t.getContext('2d');tc.imageSmoothingEnabled=true;tc.imageSmoothingQuality='high';
  tc.drawImage(cv,Math.round(x0),Math.round(y0),w,h,0,0,w*sc,h*sc);

  for(i=0;i<n;i++){gs[i]=(d[i*4]*299+d[i*4+1]*587+d[i*4+2]*114)/1000;s+=gs[i]}

  for(i=0;i<n;i++){v=inv?255-gs[i]:gs[i];gs[i]=v;if(v<lo)lo=v;if(v>hi)hi=v}

  for(i=0;i<n;i++){v=(gs[i]-lo)*255/range;d[i*4]=v;d[i*4+1]=v;d[i*4+2]=v;d[i*4+3]=255}

}
async function drain(workers,list,tick){
  var next=0;
  async function loop(w){
    while(next<list.length){
      var j=list[next++];
      try{var r=await w.recognize(j.cv);j.text=(r.data.text||'').trim();j.conf=r.data.confidence}catch(e){j.text='';j.conf=0}
      tick();
    }
  }
  await Promise.all(workers.map(loop));
}
function cleanKo(t){return String(t||'').replace(/\n+/g,' ').replace(/([가-힣])\s+(?=[가-힣])/g,'$1').replace(/[|\\_~`]/g,'').replace(/\s+/g,' ').trim()}
function numFrom(t){var s=String(t==null?'':t).replace(/[^0-9]/g,'');return s?parseInt(s,10):null}
function lev(a,b){
  var m=a.length,n=b.length,d=[],i,j;
  for(i=0;i<=m;i++)d[i]=[i];
  for(j=1;j<=n;j++)d[0][j]=j;
  for(i=1;i<=m;i++)for(j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  return d[m][n];
}
function fuzzy(t,set,ratio){
  if(!t||!set||!set.length)return t;
  var best=null,bd=1e9;
  set.forEach(function(s){var d=lev(t,s);if(d<bd){bd=d;best=s}});
  return (best!==null&&bd<=Math.floor(Math.max(t.length,best.length)*ratio))?best:t;
}
function knownSets(){
  var n={},c={},w={};
  Object.keys(reports).forEach(function(d){
    (reports[d].items||[]).forEach(function(it){
      if(it.name)n[it.name]=1;if(it.cat)c[it.cat]=1;
      String(it.note||'').split(/[,，、.\s]+/).forEach(function(x){if(x)w[x]=1});
    });
  });
  return {names:Object.keys(n),cats:Object.keys(c),workers:Object.keys(w)};
}
function fixNote(t,workers){

}
async function getOcr(){

  var eng=await Promise.all([0,1,2].map(function(){return mk('eng',{tessedit_char_whitelist:'0123456789,.-',tessedit_pageseg_mode:'7'})}));

function blankDoc(name){

}
function calcWarn(d){

  d.items.forEach(function(it){cw+=it.wAmt;cs+=it.sAmt});
  d.calcWash=cw;d.calcShip=cs;d.itemCount=d.items.length;
  if(d.dayWash!=null&&Math.abs(d.dayWash-cw)>10)w.push('세척 합계 차이 '+sgn(d.dayWash-cw)+'원 (일일 실적과 품목 합계가 다릅니다)');

async function ocrImage(cv){

  if(xs.length===12)xs.push(G.W-1);

  if(ys.length<8)return {error:'표의 행 구분선을 찾지 못했습니다.'};
  var nR=ys.length-1,hts=[];
  for(k=0;k<nR;k++)hts.push(ys[k+1]-ys[k]);
  var hm=hts.slice().sort(function(a,b){return a-b})[nR>>1],ds=4;
  for(k=0;k<Math.min(6,nR);k++){if(hts[k]>hm*1.4){ds=k+1;break}}
  var nData=(nR-2)-ds;

  var master=dates.length?(reports[dates[0]].items||null):null;
  var aligned=!!(master&&master.length===nData);
  var known=knownSets(),jobs=[],map={};
  function cell(ci,kk){return [xs[ci]+3,ys[kk]+3,xs[ci+1]-3,ys[kk+1]-3]}

  for(k=0;k<Math.min(ds,4);k++)addJob('d:'+k,'n',[xs[1]+3,ys[k]+3,xs[3]-3,ys[k+1]-3]);

    var kk=ds+r;

    if(!aligned)[3,4].forEach(function(ci){addJob('n:'+r+':'+ci,'n',cell(ci,kk))});
    addJob('t:'+r+':note','t',cell(11,kk));
  }
  [nR-2,nR-1].forEach(function(kt,ix){
    addJob('n:tot'+ix+':w','n',[xs[5]+3,ys[kt]+3,xs[8]-3,ys[kt+1]-3]);

      aStart[r]=(r===0||hasH(G,ys[k0],xs[0]+4,xs[1]-4))?r:aStart[r-1];
      bStart[r]=(r===0||mab[r]||mab[r-1]||hasH(G,ys[k0],xs[1]+4,xs[2]-4))?r:bStart[r-1];
    }
    for(r=0;r<nData;r++){
      if(mab[r]){addJob('t:ab:'+r,'t',[xs[0]+3,ys[ds+r]+3,xs[2]-3,ys[ds+r+1]-3]);continue}
      if(aStart[r]===r){
        e=r;while(e+1<nData&&aStart[e+1]===r&&!mab[e+1])e++;
        addJob('t:a:'+r,'t',[xs[0]+3,ys[ds+r]+3,xs[1]-3,ys[ds+e+1]-3]);
      }
      if(bStart[r]===r){
        e=r;while(e+1<nData&&bStart[e+1]===r&&!mab[e+1])e++;
        addJob('t:b:'+r,'t',[xs[1]+3,ys[ds+r]+3,xs[2]-3,ys[ds+e+1]-3]);
      }

  function tick(){done++;setProg('이미지 인식 중… '+done+'/'+total,done,total)}
  setProg('이미지 인식 중… 0/'+total,0,total);
  await Promise.all([
    drain(w.eng,jobs.filter(function(j){return j.kind==='n'}),tick),
    drain([w.kor],jobs.filter(function(j){return j.kind==='t'}),tick)
  ]);
  function nv(key){var j=map[key];if(!j)return {v:0,low:false};var v=numFrom(j.text);return {v:v==null?0:v,low:(v==null||j.conf<65)}}

      subOf[r]=tx('t:c:'+r);
    }
    for(r=0;r<nData;r++){
      if(mab[r])continue;
      if(aStart[r]===r){var ta=tx('t:a:'+r);for(e=r;e<nData&&aStart[e]===r&&!mab[e];e++)catOf[e]=ta}
      if(bStart[r]===r){var tb=tx('t:b:'+r);for(e=r;e<nData&&bStart[e]===r&&!mab[e];e++)itemOf[e]=tb}

    [['wPat',5],['wQty',6],['wAmt',7],['sPat',8],['sQty',9],['sAmt',10]].forEach(function(fc){

    });

    if(m2&&+m2[2]>=1&&+m2[2]<=12&&+m2[3]>=1&&+m2[3]<=31){date=m2[1]+'-'+p2(m2[2])+'-'+p2(m2[3]);break}
  }
  function tv(key){var j=map[key];return j?numFrom(j.text):null}
  var doc=blankDoc('');
  doc.date=date;doc.items=items;
  doc.dayWash=tv('n:tot0:w');doc.dayShip=tv('n:tot0:s');doc.cumWash=tv('n:tot1:w');doc.cumShip=tv('n:tot1:s');
  var warn=['화면캡처에서 자동 인식한 값입니다. 붉은 칸과 합계를 반드시 확인하세요.'];
  var cw=0,cs=0;items.forEach(function(x){cw+=x.wAmt;cs+=x.sAmt});

    doc.dayWash=cw;doc.dayShip=cs;warn.push('일일 실적 합계를 인식하지 못해 품목 합계로 계산했습니다.');
  }
  if(aligned)warn.push('지난 일보('+md(dates[0])+')와 행 수가 같아 품목명을 그대로 사용했습니다.');
  else if(master)warn.push('지난 일보와 행 수가 달라(저장 '+master.length+' / 인식 '+nData+') 품목명도 인식했습니다. 품목명을 확인하세요.');
  if(!date)warn.push('작업일을 인식하지 못했습니다. 날짜를 직접 입력하세요.');
  calcWarn(doc);

}

function hasReport(d,ex){
  if(reports[d])return true;
  return pending.some(function(p,j){return j!==ex&&p.doc&&p.doc.date===d&&!p.attachOnly&&p.doc.items.length});
}
function tagFor(i){
  var p=pending[i],d=p&&p.doc?p.doc.date:'';
  if(!/^\d{4}-\d{2}-\d{2}$/.test(d||''))return '<span class="tag un">날짜 필요</span>';
  if(p.attachOnly)return hasReport(d,i)?'<span class="tag new">첨부</span>':'<span class="tag un">해당 일보 없음</span>';
  var later=pending.some(function(q,j){return j>i&&q.doc&&q.doc.date===d&&!q.attachOnly&&q.doc.items.length});
  if(later)return '<span class="tag un">중복(뒤 항목 우선)</span>';
  return reports[d]?'<span class="tag ow">덮어쓰기</span>':'<span class="tag new">신규</span>';
}
function pvSummary(d){var act=d.items.filter(isActive).length;return '품목 '+d.items.length+'개 (실적 '+act+'개) · 세척 '+fmt(d.dayWash)+' · 출고 '+fmt(d.dayShip)}
function warnHtml(arr){return arr.map(function(w){return '<div class="warn">⚠ '+esc(w)+'</div>'}).join('')}
function pvRowBad(it){
  var b={},low=it._low||{};
  Object.keys(low).forEach(function(k){b[k]=1});
  function chk(q,a,qf,af){
    if(q>0&&a<=0){b[af]=1}
    else if(a>0&&q<=0){b[qf]=1}
    else if(q>0&&it.price>0){var ex=q*it.price;if(Math.abs(a-ex)>ex*0.03){b[qf]=1;b[af]=1}}
  }
  chk(it.wQty,it.wAmt,'wQty','wAmt');chk(it.sQty,it.sAmt,'sQty','sAmt');
  if(it.inQty>0){
    if(it.wPat>0&&it.wQty>0&&it.wPat*it.inQty!==it.wQty)b.wPat=1;
    if(it.sPat>0&&it.sQty>0&&it.sPat*it.inQty!==it.sQty)b.sPat=1;
  }
  return b;
}
function ocrTable(p,i){

    h+='<tr><td><input type="text" class="nm" data-i="'+i+'" data-r="'+r+'" data-f="name" value="'+esc(it.name)+'"><span class="nt">'+esc(it.cat)+'</span></td>'

async function saveAll(){
  var list=pending.filter(function(p){return p.doc&&/^\d{4}-\d{2}-\d{2}$/.test(p.doc.date)});
  if(!list.length){toast('저장할 일보가 없습니다. 작업일을 확인하세요.');return}
  $('btnSave').disabled=true;
  var ok=0,fail=0,errMsg='',last=null,imgOk=0,imgFail=0,imgMsg='',i,p;
  var dataList=list.filter(function(q){return !q.attachOnly&&q.doc.items.length});
  var imgList=list.filter(function(q){return q.imgFile});
  for(i=0;i<dataList.length;i++){
    p=dataList[i];
    var doc=Object.assign({},p.doc);
    doc.items=p.doc.items.map(function(it){var c=Object.assign({},it);delete c._low;return c});
    doc.itemCount=doc.items.length;
    doc.uploadedAt=new Date().toISOString();
    var old=reports[doc.date];
    doc.images=old&&old.images?old.images.slice():[];
    try{
      if(!fbOK)throw new Error('Firebase 미연결');
      await db.collection(COLL).doc(doc.date).set(doc);
      ok++;
    }catch(e){fail++;errMsg=e.message||String(e)}
    reports[doc.date]=doc;
    if(!last||doc.date>last)last=doc.date;
  }
  for(i=0;i<imgList.length;i++){
    p=imgList[i];
    var dt=p.doc.date,rep=reports[dt];
    if(!rep){imgFail++;imgMsg='해당 날짜의 일보가 없어 이미지를 첨부할 수 없습니다.';continue}
    setProg('이미지 업로드 중… '+(i+1)+'/'+imgList.length,i,imgList.length);
    try{
      var im=await uploadImage(dt,p.imgFile);
      var next=(rep.images||[]).concat([im]);
      if(!fbOK)throw new Error('Firebase 미연결');
      await db.collection(COLL).doc(dt).update({images:next});
      rep.images=next;imgOk++;
      if(!last||dt>last)last=dt;
    }catch(e2){imgFail++;imgMsg=e2.message||String(e2)}
  }
  setProg('',null);
  pending=[];
  refreshDates();
  if(last)cur=last;
  imgOpen=imgOk>0;
  render();
  if(fail||imgFail){
    var em=[];
    if(fail)em.push('일보 저장 실패 '+fail+'건: '+errMsg+' — 화면에는 표시되지만 새로고침하면 사라집니다.');
    if(imgFail)em.push('이미지 첨부 실패 '+imgFail+'건: '+imgMsg+(imgMsg.indexOf('일보가 없어')<0?' (Storage 규칙 확인)':''));
    setStatus(em.join(' / '),'err');
    toast('저장 실패 '+(fail+imgFail)+'건 (Firebase 규칙 확인)');
  }else{
    setStatus('Firebase 연결됨 · 저장된 일보 '+dates.length+'건','ok');
    toast((ok?ok+'건 저장':'')+(ok&&imgOk?' · ':'')+(imgOk?'이미지 '+imgOk+'장 첨부':'')+'했습니다.');
  }
}

  });
  m+='</tbody>';
  $('monthly').innerHTML=m;
}

/* ---------- 이벤트 ---------- */
function setMode(m){
  document.body.className=m==='p'?'mode-p':'mode-m';
  $('vwM').classList.toggle('on',m!=='p');$('vwP').classList.toggle('on',m==='p');
  $('vwM').setAttribute('aria-pressed',m!=='p');$('vwP').setAttribute('aria-pressed',m==='p');
}
function bind(){
  $('verH').textContent=VERSION;$('verF').textContent=VERSION;
  document.title='전주 세척장 일보 '+VERSION;
  $('vwM').onclick=function(){setMode('m')};
  $('vwP').onclick=function(){setMode('p')};
  $('file').addEventListener('change',function(e){handleFiles(e.target.files)});
  var dp=$('drop');
  ['dragenter','dragover'].forEach(function(ev){dp.addEventListener(ev,function(e){e.preventDefault();dp.classList.add('over')})});
  ['dragleave','drop'].forEach(function(ev){dp.addEventListener(ev,function(e){e.preventDefault();dp.classList.remove('over')})});
  dp.addEventListener('drop',function(e){handleFiles(e.dataTransfer&&e.dataTransfer.files)});
  $('pvList').addEventListener('input',function(e){
    var el=e.target;if(!el||el.type==='checkbox')return;
    var i=+el.getAttribute('data-i'),p=pending[i];if(!p||!p.doc)return;
    var f=el.getAttribute('data-f'),t=el.getAttribute('data-t');
    if(f){
      var r=+el.getAttribute('data-r'),it=p.doc.items[r];if(!it)return;
      if(f==='name')it.name=el.value;
      else{it[f]=numFrom(el.value)||0;if(it._low)delete it._low[f]}
      var bad=pvRowBad(it),tr=el.closest('tr');
      Array.prototype.forEach.call(tr.querySelectorAll('input[data-f]'),function(x){var ff=x.getAttribute('data-f');if(ff!=='name')x.classList.toggle('bad',!!bad[ff])});
      refreshPv(i);
    }else if(t){
      p.doc[t]=el.value.trim()===''?null:numFrom(el.value);refreshPv(i);
    }else if(el.type==='date'){
      p.doc.date=el.value;
      pending.forEach(function(q,j){var tt=$('pvt'+j);if(tt)tt.innerHTML=tagFor(j)});
    }
  });
  $('pvList').addEventListener('change',function(e){
    var el=e.target;if(!el||el.type!=='checkbox')return;
    var i=+el.getAttribute('data-a');
    if(pending[i]){pending[i].attachOnly=el.checked;renderPending()}
  });
  $('pvList').addEventListener('click',function(e){
    var bt=e.target.closest?e.target.closest('[data-del]'):null;if(!bt)return;
    var a=bt.getAttribute('data-del').split(':'),i=+a[0],r=+a[1];
    if(pending[i]&&pending[i].doc){pending[i].doc.items.splice(r,1);renderPending()}
  });
  document.addEventListener('paste',function(e){
    var items=(e.clipboardData&&e.clipboardData.items)||[],files=[],i,f,t=new Date();
    var stamp=p2(t.getHours())+p2(t.getMinutes())+p2(t.getSeconds());
    for(i=0;i<items.length;i++){
      if(items[i].kind==='file'&&/^image\//.test(items[i].type)){
        f=items[i].getAsFile();
        if(f)files.push(new File([f],'붙여넣기_'+stamp+(files.length?'_'+(files.length+1):'')+'.png',{type:f.type||'image/png'}));
      }
    }
    if(!files.length)return;
    e.preventDefault();
    toast('붙여넣은 캡처 '+files.length+'장을 분석합니다.');
    handleFiles(files);
  });
  $('btnSave').onclick=saveAll;
  $('btnCancel').onclick=function(){pending=[];renderPending()};
  $('selDate').onchange=function(){selectDate(this.value)};
  $('btnOlder').onclick=function(){var i=dates.indexOf(cur);if(i<dates.length-1)selectDate(dates[i+1])};
  $('btnNewer').onclick=function(){var i=dates.indexOf(cur);if(i>0)selectDate(dates[i-1])};
  $('btnDel').onclick=async function(){
    if(!cur)return;
    var d=cur,rep=reports[d];
    var yes=await askConfirm(dlabel(d)+' 일보를 삭제할까요? 첨부 이미지도 함께 삭제되며 되돌릴 수 없습니다.','삭제');
    if(!yes)return;
    try{
      if(!fbOK)throw new Error('Firebase 미연결');
      await db.collection(COLL).doc(d).delete();
    }catch(e){
      setStatus('삭제 실패: '+(e.message||e),'err');toast('삭제 실패');return;
    }
    ((rep&&rep.images)||[]).forEach(function(m){if(storage&&m.path){storage.ref(m.path).delete().catch(function(){})}});
    delete reports[d];refreshDates();
    cur=dates[0]||null;imgOpen=false;render();toast('삭제했습니다.');
  };
  $('btnImgToggle').onclick=function(){imgOpen=!imgOpen;renderImages()};
  $('imgs').addEventListener('click',function(e){var im=e.target;if(im&&im.tagName==='IMG')openViewer(+im.getAttribute('data-i'))});
  $('vClose').onclick=function(){$('imgModal').hidden=true;viewImg=null};
  $('vDel').onclick=async function(){
    if(!viewImg)return;
    var v=viewImg,rep=reports[v.date],m=rep&&rep.images&&rep.images[v.i];if(!m)return;
    var yes=await askConfirm('이 캡처 이미지를 삭제할까요? Firebase Storage에서도 삭제되며 되돌릴 수 없습니다.','삭제');
    if(!yes)return;
    try{
      var left=rep.images.filter(function(x,ix){return ix!==v.i});
      if(!fbOK)throw new Error('Firebase 미연결');
      await db.collection(COLL).doc(v.date).update({images:left});
      rep.images=left;
      if(storage&&m.path){try{await storage.ref(m.path).delete()}catch(e2){}}
    }catch(e){setStatus('이미지 삭제 실패: '+(e.message||e),'err');toast('이미지 삭제 실패');return}
    $('imgModal').hidden=true;viewImg=null;renderImages();toast('이미지를 삭제했습니다.');
  };
  $('fileImg').addEventListener('change',async function(e){
    var files=Array.prototype.slice.call(e.target.files||[]).filter(isImg);
    e.target.value='';
    if(!files.length||!cur)return;
    if(!storage||!fbOK){toast('Firebase Storage에 연결되지 않았습니다.');return}
    var date=cur,n=0,msg='',i;
    for(i=0;i<files.length;i++){
      setProg('이미지 업로드 중… '+(i+1)+'/'+files.length,i,files.length);
      try{
        var im=await uploadImage(date,files[i]);
        var rep=reports[date],next=(rep.images||[]).concat([im]);
        await db.collection(COLL).doc(date).update({images:next});
        rep.images=next;n++;
      }catch(err){msg=err.message||String(err)}
    }
    setProg('',null);
    if(msg){setStatus('이미지 첨부 실패: '+msg+' (Storage 규칙 확인)','err');toast('이미지 첨부 일부 실패')}
    else{setStatus('이미지 '+n+'장을 첨부했습니다.','ok');toast('이미지 '+n+'장 첨부')}
    imgOpen=true;renderImages();
  });
  $('tgZero').onchange=function(){opt.zero=this.checked;if(cur)renderDetail()};
  $('tgInq').onchange=function(){opt.inq=this.checked;if(cur)renderDetail()};
  $('tgNote').onchange=function(){opt.note=this.checked;if(cur)renderDetail()};
  $('chart').addEventListener('click',function(e){
    var c=e.target.closest?e.target.closest('.col'):null;if(c)selectDate(c.getAttribute('data-d'));
  });
  $('trend').addEventListener('click',function(e){
    var c=e.target.closest?e.target.closest('tr.clk'):null;if(c)selectDate(c.getAttribute('data-d'));
  });
}
function start(){
  bind();
  setMode('m');
  initFB();
  if(fbOK)loadAll();else{refreshDates();render()}
}
start();
})();
</script>
</body>
</html>
