<script>
// ═══════════════════════════════════════════════
// 트레이 세척·탈수·건조 시뮬레이터 v8.7
// 좌우 2CH 세워서 투입 (외벽+격벽 각 채널 독립 노즐)
// ═══════════════════════════════════════════════
const VER='8.7';
const gi=id=>document.getElementById(id);
const gv=id=>{const e=gi(id);return e?e.value:'';};

const S={
  // 트레이 규격 (세워서 투입)
  trayW:430,trayD:330,trayT:150,pocketCount:6,qty:500,dlv:3,
  nozzleLayout:'cross',  // vertical(수직)/cross(교차각도)/horizontal(수평)
  // 세척 (2CH 고정)
  wZones:3,wHole:2.5,wTemp:60,
  wSprayAngle:60, wNozzleDist:80, wAutoArray:false,
  // ★v8.0 이격 자동(분사각 최적값 추종) · 펌프 모드 · 단별 펌프 정격유량
  // ★v8.6 사선(경사) 노즐 설치 — 경사각·겹침률·지그재그 교차
  wTiltAngle:30, wOverlap:25, wTiltAlt:true,
  wDistAuto:true, pumpMode:'auto', stgPumpLpm:[0,0,0], stgPressAct:[280,200,120],
  // 단계별 독립 설정 [1차, 2차, 3차헹굼]
  stgPress:[280,200,120], stgCol:[3,3,2], stgRow:[4,4,2], stgType:['wash','wash','rinse'],
  stgLen:[1200,1200,800],  // 단별 조 길이 (세척·세척·헹굼)
  stgLenAuto:true,  // ★v7.0 조길이 자동: 세로줄 노즐수×줄간격 연동

  wTankL:1500,wTankW:800,wTankD:600,wTankIns:true,

  stageCombo:'all',

// P = Qr² / (k² + Qr²/Pmax)   ※ 노즐 수·직경↑ → k↑ → 실제 압력↓ (물리적 필연)
function operatingPress(setPressKPa, nozTotal, holeMm, pumpRatedLpm){

function tankUnderBath(volL, bathLenMm, widthMm, maxWidthMm, fill, frameGapMm, minDepthMm){

  L = Math.max(300, Math.min(L, bathLenMm-20));

function residualWater(qty, pass, attack, pressKPa, slotMm, gapMm, blowerRatio){
  const base = qty*0.03; // 개당 30g 초기 잔류

  const ratio = Math.min(1, blowerRatio||1); // 공급/필요 풍량비
  const qImpact = impactPressure(pressKPa, slotMm, gapMm) * ratio;

  const margin = qImpact/THRESHOLD;

  }

  let w = base;
  for(let i=0;i<pass;i++){ w = w*(1-removePerPass); }
  return w;
}

  const pocketPen = pocketPenalty(S.pocketCount) * (S.nozzleLayout==='cross'?0.4:1) * (S.wTiltAlt&&S.wTiltAngle>=15?0.75:1);   // ★v8.6 사선 교대 배치
  const distFactor = distWashFactor(S.wNozzleDist, S.wSprayAngle);   // ★v8.7 직각 충돌 → 이격 그대로
  const washEff = Math.min(99, washEffBase * (layoutEff/0.9) * (0.4+0.6*dwellFactor) * (1-pocketPen) * distFactor * filterFactor);
  const dewatEff=Math.min(99,Math.max(0,(1-residual/(qtyH*0.03))*100)); // ★v7.0 음수 방지
  // ★v7.0 건조효율: 온도·풍량·순환 + 잔수(탈수 결과) 연동 — 세척→탈수→건조 체인 연결
  const resPen = 1 - Math.min(0.30, Math.max(0, residual/(qtyH*0.03)-0.05)*0.5);
    // ★v8.0 순환 재사용 포화: 60~75%가 최적, 과다 순환은 습공기 포화로 건조력 저하
  const recircF = S.dryRecirc<=75 ? (1 + S.dryRecirc*0.0012) : (1.09 - (S.dryRecirc-75)*0.006);
  const dryEff=Math.min(99,Math.max(30,(56+S.dryTemp*0.25+S.dryAirVol*0.22)*recircF*resPen*heaterFactor));
  // 노즐 배열 정보 (분사각·이격 연동)
  const nozArr = nozzleArray(S.trayD, S.trayW, S.wSprayAngle, S.wNozzleDist);

  const nozzleInfo = {
    dia:S.wHole, angle:S.wSprayAngle, dist:S.wNozzleDist,
    coverW:nozArr.coverW, nc:nozArr.nc, nr:nozArr.nr, effGap:nozArr.effGap,
    distOpt:nozDistOpt, distOK:(S.wNozzleDist>=nozDistOpt.lo&&S.wNozzleDist<=nozDistOpt.hi),
    unitQ:nozQ
  };

  // ═══ 추천값 산출 (설정값과 비교용) ═══
  // 목표 세척효율 (사용자 목표 or 기본 95%)
  const tgtWashEff = 95;
  const nActive = actStages.length;
  // 1) 추천 세척조 길이 = 사용단수 × 단위체류길이 (오염도·속도 반영)
  //    각 단 필요 체류시간 = 6 + 오염도×2초, 속도 기반 길이
  let needDwellSum=0; actStages.forEach(function(i){ needDwellSum += stageNeedSec(i); }); // ★v7.0 공통 기준
  const speedMminRec = S.qty*(S.trayPitch/1000)/60;
  const speedMsRec = speedMminRec/60;
  const recWashLen = Math.ceil(needDwellSum * speedMsRec * 1000 * 1.2 / 100)*100;
  // 2) 단수 줄면 남은 단 강화 필요 → 추천 압력 (효율 부족분 보상)
  //    3단 대비 부족한 효율을 압력으로 보상

  const recPress1 = Math.round(Math.min(400, 280 + effGap*8)/10)*10; // 1차 추천 압력 (10단위)

  const faceArea = S.trayD * S.trayW / 1e6; // m²
  const recNozPerFace = Math.max(6, Math.round(faceArea * (30 + S.dlv*8)));
  // 4) 추천 온도 (오염도 높으면 상향)

  const recSpeed = speedMminRec; // 현재 처리량 기준
  // 설정값
  const setWashLen = S.washDryLen;
  const setPress1 = S.stgPress[0];

  // ── 컨베이어 속도·길이·체류시간 연동 ──

  const convTotalLen = S.inLen + S.washDryLen + S.dewatLen + S.dryLen + S.outLen + gapTotal;
  // ── 설비 각부 치수 (트레이·설계값 연동) ──
  // 폭 = 2CH × 트레이깊이 + 격벽100 + 양측프레임150×2
  const equipWidth = 2*S.trayD + 100 + 300;
  // 높이 = 트레이높이 + 상부(노즐헤더400) + 하부(저수조깊이+프레임)
  const tankMaxDepth = Math.max.apply(null, stgTanks.filter(function(t){return t.active;}).map(function(t){return t.dimH||600;}).concat([600]));
  // ★v8.5 높이 = 트레이높이 + 상부헤더400 + 필터공간(세척조↔저수조) + 캐스케이드 최심 바닥 + 프레임300
  const equipHeight = S.trayW + 400 + (S.filterGap||200) + tankBottomMax + 300;
  // 모듈별 치수
  const modules = [
    {nm:'입구', L:S.inLen, W:equipWidth, H:equipHeight, note:'투입부'},
    {nm:'세척조', L:S.washDryLen, W:equipWidth, H:equipHeight, note:'세척단수 연동 · 상부독립'},

  const capa1ch = S.qty;              // 1채널 매/h

        +'<td style="color:#2e7d32;font-weight:700;">'+rec+unit+'</td>'
        +'<td style="color:'+st+';font-size:13px;">'+mark+'</td></tr>';
    }
    // 막대 비교 (설정 vs 추천 정규화)
    function cmpBar(label,set,rec,max){
      const setPct=Math.min(100,set/max*100).toFixed(1), recPct=Math.min(100,rec/max*100).toFixed(1);
      const setV=Math.round(set), recV=Math.round(rec);
      return '<div style="margin-bottom:7px;"><div style="font-size:13px;font-weight:600;color:#37474f;margin-bottom:2px;">'+label+'</div>'
        +'<div style="display:flex;align-items:center;gap:5px;margin-bottom:2px;"><span style="width:38px;font-size:13px;color:#0d47a1;">설정</span><div style="flex:1;background:#e3eaf0;border-radius:5px;height:16px;"><div style="width:'+setPct+'%;height:100%;background:#1565c0;border-radius:5px;"></div></div><span style="width:60px;font-size:13px;text-align:right;color:#0d47a1;">'+setV+'</span></div>'
        +'<div style="display:flex;align-items:center;gap:5px;"><span style="width:38px;font-size:13px;color:#2e7d32;">추천</span><div style="flex:1;background:#e8f5e9;border-radius:5px;height:16px;"><div style="width:'+recPct+'%;height:100%;background:#43a047;border-radius:5px;"></div></div><span style="width:60px;font-size:13px;text-align:right;color:#2e7d32;">'+recV+'</span></div></div>';
    }
    h+='<div class="card"><div class="ch"><span class="ci">📊</span><span class="cl">추천값 vs 설정값 비교</span><span class="cq">단수·오염도 연동</span></div><div class="cb">'
      +'<div class="chbox" style="background:#f3e5f5;border-color:#ce93d8;color:#6a1b9a;">🎯 사용 단수·오염도·처리량을 바꾸면 <b>추천값이 재계산</b>됩니다. 설정값(파랑)과 추천값(초록)을 비교해 최적 설계에 근접시키세요.</div>'
      +cmpBar('세척조 길이 (mm)',rc.setWashLen,rc.washLen,Math.max(rc.setWashLen,rc.washLen)*1.1)
      +cmpBar('1차 분사압력 (bar)',rc.setPress1/100,rc.press1/100,4)
      +cmpBar('노즐수 (개/면)',rc.setNozPerFace,rc.nozPerFace,Math.max(rc.setNozPerFace,rc.nozPerFace)*1.2)
      +cmpBar('세척온도 (°C)',rc.setTemp,rc.temp,90)
      +cmpBar('세척효율 (%)',rc.setWashEff.toFixed(0),rc.washEff,100)
      +'<table class="tbl" style="margin-top:8px;"><thead><tr><th>항목</th><th style="color:#0d47a1;">설정</th><th style="color:#2e7d32;">추천</th><th>판정</th></tr></thead><tbody>'
      +cmpRow('세척조 길이',rc.setWashLen,rc.washLen,'mm')
      +cmpRow('1차 압력',rc.setPress1/100,rc.press1/100,'bar')
      +cmpRow('노즐/면',rc.setNozPerFace,rc.nozPerFace,'개')
      +cmpRow('세척온도',rc.setTemp,rc.temp,'°C')
      +'</tbody></table>'
      +(rc.effGap>3?'<div class="chbox" style="background:#fff3e0;border-color:#ffcc80;color:#e65100;">⚠️ <b>세척효율 '+rc.setWashEff.toFixed(0)+'% (목표 95% 대비 '+rc.effGap.toFixed(0)+'% 부족)</b> → 단수를 줄였다면 1차 압력을 '+(rc.press1/100).toFixed(1)+'bar로, 노즐을 '+rc.nozPerFace+'개/면으로, 온도를 '+rc.temp+'°C로 강화하면 보상됩니다.</div>':'<div class="chbox" style="background:#e8f5e9;border-color:#a5d6a7;color:#1b5e20;">✅ <b>세척효율 '+rc.setWashEff.toFixed(0)+'%</b> — 목표 달성. 설정이 추천값에 근접합니다.</div>')
      +(Math.abs(rc.lenDiff)>500?'<div class="chbox" style="background:'+(rc.lenDiff>0?'#fff3e0':'#ffebee')+';border-color:#ffcc80;color:#e65100;">📏 <b>세척조 길이</b>: 설정 '+rc.setWashLen+'mm vs 추천 '+rc.washLen+'mm ('+(rc.lenDiff>0?'약 '+rc.lenDiff+'mm 과다 → 단축 가능':'약 '+Math.abs(rc.lenDiff)+'mm 부족 → 체류 부족 위험')+'). 사용 단수 '+R.actStages.length+'단 기준.</div>':'')
      +'</div></div>';
  }
  h+='<div class="card"><div class="ch"><span class="ci">🎯</span><span class="cl">효율·투자비 최적화 권장</span></div><div class="cb">'+buildRec()+'</div></div>';
  Rc.innerHTML=h;
  if(_tab==='result')renderCost();
}

function buildRec(){
  const r=[];
  if(!S.wTankIns)r.push('🧥 <b>세척 저수조 단열 미적용</b> → 적용 시 유지손실 약 50%↓');
  if(!S.boilerIns)r.push('🧥 <b>보일러 탱크 단열 미적용</b> → 단열 시 손실 68%↓');
  if(S.boilerType==='electric')r.push('♨️ <b>전기보일러</b> → 가스 전환 시 열원단가 40~60%↓');
  if(S.knifeAng<45||S.knifeAng>60)r.push('📐 <b>에어나이프 '+S.knifeAng+'°</b> → 45~60°로 조정 시 물 제거↑');
  if(S.knifePass<4)r.push('🔪 <b>면당 '+S.knifePass+'패스</b> → 4패스 권장 (완전 탈수 → 건조부하 급감)');
  if(!R.gapOK)r.push('↔️ <b>이격거리 '+S.knifeGap+'mm 부적정</b> → 슬릿 '+S.knifeSlot+'mm 기준 '+R.gapOpt.lo+'~'+R.gapOpt.hi+'mm로 조정 (충돌풍속 확보)');
  if(S.pocketCount>=6 && S.nozzleLayout==='vertical')r.push('🔀 <b>포켓 '+S.pocketCount+'칸 + 전체 수직 분사</b> → 측면 세척 부족(효율 '+(R.layoutEff*100).toFixed(0)+'%). 교차각도 배치로 바꾸면 측벽까지 세척');
  if(S.knifeAng<45||S.knifeAng>60)r.push('🎯 <b>에어나이프 입사각 '+S.knifeAng+'°</b> → 45~60°로 조정 시 물 제거효율↑ (현재 '+(R.attackEff*100).toFixed(0)+'%). 수직(90°)은 물 튐, 30°이하는 힘 부족');
  if(R.blowerSel.blowerShortage)r.push('🔴 <b>탈수 위험: 블로어 풍량 부족('+(R.blowerSel.blowerRatio*100).toFixed(0)+'%)</b> → 탈수율 '+R.dewatEff.toFixed(0)+'%로 저하. 블로어 대수↑ 또는 나이프 수↓ 또는 나이프 정압↑ 필수 (설비 재제작 방지)');
  r.push('💨 <b>링블로어 '+R.blowerSel.unit.kw+'kW × '+R.blowerSel.count+'대</b> (총'+R.blowerSel.totalKW.toFixed(1)+'kW) — 나이프 '+S.blowerPerN+'개당 1대 배분');
  r.push('🔧 <b>이격거리 조정 구조</b>: LM가이드+눈금핸들로 트레이 기종별 거리를 손쉽게 재현');
  if(S.supplyMode==='direct')r.push('♻️ <b>전 조 직공급</b> → 하이브리드로 전환 시 캐스케이드 활용해 청수·가열에너지 절감');
  else if(S.supplyMode==='hybrid')r.push('✅ <b>하이브리드 온수공급</b> 적용 — 캐스케이드 '+R.cascadeRatio+'%로 절감 + 직공급 '+R.directRatio+'%로 전 조 60°C 유지');
  r.push('♨️ <b>보일러 운전용량 '+R.boilerRunKW.toFixed(1)+'kW / 정격 '+R.boilerRatedKW.toFixed(1)+'kW</b> (전 조 '+S.rinseTemp+'°C · '+(S.boilerType==='gas'?'가스':'전기')+')');
  if(S.stageCombo==='all'&&S.dlv<=2)r.push('💧 <b>오염도 낮음(1·2·3단 전체 사용)</b> → 1·3단만으로 줄이면 2단 저수조·펌프 생략, 투자·운전비↓');
  R.stgTanks.forEach(function(t){ if(t.active&&t.actTurnover<1.5)r.push('⚠️ <b>'+['1차','2차','3차'][t.idx]+' 저수조 회전 '+t.actTurnover.toFixed(1)+'분(짧음)</b> → 용량↑ 필요 (펌프 캐비테이션·수온급변 방지)'); });
  if(S.stgTankMode==='auto')r.push('📦 <b>저수조 자동 최적(회전율 기반)</b> 적용 중 — 용량/치수 직접 입력하려면 입력모드 변경');
  if(filterScore(S)<3)r.push('🧹 <b>여과 '+filterScore(S)+'/3단</b> → 금속망·슬러지·펌프흡입 3단 완비 시 순환수 청정↑·노즐막힘↓·펌프수명↑');
  else r.push('✅ <b>여과 3단 완비</b> — 순환수 청정 유지, 세척품질·설비수명 최적');
  if(S.dryRecirc<60)r.push('♻️ <b>순환 '+S.dryRecirc+'%</b> → 60~80%로 높이면 가열부하↓');
  if(S.dryTemp>95)r.push('🌡️ <b>건조온도 '+S.dryTemp+'°C</b> → 트레이는 평판이라 낮춰도 충분');
  r.push('💡 <b>트레이 핵심</b>: 평판 특성상 탈수가 잘 되면 건조 에너지가 크게 절감됩니다. 에어나이프 최적화가 가장 효과적입니다.');
  return r.map(x=>'<div class="rec-i">'+x+'</div>').join('');
}
function renderCost(){
  const cr=gi('costResult');if(!cr)return;
  const daily=R.elecReal*S.hours,monthly=daily*S.days,cost=monthly*S.rate;
  let gasCost=0,gasNote='';
  // 보일러 가스/전기 비용
  if(S.boilerType==='gas'){const gM3H=R.boilerRunKW/(10.4*0.9),gM3M=gM3H*S.hours*S.days;gasCost=gM3M*S.gasRate;gasNote='<div class="cost-it"><div class="cl2">월 가스(보일러)</div><div class="cv">'+Math.round(gM3M).toLocaleString()+' m³</div></div>';}

// ── 상관관계 ──
// ★v8.1 분사 커버리지 SVG — 실제 분사각 그대로 작도(등축 스케일) + 분사 애니메이션
// 이전 버전은 커버폭에 ×3 보정이 들어가 화면상 각도가 실제와 달랐음 → 제거
// ★v8.7 평면도 — 진행방향 기준 팬 회전 배치 (충돌은 직각, 팬만 면 안에서 회전)
function fanPlanSVG(){
  const rot=(S.wTiltAngle||0), rad=rot*Math.PI/180;
  const fanMm=coverWidth(S.wSprayAngle, S.wNozzleDist);   // 팬 길이(불변)
  const pitchMm=R.nozPitch;                                // 높이방향 간격
  const W=320,H=170,padL=16,padR=16,padT=16;
  const faceH=S.trayW;                                     // 세로축 = 트레이 높이
  const viewH=H-padT-26;
  const sc=Math.min(viewH/faceH, (W-padL-padR)/900);
  const y0=padT, yH=faceH*sc;
  const xMid=(W-padL-padR)/2+padL;
  const nH=Math.max(2,Math.ceil(faceH/pitchMm));
  const col=R.tiltF>=1?'#2e7d32':'#ef6c00';
  var s='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block;" xmlns="http://www.w3.org/2000/svg">';
  // 트레이면(진행방향으로 흐르는 띠)
  s+='<rect x="'+padL+'" y="'+y0+'" width="'+(W-padL-padR)+'" height="'+yH+'" fill="#eceff1" stroke="#b0bec5" stroke-width="1"/>';
  // 진행방향 화살표
  s+='<line x1="'+padL+'" y1="'+(y0+yH+13)+'" x2="'+(W-padR-8)+'" y2="'+(y0+yH+13)+'" stroke="#37474f" stroke-width="1.4"/>';
  s+='<polygon points="'+(W-padR)+','+(y0+yH+13)+' '+(W-padR-9)+','+(y0+yH+9)+' '+(W-padR-9)+','+(y0+yH+17)+'" fill="#37474f"/>';
  // 각 노즐의 팬(선분) — 세로 기준에서 rot만큼 회전
  const halfFan=fanMm/2*sc;
  for(let i=0;i<nH;i++){
    const yc=y0+ (i+0.5)*(yH/nH);
    const dx=Math.sin(rad)*halfFan*(S.wTiltAlt&&i%2===1?-1:1), dy=Math.cos(rad)*halfFan;
    s+='<line x1="'+(xMid-dx).toFixed(1)+'" y1="'+(yc-dy).toFixed(1)+'" x2="'+(xMid+dx).toFixed(1)+'" y2="'+(yc+dy).toFixed(1)+'" stroke="'+col+'" stroke-width="5" stroke-linecap="round" stroke-opacity="0.55"/>';
    s+='<circle cx="'+xMid+'" cy="'+yc.toFixed(1)+'" r="3" fill="#0d2137"/>';
  }
  // 높이방향 유효 커버(=팬×cos) 표시: 한 노즐의 세로 투영
  const ycd=y0+0.5*(yH/nH), projd=Math.cos(rad)*halfFan;
  s+='<line x1="'+(padL+6)+'" y1="'+(ycd-projd).toFixed(1)+'" x2="'+(padL+6)+'" y2="'+(ycd+projd).toFixed(1)+'" stroke="#1565c0" stroke-width="3"/>';
  s+='</svg>';
  return s;
}
function nozzleSVG(){
  const ang=S.wSprayAngle, dist=S.wNozzleDist;
  const half=ang/2*Math.PI/180;
  const tilt=0;                                      // ★v8.7 충돌은 직각(단면도 기준 수직)
  const coverMm=effCoverHeight(ang, dist, S.wTiltAngle);  // 높이방향 유효 커버 = 팬길이×cos(회전각)
  const pitchMm=R.nozPitch;
  const N=3;                                   // 인접 노즐 3개로 간격·중첩 표시
  const spanMm=(N-1)*pitchMm+coverMm;          // 가로 실치수
  const W=320, H=150, padX=14, topY=26;
  // 등축(가로=세로 동일) 스케일 → 화면 각도 = 실제 분사각
  const scale=Math.min((H-topY-30)/Math.max(1,dist), (W-padX*2)/Math.max(1,spanMm));
  const faceY=topY+dist*scale;
  const halfCov=coverMm/2*scale;                     // 면 위 반폭(사선 반영)
  const pitchPx=pitchMm*scale;
  const cx0=W/2-(N-1)*pitchPx/2;
  const col=R.distFactor>=1?'#2e7d32':(R.distFactor>=0.8?'#ef6c00':'#c62828');
  var s='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block;" xmlns="http://www.w3.org/2000/svg">';
  // 경사 설치: 노즐 꼭지점을 면 도달점 기준으로 tilt만큼 어긋나게 배치 (지그재그면 줄마다 교대)
  function tiltShift(i){ return 0; }   // ★v8.7 충돌은 직각 → 단면상 꼭지점 어긋남 없음
  s+='<defs><linearGradient id="spg" x1="0" y1="0" x2="0" y2="1">'
   +'<stop offset="0%" stop-color="'+col+'" stop-opacity="0.45"/>'
   +'<stop offset="100%" stop-color="'+col+'" stop-opacity="0.14"/></linearGradient>'
   +'<clipPath id="spclip">';
  for(var i=0;i<N;i++){ var cx=cx0+i*pitchPx, sh=tiltShift(i);
    s+='<polygon points="'+(cx+sh)+','+topY+' '+(cx-halfCov)+','+faceY+' '+(cx+halfCov)+','+faceY+'"/>'; }
  s+='</clipPath></defs>';
  // 중첩 구간 음영 (인접 커버가 겹치는 영역)
  if(coverMm>pitchMm){
    for(var j=0;j<N-1;j++){
      var xa=cx0+j*pitchPx+halfCov, xb=cx0+(j+1)*pitchPx-halfCov;
      s+='<rect x="'+xb+'" y="'+(faceY-7)+'" width="'+Math.max(0,xa-xb)+'" height="9" fill="#1565c0" fill-opacity="0.30"/>';
    }
  }
  // 분사 원뿔 (실제 각도) + 노즐 + 낙하 물방울 애니메이션
  for(var i2=0;i2<N;i2++){
    var cxx=cx0+i2*pitchPx, mid=(i2===Math.floor(N/2)), sh2=tiltShift(i2);
    s+='<polygon points="'+(cxx+sh2)+','+topY+' '+(cxx-halfCov)+','+faceY+' '+(cxx+halfCov)+','+faceY+'" fill="url(#spg)" stroke="'+col+'" stroke-width="'+(mid?1.6:1)+'" stroke-opacity="'+(mid?1:0.55)+'"/>';
    // 노즐 몸체도 경사 방향으로 기울여 표시
    s+='<rect x="'+(cxx+sh2-4)+'" y="'+(topY-12)+'" width="8" height="12" rx="2" fill="#0d2137"/>';
  }
  // 물방울: 원뿔 내부에서만 보이도록 clip
  s+='<g clip-path="url(#spclip)">';
  var dur=(1.15-Math.min(0.5,(S.stgPressAct[0]||280)/1400)).toFixed(2); // 압력↑ → 빠르게
  for(var i3=0;i3<N;i3++){
    var cx3=cx0+i3*pitchPx;
    var sh3=tiltShift(i3);
    for(var k=-2;k<=2;k++){
      var tx=cx3+halfCov*(k/2), delay=(Math.abs(k)*0.13+i3*0.09).toFixed(2);
      s+='<circle r="'+(k===0?2.2:1.7)+'" fill="'+col+'" fill-opacity="0.85">'
       +'<animate attributeName="cx" values="'+(cx3+sh3).toFixed(1)+';'+tx.toFixed(1)+'" dur="'+dur+'s" begin="'+delay+'s" repeatCount="indefinite"/>'
       +'<animate attributeName="cy" values="'+topY+';'+faceY.toFixed(1)+'" dur="'+dur+'s" begin="'+delay+'s" repeatCount="indefinite"/>'
       +'<animate attributeName="fill-opacity" values="0.95;0.95;0.1" dur="'+dur+'s" begin="'+delay+'s" repeatCount="indefinite"/></circle>';
    }
  }
  s+='</g>';
  // 트레이 면
  s+='<rect x="'+padX+'" y="'+faceY+'" width="'+(W-padX*2)+'" height="9" fill="#607d8b" rx="2"/>';
  // 각도 표시(실제 각 호)
  var arcR=Math.min(30,dist*scale*0.55), ax=Math.sin(half)*arcR, ay=Math.cos(half)*arcR, mcx=cx0+Math.floor(N/2)*pitchPx+tiltShift(Math.floor(N/2));
  s+='<path d="M '+(mcx-ax).toFixed(1)+' '+(topY+ay).toFixed(1)+' A '+arcR.toFixed(1)+' '+arcR.toFixed(1)+' 0 0 1 '+(mcx+ax).toFixed(1)+' '+(topY+ay).toFixed(1)+'" fill="none" stroke="#0d2137" stroke-width="1.2"/>';
  // 커버폭 치수선 (가운데 노즐)
  s+='<line x1="'+(mcx-halfCov)+'" y1="'+(faceY+16)+'" x2="'+(mcx+halfCov)+'" y2="'+(faceY+16)+'" stroke="#1565c0" stroke-width="1.2"/>';
  s+='<line x1="'+(mcx-halfCov)+'" y1="'+(faceY+12)+'" x2="'+(mcx-halfCov)+'" y2="'+(faceY+20)+'" stroke="#1565c0" stroke-width="1.2"/>';
  s+='<line x1="'+(mcx+halfCov)+'" y1="'+(faceY+12)+'" x2="'+(mcx+halfCov)+'" y2="'+(faceY+20)+'" stroke="#1565c0" stroke-width="1.2"/>';
  // 노즐 간격 치수선 (상단)
  if(N>1){
    s+='<line x1="'+cx0+'" y1="'+(topY-16)+'" x2="'+(cx0+pitchPx)+'" y2="'+(topY-16)+'" stroke="#6a1b9a" stroke-width="1.6"/>';
    s+='<line x1="'+cx0+'" y1="'+(topY-20)+'" x2="'+cx0+'" y2="'+(topY-12)+'" stroke="#6a1b9a" stroke-width="1.6"/>';
    s+='<line x1="'+(cx0+pitchPx)+'" y1="'+(topY-20)+'" x2="'+(cx0+pitchPx)+'" y2="'+(topY-12)+'" stroke="#6a1b9a" stroke-width="1.6"/>';
  }
  // 이격 치수선 (우측)
  s+='<line x1="'+(W-8)+'" y1="'+topY+'" x2="'+(W-8)+'" y2="'+faceY+'" stroke="#546e7a" stroke-width="1" stroke-dasharray="3,2"/>';
  s+='</svg>';
  return s;
}

// 밸런스 곡선 그리기 (블로어 규격별 탈수/건조/합계)
function drawBalanceChart(){
  const cv=gi('balanceChart'); if(!cv)return;
  const dpr=window.devicePixelRatio||1;
  const W=cv.clientWidth, H=240;
  cv.width=W*dpr; cv.height=H*dpr;
  const ctx=cv.getContext('2d'); ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,W,H);
  // X축: 블로어 규격 순회, Y: 전력
  const pad={l:44,r:12,t:14,b:34};
  const gw=W-pad.l-pad.r, gh=H-pad.t-pad.b;
  // 데이터 생성: 각 블로어 규격에서 탈수·건조·합계
  const pts=[];
  BLOWERS.forEach(b=>{
    // 이 블로어로 나이프 감당 → 탈수효율 근사 (풍량 비례)
    const dewatE=Math.min(99,60+b.flow*1.4);
    const residual=6*(1-dewatE/100);
    const dryKW=residual*2.26+5*(S.dryTemp/80);
    const blowKW=b.kw*Math.ceil(R.knifeTotal/S.blowerPerN);
    pts.push({x:b.kw,dewat:blowKW,dry:dryKW,sum:blowKW+dryKW,flow:b.flow});
  });
  const maxKW=Math.max.apply(null,pts.map(p=>Math.max(p.dewat,p.dry,p.sum)))*1.1;
  const minX=pts[0].x, maxX=pts[pts.length-1].x;
  const sx=v=>pad.l+(v-minX)/(maxX-minX)*gw;
  const sy=v=>pad.t+gh-(v/maxKW)*gh;
  // 축
  ctx.strokeStyle='#ccc'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(pad.l,pad.t); ctx.lineTo(pad.l,pad.t+gh); ctx.lineTo(pad.l+gw,pad.t+gh); ctx.stroke();
  ctx.fillStyle='#888'; ctx.font='11px Noto Sans KR'; ctx.textAlign='right';
  for(let i=0;i<=4;i++){const v=maxKW*i/4; ctx.fillText(v.toFixed(0),pad.l-4,sy(v)+3);}
  ctx.textAlign='center';
  pts.forEach(p=>ctx.fillText(p.x+'kW',sx(p.x),pad.t+gh+16));
  // 곡선 그리기
  function line(key,color){
    ctx.strokeStyle=color; ctx.lineWidth=2.5; ctx.beginPath();
    pts.forEach((p,i)=>{const x=sx(p.x),y=sy(p[key]); if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);});
    ctx.stroke();
    pts.forEach(p=>{ctx.fillStyle=color;ctx.beginPath();ctx.arc(sx(p.x),sy(p[key]),3,0,7);ctx.fill();});
  }
  line('dewat','#e08a1e'); // 탈수(블로어)
  line('dry','#c0392b');   // 건조
  line('sum','#5e35b1');   // 합계
  // 최소 합계점 표시
  let minSum=pts[0],mi=0;
  pts.forEach((p,i)=>{if(p.sum<minSum.sum){minSum=p;mi=i;}});
  ctx.fillStyle='#2e7d32'; ctx.beginPath(); ctx.arc(sx(minSum.x),sy(minSum.sum),6,0,7); ctx.fill();
  ctx.fillStyle='#2e7d32'; ctx.font='bold 11px Noto Sans KR'; ctx.textAlign='center';
  ctx.fillText('최적 '+minSum.x+'kW',sx(minSum.x),sy(minSum.sum)-10);
  // 범례
  ctx.textAlign='left'; ctx.font='11px Noto Sans KR';
  ctx.fillStyle='#e08a1e'; ctx.fillText('■ 탈수(블로어)',pad.l+4,pad.t+10);
  ctx.fillStyle='#c0392b'; ctx.fillText('■ 건조',pad.l+100,pad.t+10);
  ctx.fillStyle='#5e35b1'; ctx.fillText('■ 합계',pad.l+160,pad.t+10);
  // 정보
  const info=gi('balanceInfo');
  if(info) info.innerHTML='<div class="chbox" style="background:#e8f5e9;border-color:#a5d6a7;color:#1b5e20;">✅ <b>최적 링블로어 '+minSum.x+'kW</b> (풍량 '+minSum.flow+'m³/min): 탈수 '+minSum.dewat.toFixed(1)+'kW + 건조 '+minSum.dry.toFixed(1)+'kW = <b>합계 '+minSum.sum.toFixed(1)+'kW 최소</b><br>블로어를 이보다 키우면 탈수 전력 증가가 건조 절감을 넘어섬, 작으면 건조 부하가 급증.</div>';
}

const FB_API='AIzaSyC4DWFGGJjJmVlqnfmZaVDdKJWCXK0Yr_g';
const FB_COL='tray_sessions';
const FB_BASE='https://firestore.googleapis.com/v1/projects/insys-work/databases/(default)/documents/'+FB_COL;
let _editId=null; // 수정 중인 문서 ID

async function fbRest(url,opts){
  opts=opts||{};
  const sep=url.includes('?')?'&':'?';
  const r=await fetch(url+sep+'key='+FB_API,opts);
  if(!r.ok){const t=await r.text();throw new Error('Firebase '+r.status+': '+t.slice(0,150));}
  return r.json();
}
function toFsV(v){
  if(v===null||v===undefined)return{nullValue:null};
  if(typeof v==='boolean')return{booleanValue:v};
  if(typeof v==='number')return{doubleValue:v};
  if(typeof v==='string')return{stringValue:v};
  if(Array.isArray(v))return{arrayValue:{values:v.map(toFsV)}};
  return{stringValue:String(v)};
}
function toFields(o){const f={};for(const k in o)if(o[k]!==undefined)f[k]=toFsV(o[k]);return f;}
function fromFsV(v){
  if(!v)return null;
  if('stringValue'in v)return v.stringValue;
  if('doubleValue'in v)return v.doubleValue;
  if('integerValue'in v)return Number(v.integerValue);
  if('booleanValue'in v)return v.booleanValue;
  if('arrayValue'in v)return (v.arrayValue.values||[]).map(fromFsV);
  return null;
}
function fromFields(f){const o={};for(const k in f)o[k]=fromFsV(f[k]);return o;}

  ['stgPress','stgCol','stgRow','stgType','stgLen','stgPumpLpm','stgPressAct'].forEach(k=>{
    if(d[k] && Array.isArray(d[k])) S[k]=d[k].slice();

// 저장 (신규 or 수정)
async function doFbSave(){
  const name=(gi('saveName').value||'').trim();
  const memo=(gi('saveMemo').value||'').trim();
  if(!name){gi('saveStatus').innerHTML='<span style="color:#c62828;">이름을 입력하세요</span>';return;}
  gi('saveStatus').innerHTML='<span style="color:#0d7fa8;">저장 중...</span>';
  try{
    const data=collectSettings();
    const body={fields:toFields(Object.assign({},data,{name,memo,savedAt:new Date().toISOString()}))};
    if(_editId){
      await fbRest(FB_BASE+'/'+_editId,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    }else{
      await fbRest(FB_BASE,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    }
    gi('saveStatus').innerHTML='<span style="color:#2e7d32;">✅ 저장 완료</span>';
    setTimeout(()=>{gi('saveModal').style.display='none';_editId=null;},800);
  }catch(e){
    const is403=String(e.message).includes('403')||String(e.message).includes('PERMISSION');
    gi('saveStatus').innerHTML='<span style="color:#c62828;">'+(is403?'⚠️ Firebase 규칙에 tray_sessions 추가 필요':e.message)+'</span>';
  }
}
// 목록 불러오기
async function fbLoadList(kw){
  const list=gi('loadList');list.innerHTML='불러오는 중...';
  try{
    const d=await fbRest(FB_BASE);
    let docs=(d.documents||[]).map(x=>Object.assign({_id:x.name.split('/').pop()},fromFields(x.fields)))
      .sort((a,b)=>(b.savedAt||'')>(a.savedAt||'')?1:-1);
    if(kw){const q=kw.toLowerCase();docs=docs.filter(x=>[x.name,x.memo].some(v=>(v||'').toLowerCase().includes(q)));}
    gi('loadCount').textContent=docs.length+'건';
    if(!docs.length){list.innerHTML='<div style="text-align:center;color:#7a90a4;padding:20px;font-size:14px;">저장된 조건이 없습니다</div>';return;}
    list.innerHTML=docs.map(x=>{
      const dt=(x.savedAt||'').slice(0,16).replace('T',' ');
      return '<div class="load-item" data-id="'+x._id+'" style="border:1px solid #dde5ee;border-radius:8px;padding:9px 11px;margin-bottom:7px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;">'
        +'<div style="flex:1;min-width:0;"><div style="font-weight:700;color:#0d2137;font-size:14px;">'+(x.name||'—')+'</div>'
        +'<div style="font-size:13px;color:#7a90a4;">'+dt+' | '+(x.memo||'')+' | 세척'+(x._resWashEff||'?')+'% 탈수'+(x._resDewatEff||'?')+'% '+(x._resElecReal||'?')+'kW</div></div>'
        +'<button class="load-del" data-id="'+x._id+'" style="background:#ffebee;color:#c62828;border:none;border-radius:6px;padding:5px 9px;font-size:13px;cursor:pointer;font-family:inherit;">🗑</button></div>';
    }).join('');
    // 클릭 이벤트
    list.querySelectorAll('.load-item').forEach(el=>{
      el.addEventListener('click',e=>{
        if(e.target.classList.contains('load-del'))return;
        const doc=docs.find(x=>x._id===el.dataset.id);
        if(doc){applySettings(doc);gi('loadModal').style.display='none';}
      });
    });
    list.querySelectorAll('.load-del').forEach(btn=>{
      btn.addEventListener('click',async e=>{
        e.stopPropagation();
        if(!confirm('삭제하시겠습니까?'))return;
        try{await fetch(FB_BASE+'/'+btn.dataset.id+'?key='+FB_API,{method:'DELETE'});fbLoadList(gi('loadSearch').value);}catch(err){}
      });
    });
  }catch(e){
    const is403=String(e.message).includes('403')||String(e.message).includes('PERMISSION');
    list.innerHTML='<div style="color:#c62828;font-size:13px;padding:12px;line-height:1.6;">'
      +(is403?'⚠️ <b>Firebase 규칙에 tray_sessions 추가 필요</b><br><a href="https://console.firebase.google.com/project/insys-work/firestore/rules" target="_blank" style="color:#0d7fa8;">규칙 페이지 열기 ↗</a><br>match /tray_sessions/{doc} { allow read, write: if true; }':e.message)+'</div>';
  }
}

// 이벤트
gi('btnSave').addEventListener('click',()=>{_editId=null;gi('saveName').value='';gi('saveMemo').value='';gi('saveStatus').innerHTML='';gi('saveModal').style.display='flex';});
gi('btnLoad').addEventListener('click',()=>{gi('loadModal').style.display='flex';fbLoadList('');});
gi('doSave').addEventListener('click',doFbSave);
gi('closeSave').addEventListener('click',()=>gi('saveModal').style.display='none');
gi('closeLoad').addEventListener('click',()=>gi('loadModal').style.display='none');
gi('loadSearch').addEventListener('input',()=>fbLoadList(gi('loadSearch').value));

renderLeft();renderRight();
</script>
