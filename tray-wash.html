*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --navy:#0d2137;--teal:#0d7fa8;--steel:#3a6b8a;--ink:#152535;
  --wash:#0d7fa8;--dewat:#e08a1e;--dry:#c0392b;

body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.55;}
@media(min-width:768px){body{font-size:16px;}}
.hdr{background:linear-gradient(120deg,#0d2137 0%,#0d7fa8 100%);color:#fff;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.25);}
.hdr-inner{max-width:1200px;margin:0 auto;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
.hdr-t{font-size:19px;font-weight:900;letter-spacing:-.3px;}
.hdr-s{font-size:13px;opacity:.85;font-weight:400;margin-top:1px;}

.hdr-r button.on{background:#fff;color:var(--navy);}
.vb{background:rgba(255,255,255,.25);padding:5px 11px;border-radius:7px;font-size:13px;font-weight:700;}
.wrap{max-width:1200px;margin:0 auto;padding:10px 14px;}
.wrap.mobile{max-width:430px;}
.proctab{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;}
.proctab button{flex:1;min-width:84px;background:#fff;border:2px solid var(--line);border-radius:9px;padding:9px 6px;font-family:inherit;font-size:14px;font-weight:700;color:#7a90a4;cursor:pointer;transition:.2s;}
.proctab button .pe{font-size:18px;display:block;margin-bottom:2px;}
.proctab button.on{color:#fff;border-color:transparent;}
.proctab button.on.pw{background:var(--wash);}
.proctab button.on.pd{background:var(--dewat);}
.proctab button.on.pr{background:var(--dry);}
.proctab button.on.po{background:var(--steel);}
.proctab button.on.pc{background:#5e35b1;}
.proctab button.on.pm{background:#00838f;}
.proctab button.on.pb{background:#d84315;}
.proctab button.on.ps{background:var(--navy);}
.layout{display:grid;grid-template-columns:1fr;gap:12px;}
@media(min-width:960px){.layout{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:12px;}
.ch{padding:9px 13px;background:#f6f9fc;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
.ch .ci{font-size:18px;}
.ch .cl{font-size:15px;font-weight:800;color:var(--navy);}
.ch .cq{margin-left:auto;font-size:13px;font-weight:700;padding:3px 9px;border-radius:7px;background:#e3f0f8;color:var(--teal);}
.cb{padding:11px 13px;}
.st{font-size:14px;font-weight:800;color:var(--steel);margin:10px 0 6px;padding-bottom:3px;border-bottom:1px dashed var(--line);}
.st:first-child{margin-top:0;}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
.g3 input{min-width:0;width:100%;}
.g5{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;}
.g4c{display:grid;grid-template-columns:1fr 1fr;gap:5px;}
.g4c input{min-width:0;width:100%;padding:4px 5px;font-size:13px;}
.g4c label{font-size:11px;}
.g5 input{min-width:0;width:100%;padding:5px 4px;font-size:13px;}
.g5 label{font-size:12px;}
@media(max-width:600px){.g5{grid-template-columns:repeat(3,1fr);}}
@media(max-width:520px){.g3{grid-template-columns:1fr 1fr;}}
.fl{display:flex;flex-direction:column;gap:3px;}
.fl label{font-size:13px;font-weight:600;color:#5a7088;}
.fl input,.fl select{border:1.5px solid #c5d5e5;border-radius:7px;padding:6px 8px;font-size:14px;font-family:inherit;font-weight:600;color:var(--ink);background:#fff;}
.fl input:focus,.fl select:focus{outline:none;border-color:var(--teal);}

.sv-u{font-size:13px;color:#9aabb8;min-width:28px;}

.sv-badge.opt{background:#d4edda;color:#155724;}

.sv-si.o{border-color:#2e7d32;background:#e8f5e9;color:#1b5e20;}

.kc.k4{background:linear-gradient(135deg,#f3e5f5,#e1bee7);color:#6a1b9a;}

.kc.k6{background:linear-gradient(135deg,#e0f2f1,#b2dfdb);color:#00695c;}
.cost{background:#fffdf5;border:1px solid #f0e4c0;border-radius:10px;padding:10px 12px;margin-top:10px;}
.cost-in{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:9px;}
.cost-fl{display:flex;align-items:center;gap:4px;}
.cost-fl label{font-size:13px;color:#6a5a2a;font-weight:600;}
.cost-fl input{width:58px;border:1.5px solid #e0d090;border-radius:6px;padding:4px 6px;font-size:14px;font-weight:700;text-align:right;font-family:inherit;color:#5a4a1a;}
.cost-fl span{font-size:13px;color:#9a8a5a;}
.cost-res{display:flex;gap:8px;flex-wrap:wrap;}

.save{margin-top:9px;padding-top:9px;border-top:1px dashed #e0d090;}

.tbl td{padding:5px 6px;text-align:center;border:1px solid #e5ecf2;}
.tbl td.hi{font-weight:800;color:var(--teal);}
.rec{background:#f0f7ff;border:1px solid #cfe3f5;border-radius:9px;padding:9px 11px;margin-top:9px;}
.rec-i{font-size:13px;color:#1a4060;padding:3px 0;line-height:1.55;}
.corr-intro{background:#f3f0fb;border:1px solid #d8cef0;border-radius:9px;padding:10px 12px;margin-bottom:10px;font-size:14px;color:#4a3a7a;line-height:1.6;}
.corr-tbl{width:100%;border-collapse:collapse;font-size:14px;margin-bottom:12px;}
.corr-tbl th{background:#ede7f6;color:#4527a0;padding:7px 8px;text-align:left;font-weight:700;border:1px solid #d1c4e9;font-size:13px;}

.corr-tbl td.var{font-weight:700;color:#5e35b1;white-space:nowrap;}
.corr-up{color:#c62828;font-weight:700;}
.corr-dn{color:#1565c0;font-weight:700;}
.corr-eff{color:#2e7d32;font-weight:700;}
.corr-cost{color:#e65100;font-weight:700;}
.corr-legend{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;margin-bottom:10px;padding:8px 10px;background:#faf8ff;border-radius:8px;}
.corr-sect{font-size:15px;font-weight:800;color:#4527a0;margin:14px 0 7px;padding-left:8px;border-left:4px solid #5e35b1;}
.tradeoff{background:#fff8f0;border:1px solid #ffd9a8;border-radius:9px;padding:10px 12px;margin-bottom:8px;}
.tradeoff-h{font-size:14px;font-weight:800;color:#c05a00;margin-bottom:4px;}
.tradeoff-b{font-size:13px;color:#6a4a2a;line-height:1.6;}
.note{font-size:13px;color:#9aabb8;margin-top:5px;line-height:1.5;}
footer{text-align:center;font-size:13px;color:#7a90a4;padding:14px;}
.flowbar{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:11px;}
@media(min-width:768px){.flowbar{grid-template-columns:repeat(8,1fr);}}
.flowstep{background:#fff;border:1px solid var(--line);border-radius:9px;padding:8px 4px;text-align:center;}

.flowstep .fn{font-size:12px;font-weight:700;color:var(--steel);line-height:1.2;white-space:nowrap;margin-bottom:4px;}
.flowstep .fv{font-size:16px;color:var(--navy);font-weight:900;line-height:1.2;}
.flowstep.aw{border-top:3px solid var(--wash);}.flowstep.aw .fv{color:var(--wash);}

.flowstep.ar{border-top:3px solid var(--dry);}.flowstep.ar .fv{color:var(--dry);}
.chbox{background:#eef6fb;border:1px solid #cde3f0;border-radius:8px;padding:8px 10px;margin:6px 0;font-size:13px;color:#0b5a80;line-height:1.6;}
</style>
</head>
<body>

<script>
// ═══════════════════════════════════════════════
// 트레이 세척·탈수·건조 시뮬레이터 v6.2
// 좌우 2CH 세워서 투입 (외벽+격벽 각 채널 독립 노즐)
// ═══════════════════════════════════════════════
const VER='7.0';
const gi=id=>document.getElementById(id);
const gv=id=>{const e=gi(id);return e?e.value:'';};

const S={
  // 트레이 규격 (세워서 투입)
  trayW:430,trayD:330,trayT:150,pocketCount:6,qty:500,dlv:3,
  nozzleLayout:'cross',  // vertical(수직)/cross(교차각도)/horizontal(수평)
  // 세척 (2CH 고정)
  wZones:3,wHole:2.5,wTemp:60,
  wSprayAngle:60, wNozzleDist:80, wAutoArray:false,
  // 단계별 독립 설정 [1차, 2차, 3차헹굼]
  stgPress:[280,200,120], stgCol:[3,3,2], stgRow:[4,4,2], stgType:['wash','wash','rinse'],
  stgLen:[1200,1200,800],  // 단별 조 길이 (세척·세척·헹굼)
  stgLenAuto:true,  // ★v7.0 조길이 자동: 세로줄 노즐수×줄간격 연동
  wTankL:1500,wTankW:800,wTankD:600,wTankIns:true,
  // 사용 단 조합: 'all'(1·2·3), '13'(1·3), '1'(1단만)
  stageCombo:'all',
  // 단별 저수조 용량(L) [1,2,3단], 0=자동최적
  stgTank:[0,0,0], stgTankAuto:true,
  // 단별 저수조 치수 [1,2,3단] mm, 입력모드: 'auto'|'volume'|'dim'
  stgTankMode:'auto',
  stgTankW:[1200,1000,800], stgTankD:[1000,800,700], stgTankH:[600,600,500],
  // 순환 회전시간(분) [세척, 세척, 헹굼]
  stgTurnover:[1.5,1.5,1.5],
  // 저수조 폭 고정(세척부 폭 기준), 용량은 길이·깊이로 흡수
  stgTankFixW:800,
  // 배수조: 'single'(공통1) or 'perstage'(단별)
  drainMode:'single',
  drainCount:1,drainHead:8,
  // 여과 시스템 (1·2차 세척조)
  meshFilter:true, meshSize:30, sludgeFilter:true, sludgeMesh:100,
  pumpStrainer:true, strainerMesh:50, autoBackwash:false, filterWaterSave:true,
  // 탈수
  knifePass:4,knifeAng:50,knifeVel:60,knifePress:20,knifeSlot:1.0,knifeGap:60,knifeLen:600,blowerPerN:2,
  // 건조
  dryTemp:75,dryAirVol:25,dryRecirc:70,heaterCount:2,
  // 온수/유틸
  boilerType:'gas',boilerTankL:1000,boilerIns:true,inletTemp:15,convKW:1.5,

// 필요 풍량·압력 → 링블로어 자동 선정 (대수 포함)

  // 압력 충족하는 것 중 풍량 감당 최소 규격 찾기
  const cand=BLOWERS.filter(b=>b.press>=needPressKPa);

  // 1대로 감당 가능?
  for(const b of pool){

  }
  // 최대 규격 여러 대
  const big=pool[pool.length-1];

function nozzleQ(h,p){const Cd=0.62,r=h/1000/2,A=Math.PI*r*r;return Cd*Math.sqrt(2*p*1000/1000)*A*1000*60;}
// 노즐 배치별 세척 효율 계수 (포켓 개수 반영)

// 이격거리별 세척 계수 (최적 80~150mm, 벗어나면 저하)
function distWashFactor(distMm){

  if(distMm<80) return 0.85 + (distMm-50)/30*0.15; // 너무 가까움 커버 부족
  return Math.max(0.6, 1.0 - (distMm-150)/150*0.4); // 멀어서 충격약화
}
// 포켓 개수별 세척효율 계수 (많을수록 사각지대·잔류↑ → 효율↓)
function pocketPenalty(pocketCount){

}
// 노즐 배치별 세척 효율 (포켓 개수 반영)
function layoutEfficiency(layout, pocketCount){

  if(layout==='cross'){
    return 0.90 + 0.05*(1-pFactor); // 교차: 포켓 많아도 측면 세척 유지
  } else if(layout==='horizontal'){
    return 0.78 - 0.05*pFactor;
  } else if(layout==='vertical_arr'){
    return 0.80 - 0.03*pFactor;
  } else { // vertical
    return 0.90 - 0.30*pFactor; // 수직: 포켓 많으면 사각지대 급증
  }

// 커버폭 = 2 × 이격 × tan(분사각/2)
function coverWidth(angleDeg, distMm){ return 2*distMm*Math.tan(angleDeg/2*Math.PI/180); }
// 분사각별 권장 이격거리 [최소, 최대, 최적]
function optDist(angleDeg){
  if(angleDeg<=30) return {lo:150,hi:250,opt:200};
  if(angleDeg<=60) return {lo:100,hi:150,opt:120};

// 커버폭 기반 노즐 배열 자동 산정 (면크기, 분사각, 이격)
function nozzleArray(faceW, faceH, angleDeg, distMm){
  const cw = coverWidth(angleDeg, distMm);

  const nc = Math.max(2, Math.ceil(faceW/eff));
  const nr = Math.max(2, Math.ceil(faceH/eff));

}
function pumpPowerKW(lpm,head,eff){return 1000*9.81*(lpm/60000)*head/eff/1000;}
function lpmToKW(lpm,p,eff){return (lpm/60000*p*1000)/eff/1000;}
function tankVol(L,W,D){return Math.round(L*W*D*0.75/1e6);}
// 단별 최적 저수조 용량 (순환량 기반)
// 저수조 최적 용량 = 유량 × 회전시간(분) × 안전율 1.2
// (펌프 순환 회전율 기반 — 저수조 전체가 turnover분마다 1회 순환)
function tankOptimal(flowLpm, turnoverMin){
  const vol = flowLpm * turnoverMin * 1.2; // L
  return Math.max(100, Math.round(vol/50)*50); // 50L 올림, 최소100L
}
// 용량(L) → 치수 역산: 폭(W) 고정, 깊이(D) 기준 길이(L) 산출
// 세척기 저수조는 폭이 세척부에 맞춰 고정, 용량은 길이·깊이로 흡수
function volToDim(volL, widthMm, depthMm, fill, maxLenMm){
  fill = fill||0.75;
  maxLenMm = maxLenMm||3500;
  let d = depthMm;
  let lengthMm = volL*1e6/(widthMm*d*fill);
  // 길이가 세척조(최대길이) 초과 시 깊이를 키워 흡수 (최대 깊이 1200mm)
  while(lengthMm > maxLenMm && d < 1200){
    d += 50;
    lengthMm = volL*1e6/(widthMm*d*fill);
  }
  // 깊이 최대인데도 길면 폭을 키움 (최대 폭 1500mm)
  let w = widthMm;
  while(lengthMm > maxLenMm && w < 1500){
    w += 50;
    lengthMm = volL*1e6/(w*d*fill);
  }
  return {W:w, L:Math.round(lengthMm/10)*10, D:d};
}
// 치수 → 용량 (L)
function dimToVol(W,D,H,fill){ fill=fill||0.75; return Math.round(W*D*H*fill/1e6); }

function activeStages(combo, zn){

function stageNeedSec(i){ return (S.stgType[i]==='rinse') ? (5+S.dlv) : (8+S.dlv*3); }
function heaterMaintainKW(t,temp,ins){return t*(ins?0.022:0.045)*(Math.max(0,temp-20)/40);}
// 에어나이프 1개 풍량 (m³/min): 슬롯길이 × 슬롯폭 × 풍속
function knifeFlow1(lenMm, slotMm, velMs){ return (lenMm/1000)*(slotMm/1000)*velMs*60; }
// 총 나이프 개수 = 면당 패스수 × 앞뒤(2면) × CH(2)
function totalKnives(passPerFace){ return passPerFace * 2 * CH; }
// 이격거리별 충돌 풍속 감쇠 (슬롯제트 감쇠)
// 에어나이프 입사각별 물기 제거 효율
// 입사각 = 트레이 면에 공기가 부딪히는 각 (수직=90°)
// 45~60°: 물을 옆·뒤로 밀어냄 (최적) / 90°: 수직 타격 → 물 튐(재부착)
// 30°이하: 스치듯 → 힘 부족
function attackEfficiency(incidenceDeg){
  if(incidenceDeg>=45 && incidenceDeg<=60){
    return 0.95; // 최적 (물 밀어내기)
  } else if(incidenceDeg>60 && incidenceDeg<=75){
    // 수직에 가까움 → 물 튐 시작
    return 0.95 - (incidenceDeg-60)*0.015;
  } else if(incidenceDeg>75){
    return Math.max(0.65, 0.72 - (incidenceDeg-75)*0.005); // 수직 근접 튐
  } else if(incidenceDeg>=35 && incidenceDeg<45){
    return 0.85 + (incidenceDeg-35)*0.01;
  } else {
    return Math.max(0.4, 0.6 - (35-incidenceDeg)*0.01); // 너무 스침
  }
}
// 입사각별 실제 에어 경로거리 (수직이격 / sin(입사각))
function slantGap(gapMm, incidenceDeg){
  return gapMm / Math.sin(incidenceDeg*Math.PI/180);
}
function impactVel(v0, slotMm, gapMm){
  // 슬롯제트 핵심영역 = 슬롯폭 × 120 (에어나이프 실측 근사, 점제트 5.2와 다름)
  // 실제 에어나이프는 이격 100mm까지 초기속도 유지
  const core = slotMm * 120;
  if(gapMm <= core) return v0;
  return v0 * Math.sqrt(core/gapMm);
}
// 이격거리 최적 판정 (슬롯폭 40~80배, 절대 30~80mm)
function gapOptimal(slotMm){
  const lo = Math.max(30, slotMm*40);
  const hi = Math.min(80, slotMm*80);
  return {lo:Math.round(lo), hi:Math.round(hi)};
}
// 비스듬 설치 나이프 길이 (면높이 / cos각도)
function knifeLength(faceHmm, incidenceDeg){
  // 입사각으로 면을 커버하려면 나이프가 면높이/sin(입사각)만큼 길어야
  return faceHmm / Math.sin(incidenceDeg*Math.PI/180);
}
function blowerKW(air,p,eff){return (air/60)*p*1000/eff/1000;}
function dryerKW(res,airVol,dT,recirc){const evap=res*2260/3600;const airH=(airVol/60)*1.2*1005*dT/1000;return evap+airH*(1-recirc/100);}
// 트레이 잔류수분 — 평판이라 탈수 효율 좋음 (개당 30g 기준)
// 트레이 잔류수분 — 면당 4패스 순차 제거 모델
// 각 pass가 남은 물의 일정 비율 제거, 성능(속도·이격·슬롯)에 따라 제거율 결정
// 블로어 정압(kPa) → 에어나이프 토출속도(m/s) [베르누이, 실효 60%]
function knifeExitVel(pressKPa){ return Math.sqrt(2*pressKPa*1000/1.2)*0.6; }
// 충돌 동압(Pa) = 0.5 × ρ × v² (이격거리 감쇠 반영)
function impactPressure(pressKPa, slotMm, gapMm){
  const v0 = knifeExitVel(pressKPa);
  const vImp = impactVel(v0, slotMm, gapMm); // 이격 감쇠
  return 0.5*1.2*vImp*vImp; // Pa
}
// 실제 탈수 잔류수분 (충돌압 vs 물막 제거 임계압 기반)
// blowerOK: 블로어가 필요 풍량을 감당하는지 (부족 시 풍속·탈수 저하)
function residualWater(qty, pass, attack, pressKPa, slotMm, gapMm, blowerRatio){
  const base = qty*0.03; // 개당 30g 초기 잔류
  const THRESHOLD = 3000; // 물막 제거 임계 동압 3kPa
  // 충돌 동압 (블로어 풍량 부족 시 비례 감소)
  const ratio = Math.min(1, blowerRatio||1); // 공급/필요 풍량비
  const qImpact = impactPressure(pressKPa, slotMm, gapMm) * ratio;
  // 임계압 대비 여유 → 제거율
  const margin = qImpact/THRESHOLD;
  if(margin < 1){
    // 충돌압 부족 → 탈수 크게 저하
    const weakRem = 0.15*margin;
    let w=base; for(let i=0;i<pass;i++){ w=w*(1-weakRem); }
    return w;
  }
  // 공격각·이격 보정
  const eAttack = attackEfficiency(attack);
  const go = gapOptimal(slotMm);
  const eGap = (gapMm>=go.lo && gapMm<=go.hi) ? 1 : 0.8;
  // pass당 제거율 (충돌압 여유·방향·이격)
  const removePerPass = Math.min(0.68, (0.35 + 0.12*Math.min(3,margin)) * eAttack * eGap);
  let w = base;
  for(let i=0;i<pass;i++){ w = w*(1-removePerPass); }
  return w;
}

  const recommend = {
    washLen:recWashLen, press1:recPress1, nozPerFace:recNozPerFace, temp:recTemp, speed:recSpeed, washEff:tgtWashEff,
    setWashLen, setPress1, setNozPerFace, setTemp, setSpeed:speedMminRec, setWashEff:washEff,
    lenDiff, effGap
  };
  // ── 컨베이어 속도·길이·체류시간 연동 ──
  // 총길이 = 입구 + 세척 + 간격 + 탈수 + 간격 + 건조 + 출구
  // 관통식(직선): 입구·출구가 양 끝에 각각, 조 사이 상부 분리 간격 2곳
  const nGaps = 2; // 세척↔탈수, 탈수↔건조 상부 분리 간격
  const gapTotal = S.moduleGap * nGaps;
  // ★ 탈수조 길이 = 나이프 패스 × 간격 + 여유 (공정 연동)
  S.dewatLen = Math.round(S.knifePass * 300 + 400);
  // ★ 건조기 길이 = 건조 체류시간 × 속도 (온도·풍량 반비례)
  const drySpeed = (S.qty*(S.trayPitch/1000)/60)/60;
  const dryNeedDwell = Math.max(6, 15 - (S.dryTemp-75)*0.08 - (S.dryAirVol-25)*0.1);
  S.dryLen = Math.round(dryNeedDwell * drySpeed * 1000 * 1.2 / 100)*100;
  const convTotalLen = S.inLen + S.washDryLen + S.dewatLen + S.dryLen + S.outLen + gapTotal;
  // ── 설비 각부 치수 (트레이·설계값 연동) ──
  // 폭 = 2CH × 트레이깊이 + 격벽100 + 양측프레임150×2
  const equipWidth = 2*S.trayD + 100 + 300;
  // 높이 = 트레이높이 + 상부(노즐헤더400) + 하부(저수조깊이+프레임)
  const tankMaxDepth = Math.max.apply(null, stgTanks.filter(function(t){return t.active;}).map(function(t){return t.dimH||600;}).concat([600]));
  const equipHeight = S.trayW + 400 + (tankMaxDepth + 300);
  // 모듈별 치수
  const modules = [
    {nm:'입구', L:S.inLen, W:equipWidth, H:equipHeight, note:'투입부'},
    {nm:'세척조', L:S.washDryLen, W:equipWidth, H:equipHeight, note:'세척단수 연동 · 상부독립'},
    {nm:'탈수조', L:S.dewatLen, W:equipWidth, H:equipHeight, note:'나이프 패스 · 상부독립'},
    {nm:'건조기', L:S.dryLen, W:equipWidth, H:equipHeight, note:'건조 연동 · 상부독립'},
    {nm:'출구', L:S.outLen, W:equipWidth, H:equipHeight, note:'배출부'}
  ];
  // 컨테이너 판정
  const contW=2352, contH=2393, contL=12032;
  const fitW = equipWidth<=contW-100;
  const fitH = equipHeight<=contH-100;
  const fitL = convTotalLen<=contL;
  const equipDim = {equipWidth, equipHeight, modules, fitW, fitH, fitL, contW, contH, contL};
  const speedMmin = S.qty * (S.trayPitch/1000) / 60; // 처리량→속도 m/min
  const speedMs = speedMmin/60;
  // ── 세척 CAPA (2CH 합계) 및 투입 간격 ──
  // 설정 처리량 S.qty는 1CH(라인) 기준 → 2CH 합계 = ×2
  const capa1ch = S.qty;              // 1채널 매/h
  const capa2ch = capa1ch * CH;       // 2CH 합계 매/h
  // 투입: 2CH이므로 좌우 2개씩 동시 투입, 간격(초) = 3600 / (1CH 시간당 개수)
  const feedIntervalSec = capa1ch>0 ? 3600/capa1ch : 0; // 2개씩 투입 간격
  // 월 세척 수량 = 시간당 CAPA(2CH) × 일근무 × 월일수
  const monthlyCapa = capa2ch * S.hours * S.days;
  // 목표 달성 판정 (±5% 허용)
  const tgt = S.targetMonth;
  const targetMet = monthlyCapa>=tgt*0.95;
  const targetOver = monthlyCapa>tgt*1.1;
  // 목표 달성 필요 시간/일 (현재 일수 기준)
  const needHours = capa2ch>0 ? tgt/(capa2ch*S.days) : 0;
  // ── 인력 효율 (관통식 2명) ──
  // 목표를 needHours만에 끝내면 나머지 시간 다른 업무
  const workHoursPerDay = Math.min(S.hours, needHours);
  const freeHoursPerDay = Math.max(0, S.hours - needHours);
  const freeManHourMonth = freeHoursPerDay * S.workers * S.days; // 여유 인시
  const laborCostMonth = S.workers * workHoursPerDay * S.wage * S.days; // 세척 인건비
  const capaEnough = needHours <= S.hours;
  const traysPerMin = speedMs*1000/S.trayPitch; // 분당 트레이(1CH)
  // 각 구간 체류시간 = 길이/속도
  const dwellWash = speedMs>0 ? (S.washDryLen/1000)/speedMs : 0;
  const dwellDewat = speedMs>0 ? (S.dewatLen/1000)/speedMs : 0;
  const dwellDry = speedMs>0 ? (S.dryLen/1000)/speedMs : 0;
  // 필요 최소 체류시간 (공정 강도 기반)
  const needWash = needDwellSum; // ★v7.0 효율 계산과 동일 기준 (판정 모순 제거)
  const needDewat = Math.max(3, S.knifePass*1.2);
  const needDry = dryNeedDwell; // ★v7.0 건조기 길이 산정과 동일 기준
  // 최적(최단) 길이 = 필요체류 × 속도 × 여유20%
  const optWashLen = Math.ceil(needWash*speedMs*1000*1.2/100)*100;
  const optDewatLen = Math.ceil(needDewat*speedMs*1000*1.2/100)*100;
  const optDryLen = Math.ceil(needDry*speedMs*1000*1.2/100)*100;
  // 체류 충분성 판정
  const washOK = dwellWash>=needWash, dewatOK=dwellDewat>=needDewat, dryOK=dwellDry>=needDry;

  R={washFlow,qPerCh,washPumpTotal,convTotalLen,gapTotal,equipDim,speedMmin,speedMs,capa1ch,capa2ch,feedIntervalSec,monthlyCapa,targetMet,targetOver,needHours,workHoursPerDay,freeHoursPerDay,freeManHourMonth,laborCostMonth,capaEnough,traysPerMin,dwellWash,dwellDewat,dwellDry,needWash,needDewat,needDry,optWashLen,optDewatLen,optDryLen,washOK,dewatOK,dryOK,washWaterTotal,stgDetail,tankL,washHeaterEach,washHeaterTotal,stgTanks,actStages,drainCount,drainFlow,drainKW,airFlow,blowKW,residual,dryKW,boilerHeatKW,boilerLossKW,boilerTotalKW,elecTotal,elecReal,gasLoad,washEff,dewatEff,dryEff,recommend,nozzleInfo,layoutEff,dwellFactor,pocketPen,distFactor,nPerFace,washHeatElec,elecHeater,supplyFresh,supplyMode:S.supplyMode,boilerRunKW,boilerRatedKW,cascadeRatio,directRatio,knifeTotal,knifeLen,flow1,blowerSel,mainDuctSpec,mainDuctID,branchDuctSpec,branchDuctID,vImpact,gapOpt,gapOK,attackEff,slantDist,impactKPa,knifeVelReal};
}

// 분사각·이격 커버리지 SVG (분사 원뿔 + 커버폭 시각화)
function nozzleSVG(){
  const ang=S.wSprayAngle, dist=S.wNozzleDist, cover=R.nozzleInfo.coverW;
  const W=280, H=110;
  const nozzleX=W/2, nozzleY=15;
  // 스케일: 이격 300mm를 H-30에 매핑
  const scale=(H-35)/300;
  const faceY=nozzleY + dist*scale;
  const halfCover=Math.min(W/2-10, cover/2*scale*3); // 커버 시각 스케일
  const col = R.distFactor>=1 ? '#43a047' : (R.distFactor>=0.8?'#fb8c00':'#e53935');
  var s='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:'+H+'px;">';
  // 분사 원뿔 (노즐→면)
  s+='<polygon points="'+nozzleX+','+nozzleY+' '+(nozzleX-halfCover)+','+faceY+' '+(nozzleX+halfCover)+','+faceY+'" fill="'+col+'" fill-opacity="0.25" stroke="'+col+'" stroke-width="1.5"/>';
  // 노즐
  s+='<circle cx="'+nozzleX+'" cy="'+nozzleY+'" r="4" fill="#0d2137"/>';
  s+='<text x="'+(nozzleX+8)+'" y="'+(nozzleY+4)+'" font-size="10" fill="#5a7088">노즐 '+ang+'°</text>';
  // 트레이 면
  s+='<rect x="10" y="'+faceY+'" width="'+(W-20)+'" height="8" fill="#90a4ae" rx="2"/>';
  s+='<text x="12" y="'+(faceY+22)+'" font-size="10" fill="#37474f">트레이면 · 이격 '+dist+'mm · 커버 '+cover.toFixed(0)+'mm</text>';
  // 이격 화살표
  s+='<line x1="'+(W-25)+'" y1="'+nozzleY+'" x2="'+(W-25)+'" y2="'+faceY+'" stroke="#b0bec5" stroke-width="1" stroke-dasharray="3,2"/>';
  s+='</svg>';
  return s;
}

// 밸런스 곡선 그리기 (블로어 규격별 탈수/건조/합계)
function drawBalanceChart(){
  const cv=gi('balanceChart'); if(!cv)return;
  const dpr=window.devicePixelRatio||1;
  const W=cv.clientWidth, H=240;
  cv.width=W*dpr; cv.height=H*dpr;
  const ctx=cv.getContext('2d'); ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,W,H);
  // X축: 블로어 규격 순회, Y: 전력
  const pad={l:44,r:12,t:14,b:34};
  const gw=W-pad.l-pad.r, gh=H-pad.t-pad.b;
  // 데이터 생성: 각 블로어 규격에서 탈수·건조·합계
  const pts=[];
  BLOWERS.forEach(b=>{
    // 이 블로어로 나이프 감당 → 탈수효율 근사 (풍량 비례)
    const dewatE=Math.min(99,60+b.flow*1.4);
    const residual=6*(1-dewatE/100);
    const dryKW=residual*2.26+5*(S.dryTemp/80);
    const blowKW=b.kw*Math.ceil(R.knifeTotal/S.blowerPerN);
    pts.push({x:b.kw,dewat:blowKW,dry:dryKW,sum:blowKW+dryKW,flow:b.flow});
  });
  const maxKW=Math.max.apply(null,pts.map(p=>Math.max(p.dewat,p.dry,p.sum)))*1.1;
  const minX=pts[0].x, maxX=pts[pts.length-1].x;
  const sx=v=>pad.l+(v-minX)/(maxX-minX)*gw;
  const sy=v=>pad.t+gh-(v/maxKW)*gh;
  // 축
  ctx.strokeStyle='#ccc'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(pad.l,pad.t); ctx.lineTo(pad.l,pad.t+gh); ctx.lineTo(pad.l+gw,pad.t+gh); ctx.stroke();
  ctx.fillStyle='#888'; ctx.font='11px Noto Sans KR'; ctx.textAlign='right';
  for(let i=0;i<=4;i++){const v=maxKW*i/4; ctx.fillText(v.toFixed(0),pad.l-4,sy(v)+3);}
  ctx.textAlign='center';
  pts.forEach(p=>ctx.fillText(p.x+'kW',sx(p.x),pad.t+gh+16));
  // 곡선 그리기
  function line(key,color){
    ctx.strokeStyle=color; ctx.lineWidth=2.5; ctx.beginPath();
    pts.forEach((p,i)=>{const x=sx(p.x),y=sy(p[key]); if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);});
    ctx.stroke();
    pts.forEach(p=>{ctx.fillStyle=color;ctx.beginPath();ctx.arc(sx(p.x),sy(p[key]),3,0,7);ctx.fill();});
  }
  line('dewat','#e08a1e'); // 탈수(블로어)
  line('dry','#c0392b');   // 건조
  line('sum','#5e35b1');   // 합계
  // 최소 합계점 표시
  let minSum=pts[0],mi=0;
  pts.forEach((p,i)=>{if(p.sum<minSum.sum){minSum=p;mi=i;}});
  ctx.fillStyle='#2e7d32'; ctx.beginPath(); ctx.arc(sx(minSum.x),sy(minSum.sum),6,0,7); ctx.fill();
  ctx.fillStyle='#2e7d32'; ctx.font='bold 11px Noto Sans KR'; ctx.textAlign='center';
  ctx.fillText('최적 '+minSum.x+'kW',sx(minSum.x),sy(minSum.sum)-10);
  // 범례
  ctx.textAlign='left'; ctx.font='11px Noto Sans KR';
  ctx.fillStyle='#e08a1e'; ctx.fillText('■ 탈수(블로어)',pad.l+4,pad.t+10);
  ctx.fillStyle='#c0392b'; ctx.fillText('■ 건조',pad.l+100,pad.t+10);
  ctx.fillStyle='#5e35b1'; ctx.fillText('■ 합계',pad.l+160,pad.t+10);
  // 정보
  const info=gi('balanceInfo');
  if(info) info.innerHTML='<div class="chbox" style="background:#e8f5e9;border-color:#a5d6a7;color:#1b5e20;">✅ <b>최적 링블로어 '+minSum.x+'kW</b> (풍량 '+minSum.flow+'m³/min): 탈수 '+minSum.dewat.toFixed(1)+'kW + 건조 '+minSum.dry.toFixed(1)+'kW = <b>합계 '+minSum.sum.toFixed(1)+'kW 최소</b><br>블로어를 이보다 키우면 탈수 전력 증가가 건조 절감을 넘어섬, 작으면 건조 부하가 급증.</div>';
}

    +cr('세척 온도','↑','세척력<span class="corr-eff">↑</span>·히터/보일러부하<span class="corr-cost">↑</span>')
    +cr('사용 단 조합','3단↑','세척율<span class="corr-eff">↑↑</span>·펌프/히터/저수조<span class="corr-cost">↑</span> (1·3단만 선택 시 절감)')
    +cr('저수조 단열','ON','유지손실<span class="corr-dn">↓50%</span> ✅저비용 고효율')
    +'</tbody></table>';
  h+='<div class="corr-sect">💨 탈수부 (트레이 강점)</div><table class="corr-tbl"><thead><tr><th style="width:24%">변수</th><th style="width:8%">조작</th><th>연쇄 영향</th></tr></thead><tbody>'
    +cr('나이프 개수','↑','잔류수분<span class="corr-dn">↓</span> → <b>건조부하<span class="corr-dn">↓↓</span></b> (4개 최적)')
    +cr('분사 각도','45~60°','물 제거<span class="corr-eff">최대</span> (진행 역방향)')
    +cr('토출 속도','↑','잔류수분<span class="corr-dn">↓</span>·블로어부하<span class="corr-cost">↑</span>')
    +cr('평판 특성','—','세워서 투입 → 중력배수 + 에어나이프 → 탈수효율<span class="corr-eff">우수</span>')
    +'</tbody></table>';
  h+='<div class="corr-sect">🔥 건조부 (저부하)</div><table class="corr-tbl"><thead><tr><th style="width:24%">변수</th><th style="width:8%">조작</th><th>연쇄 영향</th></tr></thead><tbody>'
    +cr('열풍 온도','↑','건조속도<span class="corr-eff">↑</span>·열부하<span class="corr-cost">↑↑</span> (트레이는 낮춰도 충분)')
    +cr('순환 재사용','↑','신선공기 가열<span class="corr-dn">↓↓</span>·열부하<span class="corr-dn">↓</span>')
    +cr('잔류수분(탈수결과)','↓','증발부하<span class="corr-dn">↓↓</span> → <b>건조에너지<span class="corr-dn">↓↓</span></b>')
    +'</tbody></table>';
  h+='<div class="corr-sect">⚖️ 효율 ↔ 투자비 트레이드오프</div>';
  h+='<div class="tradeoff"><div class="tradeoff-h">1. 탈수 투자 vs 건조 에너지</div><div class="tradeoff-b">트레이는 평판이라 에어나이프 효과가 특히 큽니다. 탈수 강화(투자↑) → 잔류수분↓ → <b>건조 열부하 급감</b>. 트레이 설비의 최대 절감 포인트입니다.</div></div>';
  h+='<div class="tradeoff"><div class="tradeoff-h">2. 단열 투자 vs 유지 전력</div><div class="tradeoff-b">저수조·보일러 단열은 저렴한 투자로 열손실 40~68%↓. 회수기간 최단.</div></div>';
  h+='<div class="tradeoff"><div class="tradeoff-h">3. 순환 재사용 vs 덕트 투자</div><div class="tradeoff-b">열풍 순환률↑(덕트 투자) → 신선공기 가열부하↓. 트레이는 건조부하가 낮아 중간 수준이면 충분합니다.</div></div>';
  h+='<div class="corr-sect">🎯 트레이 최적 설계 우선순위</div><table class="corr-tbl"><thead><tr><th style="width:8%">순위</th><th style="width:32%">조치</th><th>효과</th></tr></thead><tbody>'
    +'<tr><td class="var">1</td><td class="var">저수조·보일러 단열</td><td>유지손실 40~68%↓ · <span class="corr-eff">회수 최단</span></td></tr>'
    +'<tr><td class="var">2</td><td class="var">에어나이프 탈수 강화</td><td>건조 열부하 급감 · <span class="corr-eff">트레이 최대 절감</span></td></tr>'
    +'<tr><td class="var">3</td><td class="var">가스보일러+온수 집중</td><td>세척조 전기히터 60%↓</td></tr>'
    +'<tr><td class="var">4</td><td class="var">배수 폐열회수</td><td>보일러 20~30%↓</td></tr>'
    +'<tr><td class="var">5</td><td class="var">심야전력 예열</td><td>전력단가 40%↓</td></tr>'
    +'</tbody></table>';
  h+='</div></div>';return h;
}
function cr(v,op,eff){return '<tr><td class="var">'+v+'</td><td style="text-align:center;font-weight:800;color:#5e35b1;">'+op+'</td><td>'+eff+'</td></tr>';}

// ═══════════════════════════════════════════════
// Firebase REST — 조건 저장/불러오기/수정
// ═══════════════════════════════════════════════
const FB_API='AIzaSyC4DWFGGJjJmVlqnfmZaVDdKJWCXK0Yr_g';
const FB_COL='tray_sessions';
const FB_BASE='https://firestore.googleapis.com/v1/projects/insys-work/databases/(default)/documents/'+FB_COL;
let _editId=null; // 수정 중인 문서 ID

async function fbRest(url,opts){
  opts=opts||{};
  const sep=url.includes('?')?'&':'?';
  const r=await fetch(url+sep+'key='+FB_API,opts);
  if(!r.ok){const t=await r.text();throw new Error('Firebase '+r.status+': '+t.slice(0,150));}
  return r.json();
}
function toFsV(v){
  if(v===null||v===undefined)return{nullValue:null};
  if(typeof v==='boolean')return{booleanValue:v};
  if(typeof v==='number')return{doubleValue:v};
  if(typeof v==='string')return{stringValue:v};
  if(Array.isArray(v))return{arrayValue:{values:v.map(toFsV)}};
  return{stringValue:String(v)};
}
function toFields(o){const f={};for(const k in o)if(o[k]!==undefined)f[k]=toFsV(o[k]);return f;}
function fromFsV(v){
  if(!v)return null;
  if('stringValue'in v)return v.stringValue;
  if('doubleValue'in v)return v.doubleValue;
  if('integerValue'in v)return Number(v.integerValue);
  if('booleanValue'in v)return v.booleanValue;
  if('arrayValue'in v)return (v.arrayValue.values||[]).map(fromFsV);
  return null;
}
function fromFields(f){const o={};for(const k in f)o[k]=fromFsV(f[k]);return o;}

// 현재 설정 수집 (모든 S + 결과 요약)
function collectSettings(){
  syncState();calcAll();
  return Object.assign({},S,{
    _resWashEff:+R.washEff.toFixed(1),_resDewatEff:+R.dewatEff.toFixed(1),
    _resDryEff:+R.dryEff.toFixed(1),_resElecReal:+R.elecReal.toFixed(1),
    _resKnifeTotal:R.knifeTotal,_resBlowerKW:+R.blowKW.toFixed(1)
  });
}
// 설정 적용
function applySettings(d){
  for(const k in S){ if(d[k]!==undefined) S[k]=d[k]; }
  // 배열 필드 복원 (Firebase는 배열도 저장)
  ['stgPress','stgCol','stgRow','stgType'].forEach(k=>{
    if(d[k] && Array.isArray(d[k])) S[k]=d[k].slice();
  });
  // checkbox·select는 S에 반영됨 → renderLeft가 반영
  renderLeft();renderRight();
}

// 저장 (신규 or 수정)
async function doFbSave(){
  const name=(gi('saveName').value||'').trim();
  const memo=(gi('saveMemo').value||'').trim();
  if(!name){gi('saveStatus').innerHTML='<span style="color:#c62828;">이름을 입력하세요</span>';return;}
  gi('saveStatus').innerHTML='<span style="color:#0d7fa8;">저장 중...</span>';
  try{
    const data=collectSettings();
    const body={fields:toFields(Object.assign({},data,{name,memo,savedAt:new Date().toISOString()}))};
    if(_editId){
      await fbRest(FB_BASE+'/'+_editId,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    }else{
      await fbRest(FB_BASE,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    }
    gi('saveStatus').innerHTML='<span style="color:#2e7d32;">✅ 저장 완료</span>';
    setTimeout(()=>{gi('saveModal').style.display='none';_editId=null;},800);
  }catch(e){
    const is403=String(e.message).includes('403')||String(e.message).includes('PERMISSION');
    gi('saveStatus').innerHTML='<span style="color:#c62828;">'+(is403?'⚠️ Firebase 규칙에 tray_sessions 추가 필요':e.message)+'</span>';
  }
}
// 목록 불러오기
async function fbLoadList(kw){
  const list=gi('loadList');list.innerHTML='불러오는 중...';
  try{
    const d=await fbRest(FB_BASE);
    let docs=(d.documents||[]).map(x=>Object.assign({_id:x.name.split('/').pop()},fromFields(x.fields)))
      .sort((a,b)=>(b.savedAt||'')>(a.savedAt||'')?1:-1);
    if(kw){const q=kw.toLowerCase();docs=docs.filter(x=>[x.name,x.memo].some(v=>(v||'').toLowerCase().includes(q)));}
    gi('loadCount').textContent=docs.length+'건';
    if(!docs.length){list.innerHTML='<div style="text-align:center;color:#7a90a4;padding:20px;font-size:14px;">저장된 조건이 없습니다</div>';return;}
    list.innerHTML=docs.map(x=>{
      const dt=(x.savedAt||'').slice(0,16).replace('T',' ');
      return '<div class="load-item" data-id="'+x._id+'" style="border:1px solid #dde5ee;border-radius:8px;padding:9px 11px;margin-bottom:7px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;">'
        +'<div style="flex:1;min-width:0;"><div style="font-weight:700;color:#0d2137;font-size:14px;">'+(x.name||'—')+'</div>'
        +'<div style="font-size:12px;color:#7a90a4;">'+dt+' | '+(x.memo||'')+' | 세척'+(x._resWashEff||'?')+'% 탈수'+(x._resDewatEff||'?')+'% '+(x._resElecReal||'?')+'kW</div></div>'
        +'<button class="load-del" data-id="'+x._id+'" style="background:#ffebee;color:#c62828;border:none;border-radius:6px;padding:5px 9px;font-size:13px;cursor:pointer;font-family:inherit;">🗑</button></div>';
    }).join('');
    // 클릭 이벤트
    list.querySelectorAll('.load-item').forEach(el=>{
      el.addEventListener('click',e=>{
        if(e.target.classList.contains('load-del'))return;
        const doc=docs.find(x=>x._id===el.dataset.id);
        if(doc){applySettings(doc);gi('loadModal').style.display='none';}
      });
    });
    list.querySelectorAll('.load-del').forEach(btn=>{
      btn.addEventListener('click',async e=>{
        e.stopPropagation();
        if(!confirm('삭제하시겠습니까?'))return;
        try{await fetch(FB_BASE+'/'+btn.dataset.id+'?key='+FB_API,{method:'DELETE'});fbLoadList(gi('loadSearch').value);}catch(err){}
      });
    });
  }catch(e){
    const is403=String(e.message).includes('403')||String(e.message).includes('PERMISSION');
    list.innerHTML='<div style="color:#c62828;font-size:13px;padding:12px;line-height:1.6;">'
      +(is403?'⚠️ <b>Firebase 규칙에 tray_sessions 추가 필요</b><br><a href="https://console.firebase.google.com/project/insys-work/firestore/rules" target="_blank" style="color:#0d7fa8;">규칙 페이지 열기 ↗</a><br>match /tray_sessions/{doc} { allow read, write: if true; }':e.message)+'</div>';
  }
}

// 이벤트
gi('btnSave').addEventListener('click',()=>{_editId=null;gi('saveName').value='';gi('saveMemo').value='';gi('saveStatus').innerHTML='';gi('saveModal').style.display='flex';});
gi('btnLoad').addEventListener('click',()=>{gi('loadModal').style.display='flex';fbLoadList('');});
gi('doSave').addEventListener('click',doFbSave);
gi('closeSave').addEventListener('click',()=>gi('saveModal').style.display='none');
gi('closeLoad').addEventListener('click',()=>gi('loadModal').style.display='none');
gi('loadSearch').addEventListener('input',()=>fbLoadList(gi('loadSearch').value));

renderLeft();renderRight();
</script>
