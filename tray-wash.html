<script>
// ═══════════════════════════════════════════════
// 트레이 세척·탈수·건조 시뮬레이터 v1.2
// 좌우 2CH 세워서 투입 (외벽+격벽 각 채널 독립 노즐)
// ═══════════════════════════════════════════════
const VER='1.2';
const gi=id=>document.getElementById(id);
const gv=id=>{const e=gi(id);return e?e.value:'';};

const S={
  // 트레이 규격 (세워서 투입)
  trayW:600,trayD:400,trayT:50,qty:200,dlv:3,
  // 세척 (2CH 고정)
  wZones:3,wHole:2.5,wPress:200,wCol:4,wRow:6,wTemp:60,
  wTankL:1500,wTankW:800,wTankD:600,wTankIns:true,
  drainCount:1,drainHead:8,
  // 탈수
  knifePass:4,knifeAng:45,knifeVel:60,knifePress:20,knifeSlot:1.0,knifeGap:60,knifeLen:600,blowerPerN:2,
  // 건조
  dryTemp:75,dryAirVol:25,dryRecirc:70,heaterCount:2,
  // 온수/유틸
  boilerType:'gas',boilerTankL:1000,boilerIns:true,makeupWater:250,inletTemp:15,convKW:1.5,
  // 전기료
  hours:8,days:22,rate:130,gasRate:900
};
const CH=2; // 트레이는 좌우 2CH 고정
const FACES_PER_CH=2; // 채널당 외벽+격벽 2면

// 링블로어 표준 사양 (kW, 풍량 m³/min, 정압 kPa)
const BLOWERS=[
  {kw:2.2, flow:3.5,  press:20},
  {kw:4.0, flow:6.0,  press:25},
  {kw:5.5, flow:8.5,  press:28},
  {kw:7.5, flow:12.0, press:30},
  {kw:11,  flow:18.0, press:32},
  {kw:15,  flow:24.0, press:35},
  {kw:22,  flow:36.0, press:38},
];
// 필요 풍량·압력 → 링블로어 자동 선정 (대수 포함)
function selectBlower(needAirM3min, needPressKPa){
  // 압력 충족하는 것 중 풍량 감당 최소 규격 찾기
  const cand=BLOWERS.filter(b=>b.press>=needPressKPa);
  const pool=cand.length?cand:BLOWERS;
  // 1대로 감당 가능?
  for(const b of pool){
    if(b.flow>=needAirM3min) return {unit:b, count:1, totalKW:b.kw, totalFlow:b.flow};
  }
  // 최대 규격 여러 대
  const big=pool[pool.length-1];
  const count=Math.ceil(needAirM3min/big.flow);
  return {unit:big, count, totalKW:big.kw*count, totalFlow:big.flow*count};
}
// 배관 내경 (풍량 m³/min, 유속 m/s → mm)
function ductDia(airM3min, velMs){
  const Q=airM3min/60; const A=Q/velMs;
  return Math.sqrt(4*A/Math.PI)*1000;
}
// KS 배관 규격으로 올림 (내경 기준 근사)
function ductSpec(idMm){
  const specs=[[40,42],[50,54],[65,70],[80,82],[100,105],[125,130],[150,155],[200,205],[250,255]];
  for(const [nm,id] of specs){ if(id>=idMm) return nm+'A (ID~'+id+'mm)'; }
  return '250A+';
}

// ── 물리 계산 ──
function nozzleQ(h,p){const Cd=0.62,r=h/1000/2,A=Math.PI*r*r;return Cd*Math.sqrt(2*p*1000/1000)*A*1000*60;}
function pumpPowerKW(lpm,head,eff){return 1000*9.81*(lpm/60000)*head/eff/1000;}
function lpmToKW(lpm,p,eff){return (lpm/60000*p*1000)/eff/1000;}
function tankVol(L,W,D){return Math.round(L*W*D*0.75/1e6);}
function heaterMaintainKW(t,temp,ins){return t*(ins?0.022:0.045)*(Math.max(0,temp-20)/40);}
// 에어나이프 1개 풍량 (m³/min): 슬롯길이 × 슬롯폭 × 풍속
function knifeFlow1(lenMm, slotMm, velMs){ return (lenMm/1000)*(slotMm/1000)*velMs*60; }
// 총 나이프 개수 = 면당 패스수 × 앞뒤(2면) × CH(2)
function totalKnives(passPerFace){ return passPerFace * 2 * CH; }
// 이격거리별 충돌 풍속 감쇠 (슬롯제트 감쇠)
function impactVel(v0, slotMm, gapMm){
  const core = slotMm * 5.2; // 핵심영역 길이
  if(gapMm <= core) return v0;
  return v0 * Math.sqrt(core/gapMm);
}
// 이격거리 최적 판정 (슬롯폭 40~80배, 절대 30~80mm)
function gapOptimal(slotMm){
  const lo = Math.max(30, slotMm*40);
  const hi = Math.min(80, slotMm*80);
  return {lo:Math.round(lo), hi:Math.round(hi)};
}
// 비스듬 설치 나이프 길이 (면높이 / cos각도)
function knifeLength(faceHmm, angDeg){
  return faceHmm / Math.cos(angDeg*Math.PI/180);
}
function blowerKW(air,p,eff){return (air/60)*p*1000/eff/1000;}
function dryerKW(res,airVol,dT,recirc){const evap=res*2260/3600;const airH=(airVol/60)*1.2*1005*dT/1000;return evap+airH*(1-recirc/100);}
// 트레이 잔류수분 — 평판이라 탈수 효율 좋음 (개당 30g 기준)
// 트레이 잔류수분 — 면당 4패스 순차 제거 모델
// 각 pass가 남은 물의 일정 비율 제거, 성능(속도·이격·슬롯)에 따라 제거율 결정
function residualWater(qty, pass, vel, ang, slotMm, gapMm){
  const base = qty*0.03; // 개당 30g 초기 잔류
  // 충돌 풍속 (이격거리 반영)
  const vImpact = impactVel(vel, slotMm, gapMm);
  const eVel = Math.min(1, vImpact/25);      // 충돌 25m/s 이상이면 양호
  const eAng = 1 - Math.abs(ang-45)/90;      // 45° 최적
  // 이격거리 적정성
  const go = gapOptimal(slotMm);
  const eGap = (gapMm>=go.lo && gapMm<=go.hi) ? 1 : 0.7;
  // pass당 제거율 (성능 반영, 40~65%)
  const removePerPass = 0.4 + 0.25*(eVel*eAng*eGap);
  // 앞뒤 양면이므로 실제 유효 pass = pass (면당)
  let w = base;
  for(let i=0;i<pass;i++){ w = w*(1-removePerPass); }
  return w;
}

// ── 슬라이더 ──
function sliderHTML(id,label,unit,min,max,step,val,oMin,oMax){
  return '<div class="sv" id="sv-'+id+'"><div class="sv-h"><span class="sv-l">'+label+'</span>'
    +'<div class="sv-r"><span class="sv-badge" id="bd-'+id+'">—</span>'
    +'<input class="sv-n" type="number" id="'+id+'" value="'+val+'" min="'+min+'" max="'+max+'" step="'+step+'">'

function updateSlider(id){
  const el=gi(id),rg=gi('rg-'+id),fl=gi('fl-'+id),op=gi('op-'+id),bd=gi('bd-'+id),ss=gi('ss-'+id);
  if(!el||!fl)return;
  const val=+el.value,min=+el.min,max=+el.max,oMin=+ss.dataset.omin,oMax=+ss.dataset.omax,unit=ss.dataset.unit;
  const pct=Math.min(100,Math.max(0,(val-min)/(max-min)*100));
  const pMin=Math.min(100,Math.max(0,(oMin-min)/(max-min)*100));
  const pMax=Math.min(100,Math.max(0,(oMax-min)/(max-min)*100));
  let st='opt',tx='✅ 최적',cl='o';
  if(val<oMin){st='low';tx='⚠️ 부족';cl='w';}else if(val>oMax){st='high';tx='🔴 초과';cl='b';}
  const col={opt:'linear-gradient(90deg,#2e7d32,#43a047)',low:'linear-gradient(90deg,#f57f17,#ffb300)',high:'linear-gradient(90deg,#c62828,#e53935)'};
  fl.style.width=pct+'%';fl.style.background=col[st];fl.innerHTML='<span>'+val+'</span>';
  op.style.left=pMin+'%';op.style.width=(pMax-pMin)+'%';
  bd.textContent=tx;bd.className='sv-badge '+st;
  if(rg&&+rg.value!==val)rg.value=val;
  ss.innerHTML='<span class="sv-si o">최적 '+oMin+'~'+oMax+unit+'</span><span class="sv-si c">현재 '+val+unit+'</span><span class="sv-si '+cl+'">'+tx+'</span>';
}

function syncState(){
  ['trayW','trayD','trayT','qty','dlv','wZones','wHole','wPress','wCol','wRow','wTemp','wTankL','wTankW','wTankD','drainCount','drainHead','knifePass','knifeAng','knifeVel','knifePress','knifeSlot','knifeGap','knifeLen','blowerPerN','dryTemp','dryAirVol','dryRecirc','heaterCount','boilerTankL','makeupWater','inletTemp','convKW','hours','days','rate','gasRate'].forEach(k=>{const e=gi(k);if(e&&e.value!=='')S[k]=+e.value;});

// ── 종합 계산 (2CH 트레이) ──
let R={};
function calcAll(){
  syncState();
  const qtyH=S.qty;
  const qEach=nozzleQ(S.wHole,S.wPress);
  const nPerFace=S.wCol*S.wRow;
  // 트레이 분사면: 세워진 트레이 = trayD(폭) × trayW(높이)
  const washFlow=qEach*nPerFace*FACES_PER_CH*CH*1.15;
  const qPerCh=washFlow/CH;
  const washPumpKW=lpmToKW(washFlow,S.wPress,0.75);
  const tankL=tankVol(S.wTankL,S.wTankW,S.wTankD);
  const washHeaterEach=heaterMaintainKW(tankL,S.wTemp,S.wTankIns);
  const washHeaterTotal=washHeaterEach*S.wZones;
  const washPumpTotal=washPumpKW*S.wZones;
  const drainFlow=tankL/3;
  const drainKW=pumpPowerKW(drainFlow,S.drainHead,0.6)*S.drainCount;
  // 탈수 — 세워진 트레이 높이(trayW)를 나이프 길이로
  // ── 탈수: 면당 4패스 × 앞뒤 2면 × 2CH ──
  const knifeTotal = totalKnives(S.knifePass); // 패스×앞뒤×CH = 16개(4패스)
  const knifeLen = knifeLength(S.trayD, S.knifeAng); // 비스듬 설치 실제 길이
  const flow1 = knifeFlow1(knifeLen, S.knifeSlot, S.knifeVel); // 나이프1개 풍량
  const airFlow = flow1 * knifeTotal; // 총 풍량 m³/min
  // 충돌 풍속·이격 판정
  const vImpact = impactVel(S.knifeVel, S.knifeSlot, S.knifeGap);
  const gapOpt = gapOptimal(S.knifeSlot);
  const gapOK = (S.knifeGap>=gapOpt.lo && S.knifeGap<=gapOpt.hi);
  // 링블로어 배분: 나이프 blowerPerN개당 1대
  const blowerCount = Math.ceil(knifeTotal / S.blowerPerN);
  const flowPerBlower = flow1 * S.blowerPerN;
  const blowerUnit = selectBlower(flowPerBlower, S.knifePress).unit;
  const blowKW = blowerUnit.kw * blowerCount;
  const blowerSel = {unit:blowerUnit, count:blowerCount, totalKW:blowKW, flowPerBlower};
  // 공급 배관: 메인(블로어→헤더 18m/s), 분기(나이프당 15m/s)
  const mainDuctID = ductDia(flowPerBlower, 18);
  const mainDuctSpec = ductSpec(mainDuctID);
  const branchDuctID = ductDia(flow1, 15);
  const branchDuctSpec = ductSpec(branchDuctID);
  const residual = residualWater(qtyH, S.knifePass, S.knifeVel, S.knifeAng, S.knifeSlot, S.knifeGap);
  const dryKW=dryerKW(residual,S.dryAirVol,S.dryTemp-20,S.dryRecirc);
  const boilerHeatKW=(S.makeupWater*4.18*(S.wTemp-S.inletTemp))/3600;
  const boilerLossKW=heaterMaintainKW(S.boilerTankL,S.wTemp,S.boilerIns);
  const boilerTotalKW=boilerHeatKW+boilerLossKW;
  const elecHeater=(S.boilerType==='electric')?boilerTotalKW:0;
  const gasLoad=(S.boilerType==='gas')?boilerTotalKW:0;
  const washHeatElec=washHeaterTotal*0.4; // 외부보일러 공급 시 세척조 보조 유지만
  const elecTotal=washPumpTotal+drainKW+blowKW+dryKW+washHeatElec+elecHeater+S.convKW;
  const elecReal=washPumpTotal+drainKW+blowKW+dryKW*0.7+washHeatElec*0.35+elecHeater*0.35+S.convKW;
  // 효율 (트레이 특성 반영: 평판이라 탈수·건조 우수)
  const washEff=Math.min(99,52+S.wZones*10+(S.wTemp-40)*0.3-(S.dlv-1)*4);
  const dewatEff=Math.min(99,(1-residual/(qtyH*0.03))*100);
  const dryEff=Math.min(99,65+S.dryTemp*0.28+S.dryRecirc*0.12);
  R={qEach,washFlow,qPerCh,washPumpTotal,tankL,washHeaterEach,washHeaterTotal,drainFlow,drainKW,airFlow,blowKW,residual,dryKW,boilerHeatKW,boilerLossKW,boilerTotalKW,elecTotal,elecReal,gasLoad,washEff,dewatEff,dryEff,nPerFace,washHeatElec,elecHeater,knifeTotal,knifeLen,flow1,blowerSel,mainDuctSpec,mainDuctID,branchDuctSpec,branchDuctID,vImpact,gapOpt,gapOK};
}

    +(R.elecHeater>0?row('온수','전기보일러',R.elecHeater,R.elecHeater*0.35):'')
    +'</tbody></table>'
    +(R.gasLoad>0?'<div class="note">※ 가스보일러 '+R.gasLoad.toFixed(1)+'kW는 가스비로 별도 계산</div>':'')
    +'</div></div>';
  h+='<div class="card"><div class="ch"><span class="ci">🎯</span><span class="cl">효율·투자비 최적화 권장</span></div><div class="cb">'+buildRec()+'</div></div>';
  Rc.innerHTML=h;
  if(_tab==='result')renderCost();
}
function kc(c,v,l){return '<div class="kc '+c+'"><div class="kv">'+v+'</div><div class="kl">'+l+'</div></div>';}
function row(p,e,r,rl){return '<tr><td>'+p+'</td><td>'+e+'</td><td class="hi">'+r.toFixed(1)+'</td><td>'+rl.toFixed(1)+'</td></tr>';}
function renderFlow(){
  gi('flowbar').innerHTML=fs('aw','💧','세척',R.washEff.toFixed(0)+'%')+fs('ad','💨','탈수',R.dewatEff.toFixed(0)+'%')+fs('ar','🔥','건조',R.dryEff.toFixed(0)+'%')+fs('','⚡','전기',R.elecReal.toFixed(1)+'kW')+fs('','♨️','온수',R.gasLoad>0?'가스':'전기');
}
function fs(c,e,n,v){return '<div class="flowstep '+c+'"><span class="fe">'+e+'</span><span class="fn">'+n+'</span><span class="fv">'+v+'</span></div>';}
function renderBlowerInfo(){
  const el=gi('blowerInfo'); if(!el)return;
  calcAll();
  const bs=R.blowerSel;
  const kt=R.knifeTotal;
  const oneType = bs.count;
  el.innerHTML=
    '<table class="tbl"><tbody>'
    +'<tr><td style="text-align:left;font-weight:700;">총 에어나이프</td><td class="hi">'+kt+'개</td><td style="text-align:left;font-size:13px;color:#7a90a4;">'+S.knifePass+'패스×앞뒤2×2CH</td></tr>'
    +'<tr><td style="text-align:left;font-weight:700;">나이프 길이</td><td class="hi">'+R.knifeLen.toFixed(0)+'mm</td><td style="text-align:left;font-size:13px;color:#7a90a4;">'+S.knifeAng+'° 비스듬</td></tr>'
    +'<tr><td style="text-align:left;font-weight:700;">나이프 1개 풍량</td><td class="hi">'+R.flow1.toFixed(2)+' m³/min</td><td style="text-align:left;font-size:13px;color:#7a90a4;">슬릿'+S.knifeSlot+'mm×'+S.knifeVel+'m/s</td></tr>'
    +'<tr><td style="text-align:left;font-weight:700;">총 필요풍량</td><td class="hi">'+R.airFlow.toFixed(1)+' m³/min</td><td style="text-align:left;font-size:13px;color:#7a90a4;">@ '+S.knifePress+'kPa</td></tr>'
    +'<tr><td style="text-align:left;font-weight:700;">링블로어 배분</td><td class="hi">나이프'+S.blowerPerN+'개당 1대</td><td style="text-align:left;font-size:13px;color:#7a90a4;">'+kt+'÷'+S.blowerPerN+'='+bs.count+'대</td></tr>'
    +'<tr><td style="text-align:left;font-weight:700;">링블로어 규격</td><td class="hi">'+bs.unit.kw+'kW × '+bs.count+'대</td><td style="text-align:left;font-size:13px;color:#7a90a4;">대당 '+bs.unit.flow+'m³/min</td></tr>'
    +'<tr><td style="text-align:left;font-weight:700;">총 블로어 전력</td><td class="hi">'+bs.totalKW.toFixed(1)+' kW</td><td style="text-align:left;font-size:13px;color:#7a90a4;">탈수 소비전력</td></tr>'
    +'<tr><td style="text-align:left;font-weight:700;">메인 공급배관</td><td class="hi">'+R.mainDuctSpec+'</td><td style="text-align:left;font-size:13px;color:#7a90a4;">블로어→헤더 18m/s</td></tr>'
    +'<tr><td style="text-align:left;font-weight:700;">나이프 분기관</td><td class="hi">'+R.branchDuctSpec+'</td><td style="text-align:left;font-size:13px;color:#7a90a4;">헤더→나이프 15m/s</td></tr>'
    +'</tbody></table>'
    +'<div style="margin-top:8px;padding:9px 11px;border-radius:8px;font-weight:700;font-size:14px;background:#ede7f6;color:#4527a0;">💨 총 '+kt+'개 나이프 → 링블로어 <b>'+bs.unit.kw+'kW × '+bs.count+'대</b> (합계 '+bs.totalKW.toFixed(1)+'kW)</div>';
}

function buildRec(){
  const r=[];
  if(!S.wTankIns)r.push('🧥 <b>세척 저수조 단열 미적용</b> → 적용 시 유지손실 약 50%↓');
  if(!S.boilerIns)r.push('🧥 <b>보일러 탱크 단열 미적용</b> → 단열 시 손실 68%↓');
  if(S.boilerType==='electric')r.push('♨️ <b>전기보일러</b> → 가스 전환 시 열원단가 40~60%↓');
  if(S.knifeAng<45||S.knifeAng>60)r.push('📐 <b>에어나이프 '+S.knifeAng+'°</b> → 45~60°로 조정 시 물 제거↑');
  if(S.knifePass<4)r.push('🔪 <b>면당 '+S.knifePass+'패스</b> → 4패스 권장 (완전 탈수 → 건조부하 급감)');
  if(!R.gapOK)r.push('↔️ <b>이격거리 '+S.knifeGap+'mm 부적정</b> → 슬릿 '+S.knifeSlot+'mm 기준 '+R.gapOpt.lo+'~'+R.gapOpt.hi+'mm로 조정 (충돌풍속 확보)');
  r.push('💨 <b>링블로어 '+R.blowerSel.unit.kw+'kW × '+R.blowerSel.count+'대</b> (총'+R.blowerSel.totalKW.toFixed(1)+'kW) — 나이프 '+S.blowerPerN+'개당 1대 배분');
  r.push('🔧 <b>이격거리 조정 구조</b>: LM가이드+눈금핸들로 트레이 기종별 거리를 손쉽게 재현');
  if(S.dryRecirc<60)r.push('♻️ <b>순환 '+S.dryRecirc+'%</b> → 60~80%로 높이면 가열부하↓');
  if(S.dryTemp>95)r.push('🌡️ <b>건조온도 '+S.dryTemp+'°C</b> → 트레이는 평판이라 낮춰도 충분');
  r.push('💡 <b>트레이 핵심</b>: 평판 특성상 탈수가 잘 되면 건조 에너지가 크게 절감됩니다. 에어나이프 최적화가 가장 효과적입니다.');
  return r.map(x=>'<div class="rec-i">'+x+'</div>').join('');
}
function renderCost(){
  const cr=gi('costResult');if(!cr)return;
  const daily=R.elecReal*S.hours,monthly=daily*S.days,cost=monthly*S.rate;
  let gasCost=0,gasNote='';
  if(R.gasLoad>0){const gM3H=R.gasLoad/(10.4*0.9),gM3M=gM3H*S.hours*S.days;gasCost=gM3M*S.gasRate;gasNote='<div class="cost-it"><div class="cl2">월 가스</div><div class="cv">'+Math.round(gM3M).toLocaleString()+' m³</div></div>';}
  cr.innerHTML='<div class="cost-res">'
    +'<div class="cost-it"><div class="cl2">일 전력</div><div class="cv">'+Math.round(daily)+' kWh</div></div>'
    +'<div class="cost-it"><div class="cl2">월 전력</div><div class="cv">'+Math.round(monthly).toLocaleString()+' kWh</div></div>'
    +gasNote
    +'<div class="cost-it hl"><div class="cl2">월 에너지비 합계</div><div class="cv">'+Math.round(cost+gasCost).toLocaleString()+' 원</div></div></div>'
    +'<div class="note">※ 전기 실운전 + 가스비 합산. 심야전력·폐열회수 미반영.</div>'
    +'<div class="save"><div class="save-h">💰 추가 절감 방안</div>'
    +'<div class="save-i">🌙 심야전력(23~09시) 예열 → 전력단가 약 40%↓</div>'
    +'<div class="save-i">♻️ 세척 배수 폐열회수 → 보충수 예열 → 보일러 20~30%↓</div>'
    +'<div class="save-i">💨 트레이는 탈수 강화가 건조 절감의 핵심</div></div>';
}
// ── 상관관계 ──
function buildCorr(){
  var h='<div class="card"><div class="ch"><span class="ci">🔗</span><span class="cl">트레이 변수 상관관계</span></div><div class="cb">';
  h+='<div class="corr-intro">💡 트레이는 <b>세워서 좌우 2CH 투입</b>되는 평판입니다. <b class="corr-up">↑</b>증가 <b class="corr-dn">↓</b>감소. 핵심은 <b>탈수 강화로 건조 에너지를 줄이는 것</b>입니다.</div>';
  h+='<div class="corr-legend"><span><b class="corr-up">↑증가</b></span><span><b class="corr-dn">↓감소</b></span><span><b class="corr-eff">효율</b></span><span><b class="corr-cost">에너지·비용</b></span></div>';
  h+='<div class="corr-sect">💧 세척부 (2CH)</div><table class="corr-tbl"><thead><tr><th style="width:24%">변수</th><th style="width:8%">조작</th><th>연쇄 영향</th></tr></thead><tbody>'
    +cr('홀 직경','↑','노즐유량<span class="corr-up">↑</span>·세척력<span class="corr-eff">↑</span>·펌프부하<span class="corr-cost">↑</span> (2~3mm 최적)')
    +cr('분사 압력','↑','세척력<span class="corr-eff">↑</span>·펌프전력<span class="corr-cost">↑↑</span> (2CH이므로 총유량 2배)')
    +cr('노즐 수','↑','커버리지<span class="corr-eff">↑</span>·유량<span class="corr-up">↑</span> (외벽+격벽 각 채널 독립)')
    +cr('세척 온도','↑','세척력<span class="corr-eff">↑</span>·히터/보일러부하<span class="corr-cost">↑</span>')
    +cr('세척 단수','↑','세척율<span class="corr-eff">↑↑</span>·펌프/히터<span class="corr-cost">↑</span>')
    +cr('저수조 단열','ON','유지손실<span class="corr-dn">↓50%</span> ✅저비용 고효율')
    +'</tbody></table>';
  h+='<div class="corr-sect">💨 탈수부 (트레이 강점)</div><table class="corr-tbl"><thead><tr><th style="width:24%">변수</th><th style="width:8%">조작</th><th>연쇄 영향</th></tr></thead><tbody>'
    +cr('나이프 개수','↑','잔류수분<span class="corr-dn">↓</span> → <b>건조부하<span class="corr-dn">↓↓</span></b> (4개 최적)')
    +cr('분사 각도','45~60°','물 제거<span class="corr-eff">최대</span> (진행 역방향)')
    +cr('토출 속도','↑','잔류수분<span class="corr-dn">↓</span>·블로어부하<span class="corr-cost">↑</span>')
    +cr('평판 특성','—','세워서 투입 → 중력배수 + 에어나이프 → 탈수효율<span class="corr-eff">우수</span>')
    +'</tbody></table>';
  h+='<div class="corr-sect">🔥 건조부 (저부하)</div><table class="corr-tbl"><thead><tr><th style="width:24%">변수</th><th style="width:8%">조작</th><th>연쇄 영향</th></tr></thead><tbody>'
    +cr('열풍 온도','↑','건조속도<span class="corr-eff">↑</span>·열부하<span class="corr-cost">↑↑</span> (트레이는 낮춰도 충분)')
    +cr('순환 재사용','↑','신선공기 가열<span class="corr-dn">↓↓</span>·열부하<span class="corr-dn">↓</span>')
    +cr('잔류수분(탈수결과)','↓','증발부하<span class="corr-dn">↓↓</span> → <b>건조에너지<span class="corr-dn">↓↓</span></b>')
    +'</tbody></table>';
  h+='<div class="corr-sect">⚖️ 효율 ↔ 투자비 트레이드오프</div>';
  h+='<div class="tradeoff"><div class="tradeoff-h">1. 탈수 투자 vs 건조 에너지</div><div class="tradeoff-b">트레이는 평판이라 에어나이프 효과가 특히 큽니다. 탈수 강화(투자↑) → 잔류수분↓ → <b>건조 열부하 급감</b>. 트레이 설비의 최대 절감 포인트입니다.</div></div>';
  h+='<div class="tradeoff"><div class="tradeoff-h">2. 단열 투자 vs 유지 전력</div><div class="tradeoff-b">저수조·보일러 단열은 저렴한 투자로 열손실 40~68%↓. 회수기간 최단.</div></div>';
  h+='<div class="tradeoff"><div class="tradeoff-h">3. 순환 재사용 vs 덕트 투자</div><div class="tradeoff-b">열풍 순환률↑(덕트 투자) → 신선공기 가열부하↓. 트레이는 건조부하가 낮아 중간 수준이면 충분합니다.</div></div>';
  h+='<div class="corr-sect">🎯 트레이 최적 설계 우선순위</div><table class="corr-tbl"><thead><tr><th style="width:8%">순위</th><th style="width:32%">조치</th><th>효과</th></tr></thead><tbody>'
    +'<tr><td class="var">1</td><td class="var">저수조·보일러 단열</td><td>유지손실 40~68%↓ · <span class="corr-eff">회수 최단</span></td></tr>'
    +'<tr><td class="var">2</td><td class="var">에어나이프 탈수 강화</td><td>건조 열부하 급감 · <span class="corr-eff">트레이 최대 절감</span></td></tr>'
    +'<tr><td class="var">3</td><td class="var">가스보일러+온수 집중</td><td>세척조 전기히터 60%↓</td></tr>'
    +'<tr><td class="var">4</td><td class="var">배수 폐열회수</td><td>보일러 20~30%↓</td></tr>'
    +'<tr><td class="var">5</td><td class="var">심야전력 예열</td><td>전력단가 40%↓</td></tr>'
    +'</tbody></table>';
  h+='</div></div>';return h;
}
function cr(v,op,eff){return '<tr><td class="var">'+v+'</td><td style="text-align:center;font-weight:800;color:#5e35b1;">'+op+'</td><td>'+eff+'</td></tr>';}

// ── 이벤트 ──
document.querySelectorAll('.proctab button').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.proctab button').forEach(b=>b.classList.remove('on'));
    btn.classList.add('on');_tab=btn.dataset.tab;renderLeft();renderRight();
  });
});
gi('bPC').addEventListener('click',()=>{gi('bPC').classList.add('on');gi('bMB').classList.remove('on');gi('wrap').classList.remove('mobile');});
gi('bMB').addEventListener('click',()=>{gi('bMB').classList.add('on');gi('bPC').classList.remove('on');gi('wrap').classList.add('mobile');});
renderLeft();renderRight();
</script>
</body>
