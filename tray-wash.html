<script>
// ═══════════════════════════════════════════════
// 트레이 세척·탈수·건조 시뮬레이터 v2.1
// 좌우 2CH 세워서 투입 (외벽+격벽 각 채널 독립 노즐)
// ═══════════════════════════════════════════════
const VER='2.1';
const gi=id=>document.getElementById(id);
const gv=id=>{const e=gi(id);return e?e.value:'';};

const S={
  // 트레이 규격 (세워서 투입)
  trayW:600,trayD:400,trayT:50,qty:500,dlv:3,
  // 세척 (2CH 고정)
  wZones:3,wHole:2.5,wTemp:60,
  // 단계별 독립 설정 [1차, 2차, 3차헹굼]
  stgPress:[280,200,120], stgCol:[6,4,3], stgRow:[6,5,4], stgType:['wash','wash','rinse'],
  wTankL:1500,wTankW:800,wTankD:600,wTankIns:true,
  drainCount:1,drainHead:8,
  // 여과 시스템 (1·2차 세척조)
  meshFilter:true, meshSize:30, sludgeFilter:true, sludgeMesh:100,
  pumpStrainer:true, strainerMesh:50, autoBackwash:false, filterWaterSave:true,
  // 탈수
  knifePass:4,knifeAng:45,knifeVel:60,knifePress:20,knifeSlot:1.0,knifeGap:60,knifeLen:600,blowerPerN:2,
  // 건조
  dryTemp:75,dryAirVol:25,dryRecirc:70,heaterCount:2,
  // 온수/유틸
  boilerType:'gas',boilerTankL:1000,boilerIns:true,inletTemp:15,convKW:1.5,
  // 급수 방식: cascade(역류) or direct(직공급), 헹굼 청수량, 1차 보조급수
  supplyMode:'cascade', rinseWater:200, aux1st:false, aux1stWater:100,
  rinseTemp:50,
  // 전기료
  hours:8,days:22,rate:130,gasRate:900,
  // 기구·구조
  convLen:12000,clipPitch:500,guideRod:true,trayWeight:50,
  washDryLen:4000,dewatLen:2000,dryLen:4000,ioLen:2000,trayPitch:450,
  containerType:'40ft',moduleSplit:true
};
const CH=2; // 트레이는 좌우 2CH 고정
const FACES_PER_CH=2; // 채널당 외벽+격벽 2면

// 링블로어 표준 사양 (kW, 풍량 m³/min, 정압 kPa)
const BLOWERS=[
  {kw:2.2, flow:3.5,  press:20},
  {kw:4.0, flow:6.0,  press:25},
  {kw:5.5, flow:8.5,  press:28},
  {kw:7.5, flow:12.0, press:30},
  {kw:11,  flow:18.0, press:32},
  {kw:15,  flow:24.0, press:35},
  {kw:22,  flow:36.0, press:38},
];
// 필요 풍량·압력 → 링블로어 자동 선정 (대수 포함)
function selectBlower(needAirM3min, needPressKPa){
  // 압력 충족하는 것 중 풍량 감당 최소 규격 찾기
  const cand=BLOWERS.filter(b=>b.press>=needPressKPa);
  const pool=cand.length?cand:BLOWERS;
  // 1대로 감당 가능?
  for(const b of pool){
    if(b.flow>=needAirM3min) return {unit:b, count:1, totalKW:b.kw, totalFlow:b.flow};
  }
  // 최대 규격 여러 대
  const big=pool[pool.length-1];
  const count=Math.ceil(needAirM3min/big.flow);
  return {unit:big, count, totalKW:big.kw*count, totalFlow:big.flow*count};
}
// 배관 내경 (풍량 m³/min, 유속 m/s → mm)
function ductDia(airM3min, velMs){
  const Q=airM3min/60; const A=Q/velMs;
  return Math.sqrt(4*A/Math.PI)*1000;
}
// KS 배관 규격으로 올림 (내경 기준 근사)
function ductSpec(idMm){
  const specs=[[40,42],[50,54],[65,70],[80,82],[100,105],[125,130],[150,155],[200,205],[250,255]];
  for(const [nm,id] of specs){ if(id>=idMm) return nm+'A (ID~'+id+'mm)'; }
  return '250A+';
}

// ── 물리 계산 ──
function nozzleQ(h,p){const Cd=0.62,r=h/1000/2,A=Math.PI*r*r;return Cd*Math.sqrt(2*p*1000/1000)*A*1000*60;}
function pumpPowerKW(lpm,head,eff){return 1000*9.81*(lpm/60000)*head/eff/1000;}
function lpmToKW(lpm,p,eff){return (lpm/60000*p*1000)/eff/1000;}
function tankVol(L,W,D){return Math.round(L*W*D*0.75/1e6);}
function heaterMaintainKW(t,temp,ins){return t*(ins?0.022:0.045)*(Math.max(0,temp-20)/40);}
// 에어나이프 1개 풍량 (m³/min): 슬롯길이 × 슬롯폭 × 풍속
function knifeFlow1(lenMm, slotMm, velMs){ return (lenMm/1000)*(slotMm/1000)*velMs*60; }
// 총 나이프 개수 = 면당 패스수 × 앞뒤(2면) × CH(2)
function totalKnives(passPerFace){ return passPerFace * 2 * CH; }
// 이격거리별 충돌 풍속 감쇠 (슬롯제트 감쇠)
function impactVel(v0, slotMm, gapMm){
  const core = slotMm * 5.2; // 핵심영역 길이
  if(gapMm <= core) return v0;
  return v0 * Math.sqrt(core/gapMm);
}
// 이격거리 최적 판정 (슬롯폭 40~80배, 절대 30~80mm)
function gapOptimal(slotMm){
  const lo = Math.max(30, slotMm*40);
  const hi = Math.min(80, slotMm*80);
  return {lo:Math.round(lo), hi:Math.round(hi)};
}
// 비스듬 설치 나이프 길이 (면높이 / cos각도)
function knifeLength(faceHmm, angDeg){
  return faceHmm / Math.cos(angDeg*Math.PI/180);
}
function blowerKW(air,p,eff){return (air/60)*p*1000/eff/1000;}
function dryerKW(res,airVol,dT,recirc){const evap=res*2260/3600;const airH=(airVol/60)*1.2*1005*dT/1000;return evap+airH*(1-recirc/100);}
// 트레이 잔류수분 — 평판이라 탈수 효율 좋음 (개당 30g 기준)
// 트레이 잔류수분 — 면당 4패스 순차 제거 모델
// 각 pass가 남은 물의 일정 비율 제거, 성능(속도·이격·슬롯)에 따라 제거율 결정
function residualWater(qty, pass, vel, ang, slotMm, gapMm){
  const base = qty*0.03; // 개당 30g 초기 잔류
  // 충돌 풍속 (이격거리 반영)
  const vImpact = impactVel(vel, slotMm, gapMm);
  const eVel = Math.min(1, vImpact/25);      // 충돌 25m/s 이상이면 양호
  const eAng = 1 - Math.abs(ang-45)/90;      // 45° 최적
  // 이격거리 적정성
  const go = gapOptimal(slotMm);
  const eGap = (gapMm>=go.lo && gapMm<=go.hi) ? 1 : 0.7;
  // pass당 제거율 (성능 반영, 40~65%)
  const removePerPass = 0.4 + 0.25*(eVel*eAng*eGap);
  // 앞뒤 양면이므로 실제 유효 pass = pass (면당)
  let w = base;
  for(let i=0;i<pass;i++){ w = w*(1-removePerPass); }
  return w;
}

function updateSlider(id){
  const el=gi(id),rg=gi('rg-'+id),fl=gi('fl-'+id),op=gi('op-'+id),bd=gi('bd-'+id),ss=gi('ss-'+id);
  if(!el||!fl)return;
  const val=+el.value,min=+el.min,max=+el.max,oMin=+ss.dataset.omin,oMax=+ss.dataset.omax,unit=ss.dataset.unit;
  const pct=Math.min(100,Math.max(0,(val-min)/(max-min)*100));
  const pMin=Math.min(100,Math.max(0,(oMin-min)/(max-min)*100));
  const pMax=Math.min(100,Math.max(0,(oMax-min)/(max-min)*100));
  let st='opt',tx='✅ 최적',cl='o';
  if(val<oMin){st='low';tx='⚠️ 부족';cl='w';}else if(val>oMax){st='high';tx='🔴 초과';cl='b';}
  const col={opt:'linear-gradient(90deg,#2e7d32,#43a047)',low:'linear-gradient(90deg,#f57f17,#ffb300)',high:'linear-gradient(90deg,#c62828,#e53935)'};
  fl.style.width=pct+'%';fl.style.background=col[st];fl.innerHTML='<span>'+val+'</span>';
  op.style.left=pMin+'%';op.style.width=(pMax-pMin)+'%';
  bd.textContent=tx;bd.className='sv-badge '+st;
  if(rg&&+rg.value!==val)rg.value=val;
  ss.innerHTML='<span class="sv-si o">최적 '+oMin+'~'+oMax+unit+'</span><span class="sv-si c">현재 '+val+unit+'</span><span class="sv-si '+cl+'">'+tx+'</span>';
}
function bindSlider(id){
  const el=gi(id),rg=gi('rg-'+id);if(!el||!rg)return;
  rg.addEventListener('input',()=>{el.value=rg.value;el.classList.add('s-user');onChange(id);});
  el.addEventListener('input',()=>{rg.value=el.value;el.classList.add('s-user');onChange(id);});
}
function syncState(){
  ['trayW','trayD','trayT','qty','dlv','wZones','wHole','wPress','wCol','wRow','wTemp','wTankL','wTankW','wTankD','drainCount','drainHead','knifePass','knifeAng','knifeVel','knifePress','knifeSlot','knifeGap','knifeLen','blowerPerN','dryTemp','dryAirVol','dryRecirc','heaterCount','boilerTankL','inletTemp','rinseWater','rinseTemp','aux1stWater','convKW','hours','days','rate','gasRate','clipPitch','trayWeight','washDryLen','dewatLen','dryLen','ioLen','trayPitch'].forEach(k=>{const e=gi(k);if(e&&e.value!=='')S[k]=+e.value;});
  const bt=gi('boilerType');if(bt)S.boilerType=bt.value;
  const wi=gi('wTankIns');if(wi)S.wTankIns=wi.checked;
  const bi=gi('boilerIns');if(bi)S.boilerIns=bi.checked;
  const gr=gi('guideRod');if(gr)S.guideRod=gr.checked;
  const ms=gi('moduleSplit');if(ms)S.moduleSplit=ms.checked;
  const ct=gi('containerType');if(ct)S.containerType=ct.value;
  const sm=gi('supplyMode');if(sm)S.supplyMode=sm.value;
  const a1=gi('aux1st');if(a1)S.aux1st=a1.checked;
  ['meshFilter','sludgeFilter','pumpStrainer','autoBackwash'].forEach(id=>{const e=gi(id);if(e)S[id]=e.checked;});
  ['meshSize','sludgeMesh','strainerMesh'].forEach(id=>{const e=gi(id);if(e&&e.value)S[id]=+e.value;});
  // 단계별 배열 동기화
  for(let i=0;i<4;i++){
    const p=gi('stgPress'+i); if(p&&p.value!=='') S.stgPress[i]=+p.value;
    const c=gi('stgCol'+i); if(c&&c.value!=='') S.stgCol[i]=+c.value;
    const r=gi('stgRow'+i); if(r&&r.value!=='') S.stgRow[i]=+r.value;
    const t=gi('stgType'+i); if(t) S.stgType[i]=t.value;
  }
}

function onChange(id){syncState();if(id&&gi(id))updateSlider(id);calcAll();renderRight();if(_tab==='balance'&&gi('balanceChart'))setTimeout(drawBalanceChart,10);}

// ── 종합 계산 (2CH 트레이) ──
// 여과 충실도 점수 (0~3)
function filterScore(s){
  return (s.meshFilter?1:0)+(s.sludgeFilter?1:0)+(s.pumpStrainer?1:0);
}
let R={};
function calcAll(){
  syncState();
  const qtyH=S.qty;
  // ── 세척부 단계별 계산 (1차/2차/3차헹굼) ──
  const zn = S.wZones;
  let washPumpTotal=0, washFlowTotal=0, washWaterTotal=0;
  const stgDetail=[];
  for(let i=0;i<zn;i++){
    const press = S.stgPress[i]||200;
    const nPerFace = (S.stgCol[i]||4)*(S.stgRow[i]||4);
    const qE = nozzleQ(S.wHole, press);
    const flow = qE*nPerFace*FACES_PER_CH*CH*1.15; // 2CH×2면
    const pkw = lpmToKW(flow, press, 0.75);
    const isRinse = (S.stgType[i]==='rinse');
    // 헹굼은 청수 소비↑, 세척은 순환 손실 3%
    const water = isRinse ? flow*60*0.15/1000 : flow*60*0.03/1000; // L/h
    washPumpTotal += pkw;
    washFlowTotal += flow;
    washWaterTotal += water;
    stgDetail.push({idx:i, press, nPerFace, col:S.stgCol[i], row:S.stgRow[i], flow, pkw, isRinse, water});
  }
  const washFlow = washFlowTotal;
  const qPerCh = washFlowTotal/CH;
  const tankL = tankVol(S.wTankL,S.wTankW,S.wTankD);
  const washHeaterEach = heaterMaintainKW(tankL,S.wTemp,S.wTankIns);
  const washHeaterTotal = washHeaterEach*zn;
  const nPerFace = stgDetail.length?stgDetail[0].nPerFace:16;
  const drainFlow=tankL/3;
  const drainKW=pumpPowerKW(drainFlow,S.drainHead,0.6)*S.drainCount;
  // 탈수 — 세워진 트레이 높이(trayW)를 나이프 길이로
  // ── 탈수: 면당 4패스 × 앞뒤 2면 × 2CH ──
  const knifeTotal = totalKnives(S.knifePass); // 패스×앞뒤×CH = 16개(4패스)
  const knifeLen = knifeLength(S.trayD, S.knifeAng); // 비스듬 설치 실제 길이
  const flow1 = knifeFlow1(knifeLen, S.knifeSlot, S.knifeVel); // 나이프1개 풍량
  const airFlow = flow1 * knifeTotal; // 총 풍량 m³/min
  // 충돌 풍속·이격 판정
  const vImpact = impactVel(S.knifeVel, S.knifeSlot, S.knifeGap);
  const gapOpt = gapOptimal(S.knifeSlot);
  const gapOK = (S.knifeGap>=gapOpt.lo && S.knifeGap<=gapOpt.hi);
  // 링블로어 배분: 나이프 blowerPerN개당 1대
  const blowerCount = Math.ceil(knifeTotal / S.blowerPerN);
  const flowPerBlower = flow1 * S.blowerPerN;
  const blowerUnit = selectBlower(flowPerBlower, S.knifePress).unit;
  const blowKW = blowerUnit.kw * blowerCount;
  const blowerSel = {unit:blowerUnit, count:blowerCount, totalKW:blowKW, flowPerBlower};
  // 공급 배관: 메인(블로어→헤더 18m/s), 분기(나이프당 15m/s)
  const mainDuctID = ductDia(flowPerBlower, 18);
  const mainDuctSpec = ductSpec(mainDuctID);
  const branchDuctID = ductDia(flow1, 15);
  const branchDuctSpec = ductSpec(branchDuctID);
  const residual = residualWater(qtyH, S.knifePass, S.knifeVel, S.knifeAng, S.knifeSlot, S.knifeGap);
  const dryKW=dryerKW(residual,S.dryAirVol,S.dryTemp-20,S.dryRecirc);
  // ── 급수 방식별 물·가열 에너지 계산 ──
  const rinseW = S.rinseWater;      // 헹굼 청수 L/h
  let freshWater, boilerHeatKW;
  if(S.supplyMode==='cascade'){
    // 캐스케이드: 청수는 헹굼에만, 오버플로우로 2·1차 재사용
    // 신규 청수 = 헹굼 보충분 (+ 1차 보조급수 옵션)
    const aux = S.aux1st ? S.aux1stWater : 0;
    freshWater = rinseW + aux;
    // 가열: 헹굼(청수 15→헹굼온도) + 1·2차 추가가열(역류수 헹굼온도→세척온도)
    const qRinse = rinseW*4.18*(S.rinseTemp-S.inletTemp)/3600;
    const qWashExtra = rinseW*4.18*(S.wTemp-S.rinseTemp)/3600; // 역류수 추가가열
    const qAux = aux*4.18*(S.wTemp-S.inletTemp)/3600; // 보조급수 가열
    boilerHeatKW = qRinse + qWashExtra + qAux;
  } else {
    // 직공급: 각 조 개별 청수 보충 + 개별 가열
    const w1=150, w2=120; // 1·2차 개별 보충 근사
    freshWater = rinseW + w1 + w2;
    const q1=w1*4.18*(S.wTemp-S.inletTemp)/3600;
    const q2=w2*4.18*(S.wTemp-S.inletTemp)/3600;
    const q3=rinseW*4.18*(S.rinseTemp-S.inletTemp)/3600;
    boilerHeatKW = q1+q2+q3;
  }
  const supplyFresh = freshWater;
  const boilerLossKW=heaterMaintainKW(S.boilerTankL,S.wTemp,S.boilerIns);
  const boilerTotalKW=boilerHeatKW+boilerLossKW;
  const elecHeater=(S.boilerType==='electric')?boilerTotalKW:0;
  const gasLoad=(S.boilerType==='gas')?boilerTotalKW:0;
  const washHeatElec=washHeaterTotal*0.4; // 외부보일러 공급 시 세척조 보조 유지만
  const elecTotal=washPumpTotal+drainKW+blowKW+dryKW+washHeatElec+elecHeater+S.convKW;
  const elecReal=washPumpTotal+drainKW+blowKW+dryKW*0.7+washHeatElec*0.35+elecHeater*0.35+S.convKW;
  // 효율 (트레이 특성 반영: 평판이라 탈수·건조 우수)
  // 세척효율: 단계 누적 (각 단계가 잔류오염 제거, 헹굼은 마무리)
  let dirt=100;
  for(let i=0;i<zn;i++){
    const isRinse=(S.stgType[i]==='rinse');
    const press=S.stgPress[i]||200;
    // 제거율: 압력·노즐수·온도 기반, 헹굼은 잔류 마무리
    const nP=(S.stgCol[i]||4)*(S.stgRow[i]||4);
    const pressF=Math.min(1,press/280);
    const nozF=Math.min(1,nP/24);
    const baseRem=isRinse?0.88:(0.5+0.25*pressF+0.15*nozF);
    const tempF=isRinse?1:(1+(S.wTemp-40)*0.004);
    const dirtF=isRinse?1:(1-(S.dlv-1)*0.05);
    dirt=dirt*(1-Math.min(0.95,baseRem*tempF*dirtF));
  }
  const washEff=Math.min(99,100-dirt);
  const dewatEff=Math.min(99,(1-residual/(qtyH*0.03))*100);
  const dryEff=Math.min(99,65+S.dryTemp*0.28+S.dryRecirc*0.12);
  // ── 컨베이어 속도·길이·체류시간 연동 ──
  const convTotalLen = S.washDryLen + S.dewatLen + S.dryLen + S.ioLen; // 모듈 합산
  const speedMmin = S.qty * (S.trayPitch/1000) / 60; // 처리량→속도 m/min
  const speedMs = speedMmin/60;
  // ── 세척 CAPA (2CH 합계) 및 투입 간격 ──
  // 설정 처리량 S.qty는 1CH(라인) 기준 → 2CH 합계 = ×2
  const capa1ch = S.qty;              // 1채널 매/h
  const capa2ch = capa1ch * CH;       // 2CH 합계 매/h
  // 투입: 2CH이므로 좌우 2개씩 동시 투입, 간격(초) = 3600 / (1CH 시간당 개수)
  const feedIntervalSec = capa1ch>0 ? 3600/capa1ch : 0; // 2개씩 투입 간격
  const traysPerMin = speedMs*1000/S.trayPitch; // 분당 트레이(1CH)
  // 각 구간 체류시간 = 길이/속도
  const dwellWash = speedMs>0 ? (S.washDryLen/1000)/speedMs : 0;
  const dwellDewat = speedMs>0 ? (S.dewatLen/1000)/speedMs : 0;
  const dwellDry = speedMs>0 ? (S.dryLen/1000)/speedMs : 0;
  // 필요 최소 체류시간 (공정 강도 기반)
  const needWash = 6 + S.dlv*2; // 오염도 높을수록 더 필요
  const needDewat = Math.max(3, S.knifePass*1.2);
  const needDry = 8 + (S.dryTemp<80?4:0);
  // 최적(최단) 길이 = 필요체류 × 속도 × 여유20%
  const optWashLen = Math.ceil(needWash*speedMs*1000*1.2/100)*100;
  const optDewatLen = Math.ceil(needDewat*speedMs*1000*1.2/100)*100;
  const optDryLen = Math.ceil(needDry*speedMs*1000*1.2/100)*100;
  // 체류 충분성 판정
  const washOK = dwellWash>=needWash, dewatOK=dwellDewat>=needDewat, dryOK=dwellDry>=needDry;

  R={washFlow,qPerCh,washPumpTotal,convTotalLen,speedMmin,speedMs,capa1ch,capa2ch,feedIntervalSec,traysPerMin,dwellWash,dwellDewat,dwellDry,needWash,needDewat,needDry,optWashLen,optDewatLen,optDryLen,washOK,dewatOK,dryOK,washWaterTotal,stgDetail,tankL,washHeaterEach,washHeaterTotal,drainFlow,drainKW,airFlow,blowKW,residual,dryKW,boilerHeatKW,boilerLossKW,boilerTotalKW,elecTotal,elecReal,gasLoad,washEff,dewatEff,dryEff,nPerFace,washHeatElec,elecHeater,supplyFresh,supplyMode:S.supplyMode,knifeTotal,knifeLen,flow1,blowerSel,mainDuctSpec,mainDuctID,branchDuctSpec,branchDuctID,vImpact,gapOpt,gapOK};
}

// 밸런스 곡선 그리기 (블로어 규격별 탈수/건조/합계)
function drawBalanceChart(){
  const cv=gi('balanceChart'); if(!cv)return;
  const dpr=window.devicePixelRatio||1;
  const W=cv.clientWidth, H=240;
  cv.width=W*dpr; cv.height=H*dpr;
  const ctx=cv.getContext('2d'); ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,W,H);
  // X축: 블로어 규격 순회, Y: 전력
  const pad={l:44,r:12,t:14,b:34};
  const gw=W-pad.l-pad.r, gh=H-pad.t-pad.b;
  // 데이터 생성: 각 블로어 규격에서 탈수·건조·합계
  const pts=[];
  BLOWERS.forEach(b=>{
    // 이 블로어로 나이프 감당 → 탈수효율 근사 (풍량 비례)
    const dewatE=Math.min(99,60+b.flow*1.4);
    const residual=6*(1-dewatE/100);
    const dryKW=residual*2.26+5*(S.dryTemp/80);
    const blowKW=b.kw*Math.ceil(R.knifeTotal/S.blowerPerN);
    pts.push({x:b.kw,dewat:blowKW,dry:dryKW,sum:blowKW+dryKW,flow:b.flow});
  });
  const maxKW=Math.max.apply(null,pts.map(p=>Math.max(p.dewat,p.dry,p.sum)))*1.1;
  const minX=pts[0].x, maxX=pts[pts.length-1].x;
  const sx=v=>pad.l+(v-minX)/(maxX-minX)*gw;
  const sy=v=>pad.t+gh-(v/maxKW)*gh;
  // 축
  ctx.strokeStyle='#ccc'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(pad.l,pad.t); ctx.lineTo(pad.l,pad.t+gh); ctx.lineTo(pad.l+gw,pad.t+gh); ctx.stroke();
  ctx.fillStyle='#888'; ctx.font='11px Noto Sans KR'; ctx.textAlign='right';
  for(let i=0;i<=4;i++){const v=maxKW*i/4; ctx.fillText(v.toFixed(0),pad.l-4,sy(v)+3);}
  ctx.textAlign='center';
  pts.forEach(p=>ctx.fillText(p.x+'kW',sx(p.x),pad.t+gh+16));
  // 곡선 그리기
  function line(key,color){
    ctx.strokeStyle=color; ctx.lineWidth=2.5; ctx.beginPath();
    pts.forEach((p,i)=>{const x=sx(p.x),y=sy(p[key]); if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);});
    ctx.stroke();
    pts.forEach(p=>{ctx.fillStyle=color;ctx.beginPath();ctx.arc(sx(p.x),sy(p[key]),3,0,7);ctx.fill();});
  }
  line('dewat','#e08a1e'); // 탈수(블로어)
  line('dry','#c0392b');   // 건조
  line('sum','#5e35b1');   // 합계
  // 최소 합계점 표시
  let minSum=pts[0],mi=0;
  pts.forEach((p,i)=>{if(p.sum<minSum.sum){minSum=p;mi=i;}});
  ctx.fillStyle='#2e7d32'; ctx.beginPath(); ctx.arc(sx(minSum.x),sy(minSum.sum),6,0,7); ctx.fill();
  ctx.fillStyle='#2e7d32'; ctx.font='bold 11px Noto Sans KR'; ctx.textAlign='center';
  ctx.fillText('최적 '+minSum.x+'kW',sx(minSum.x),sy(minSum.sum)-10);
  // 범례
  ctx.textAlign='left'; ctx.font='11px Noto Sans KR';
  ctx.fillStyle='#e08a1e'; ctx.fillText('■ 탈수(블로어)',pad.l+4,pad.t+10);
  ctx.fillStyle='#c0392b'; ctx.fillText('■ 건조',pad.l+100,pad.t+10);
  ctx.fillStyle='#5e35b1'; ctx.fillText('■ 합계',pad.l+160,pad.t+10);
  // 정보
  const info=gi('balanceInfo');
  if(info) info.innerHTML='<div class="chbox" style="background:#e8f5e9;border-color:#a5d6a7;color:#1b5e20;">✅ <b>최적 링블로어 '+minSum.x+'kW</b> (풍량 '+minSum.flow+'m³/min): 탈수 '+minSum.dewat.toFixed(1)+'kW + 건조 '+minSum.dry.toFixed(1)+'kW = <b>합계 '+minSum.sum.toFixed(1)+'kW 최소</b><br>블로어를 이보다 키우면 탈수 전력 증가가 건조 절감을 넘어섬, 작으면 건조 부하가 급증.</div>';
}

async function fbRest(url,opts){
  opts=opts||{};
  const sep=url.includes('?')?'&':'?';
  const r=await fetch(url+sep+'key='+FB_API,opts);
  if(!r.ok){const t=await r.text();throw new Error('Firebase '+r.status+': '+t.slice(0,150));}

function toFsV(v){
  if(v===null||v===undefined)return{nullValue:null};
  if(typeof v==='boolean')return{booleanValue:v};
  if(typeof v==='number')return{doubleValue:v};
  if(typeof v==='string')return{stringValue:v};
  if(Array.isArray(v))return{arrayValue:{values:v.map(toFsV)}};
  return{stringValue:String(v)};
}
function toFields(o){const f={};for(const k in o)if(o[k]!==undefined)f[k]=toFsV(o[k]);return f;}
function fromFsV(v){
  if(!v)return null;
  if('stringValue'in v)return v.stringValue;
  if('doubleValue'in v)return v.doubleValue;
  if('integerValue'in v)return Number(v.integerValue);
  if('booleanValue'in v)return v.booleanValue;
  if('arrayValue'in v)return (v.arrayValue.values||[]).map(fromFsV);
  return null;
}
function fromFields(f){const o={};for(const k in f)o[k]=fromFsV(f[k]);return o;}

// 현재 설정 수집 (모든 S + 결과 요약)
function collectSettings(){
  syncState();calcAll();
  return Object.assign({},S,{
    _resWashEff:+R.washEff.toFixed(1),_resDewatEff:+R.dewatEff.toFixed(1),
    _resDryEff:+R.dryEff.toFixed(1),_resElecReal:+R.elecReal.toFixed(1),
    _resKnifeTotal:R.knifeTotal,_resBlowerKW:+R.blowKW.toFixed(1)
  });
}
// 설정 적용
function applySettings(d){
  for(const k in S){ if(d[k]!==undefined) S[k]=d[k]; }
  // 배열 필드 복원 (Firebase는 배열도 저장)
  ['stgPress','stgCol','stgRow','stgType'].forEach(k=>{
    if(d[k] && Array.isArray(d[k])) S[k]=d[k].slice();
  });
  // checkbox·select는 S에 반영됨 → renderLeft가 반영
  renderLeft();renderRight();
}

// 저장 (신규 or 수정)
async function doFbSave(){
  const name=(gi('saveName').value||'').trim();
  const memo=(gi('saveMemo').value||'').trim();
  if(!name){gi('saveStatus').innerHTML='<span style="color:#c62828;">이름을 입력하세요</span>';return;}
  gi('saveStatus').innerHTML='<span style="color:#0d7fa8;">저장 중...</span>';
  try{
    const data=collectSettings();
    const body={fields:toFields(Object.assign({},data,{name,memo,savedAt:new Date().toISOString()}))};
    if(_editId){
      await fbRest(FB_BASE+'/'+_editId,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    }else{
      await fbRest(FB_BASE,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    }
    gi('saveStatus').innerHTML='<span style="color:#2e7d32;">✅ 저장 완료</span>';
    setTimeout(()=>{gi('saveModal').style.display='none';_editId=null;},800);
  }catch(e){
    const is403=String(e.message).includes('403')||String(e.message).includes('PERMISSION');
    gi('saveStatus').innerHTML='<span style="color:#c62828;">'+(is403?'⚠️ Firebase 규칙에 tray_sessions 추가 필요':e.message)+'</span>';
  }
}
// 목록 불러오기
async function fbLoadList(kw){
  const list=gi('loadList');list.innerHTML='불러오는 중...';
  try{
    const d=await fbRest(FB_BASE);
    let docs=(d.documents||[]).map(x=>Object.assign({_id:x.name.split('/').pop()},fromFields(x.fields)))
      .sort((a,b)=>(b.savedAt||'')>(a.savedAt||'')?1:-1);
    if(kw){const q=kw.toLowerCase();docs=docs.filter(x=>[x.name,x.memo].some(v=>(v||'').toLowerCase().includes(q)));}
    gi('loadCount').textContent=docs.length+'건';
    if(!docs.length){list.innerHTML='<div style="text-align:center;color:#7a90a4;padding:20px;font-size:14px;">저장된 조건이 없습니다</div>';return;}
    list.innerHTML=docs.map(x=>{
      const dt=(x.savedAt||'').slice(0,16).replace('T',' ');
      return '<div class="load-item" data-id="'+x._id+'" style="border:1px solid #dde5ee;border-radius:8px;padding:9px 11px;margin-bottom:7px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;">'
        +'<div style="flex:1;min-width:0;"><div style="font-weight:700;color:#0d2137;font-size:14px;">'+(x.name||'—')+'</div>'
        +'<div style="font-size:12px;color:#7a90a4;">'+dt+' | '+(x.memo||'')+' | 세척'+(x._resWashEff||'?')+'% 탈수'+(x._resDewatEff||'?')+'% '+(x._resElecReal||'?')+'kW</div></div>'
        +'<button class="load-del" data-id="'+x._id+'" style="background:#ffebee;color:#c62828;border:none;border-radius:6px;padding:5px 9px;font-size:13px;cursor:pointer;font-family:inherit;">🗑</button></div>';
    }).join('');
    // 클릭 이벤트
    list.querySelectorAll('.load-item').forEach(el=>{
      el.addEventListener('click',e=>{
        if(e.target.classList.contains('load-del'))return;
        const doc=docs.find(x=>x._id===el.dataset.id);
        if(doc){applySettings(doc);gi('loadModal').style.display='none';}
      });
    });
    list.querySelectorAll('.load-del').forEach(btn=>{
      btn.addEventListener('click',async e=>{
        e.stopPropagation();
        if(!confirm('삭제하시겠습니까?'))return;
        try{await fetch(FB_BASE+'/'+btn.dataset.id+'?key='+FB_API,{method:'DELETE'});fbLoadList(gi('loadSearch').value);}catch(err){}
      });
    });
  }catch(e){
    const is403=String(e.message).includes('403')||String(e.message).includes('PERMISSION');
    list.innerHTML='<div style="color:#c62828;font-size:13px;padding:12px;line-height:1.6;">'
      +(is403?'⚠️ <b>Firebase 규칙에 tray_sessions 추가 필요</b><br><a href="https://console.firebase.google.com/project/insys-work/firestore/rules" target="_blank" style="color:#0d7fa8;">규칙 페이지 열기 ↗</a><br>match /tray_sessions/{doc} { allow read, write: if true; }':e.message)+'</div>';
  }
}

// 이벤트
gi('btnSave').addEventListener('click',()=>{_editId=null;gi('saveName').value='';gi('saveMemo').value='';gi('saveStatus').innerHTML='';gi('saveModal').style.display='flex';});
gi('btnLoad').addEventListener('click',()=>{gi('loadModal').style.display='flex';fbLoadList('');});
gi('doSave').addEventListener('click',doFbSave);
gi('closeSave').addEventListener('click',()=>gi('saveModal').style.display='none');
gi('closeLoad').addEventListener('click',()=>gi('loadModal').style.display='none');
gi('loadSearch').addEventListener('input',()=>fbLoadList(gi('loadSearch').value));

renderLeft();renderRight();
</script>
</body>
