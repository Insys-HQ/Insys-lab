    [ADJ,ADJv],
    [T('탈수 방식','Dewatering method','脱水方式'),T('에어나이프. 트레이 양 측면에 사선 배치하여 위에서 아래로 물을 쓸어내림. 각 면당 4회 통과(4패스) 구성. 링블로어 1대에 에어나이프 2개를 연결(Y분기). 나이프–트레이 이격은 20~150mm 범위에서 조정 가능한 슬라이드 구조',

  filt:T('세척수 여과는 오일 스키머 + SUS망을 기본으로 한다. 박스는 오물량이 많으므로 백필터 등 추가 여과(차압 게이지로 청소 시점 관리)를 권장하며, 사양은 제작사가 오염 조건을 검토하여 제안한다.',
    'Basic filtration is an oil skimmer + stainless mesh. Because boxes carry more soil, additional filtration such as a bag filter (cleaning timed by differential-pressure gauge) is recommended; the manufacturer proposes the specification after reviewing soil conditions.',

  ref:[
    [T('채널 구성','Channel configuration','通道配置'),T('2채널 동시 처리. 채널당 300~350개/h. 최대 박스 720mm 기준 통과 폭 확보. 채널 간 격벽으로 분사 간섭 방지','2 channels processed simultaneously, 300–350 boxes/h each. Pass-through width based on the 720 mm box. Partition between channels to prevent spray interference.','2通道同时处理，每通道300~350个/小时。按最大720mm周转箱确保通过宽度。通道间设隔板防止喷射干扰。')],

      'Boxes are held standing on the chain conveyor by clips at two or more points. Boxes must not wobble or come off under wash/dewatering spray; the same clips must suit all 5 sizes.',
      '周转箱以夹具形式在链式输送机上至少2处插固并保持立放。清洗、脱水喷射时不得晃动或脱落，5种规格用同一夹具对应。')],
    [T('세척 방식','Washing method','清洗方式'),T('3단 구성(세척 2 + 헹굼 1) 권장. 박스는 상·하·좌·우 4면 분사. 분사노즐은 박스 높이를 전부 덮도록 배열하고, 분사노즐 방향은 진행방향 기준 약 15° 기울여 인접 분사 간섭 회피. 깊이 310mm 박스의 내부 바닥까지 분사가 도달해야 함',

      'Air knives on all four sides. Side knives set diagonally to sweep water downward. 4 passes per side. One ring blower feeds two air knives (Y-branch). Knife-to-box stand-off adjustable 20–150 mm on a slide.',
      '气刀上下左右四面布置。侧面斜向布置自上而下刮除水分。每面4次通过（4道）。1台环形风机连接2把气刀（Y分支）。气刀与周转箱间距在20~150mm范围内可滑动调整。')],

    [MOD,MODv],[MAT,MATv],[PWR,PWRv]
  ],
  sub:[SUB[0],T('가장자리 포켓·깊은 박스(310mm) 내부 세척 및 4면 탈수 대응 방안','Approach for cleaning rim pockets and the inside of the deep (310 mm) box, and for 4-side dewatering','边缘格与深周转箱（310mm）内部清洗及四面脱水的应对方案'),SUB[1],SUB[2],SUB[3],SUB[4]]

// ══════════════ 렌더 ══════════════
const SECT={
  s0:T('문서 정보','Document information','文件信息'), s1:T('세척 대상','Items to be washed','清洗对象'),
  s2:T('처리 요구량','Required capacity','处理要求量'), s3:T('에너지 절약 요구','Energy-saving requirements','节能要求'),
  s4:T('제작 참고 사항','Notes for manufacturing','制作参考事项'), s5:T('제작사 제출 요청 자료','Documents requested from the manufacturer','要求制造商提交的资料'),
  docno:T('문서번호','Document No.','文件编号'), ver:T('버전 / 작성일','Version / date','版本/日期'), auth:T('작성','Prepared by','编制'),
  site:T('설치 장소','Installation site','安装地点'), nature:T('문서 성격','Document type','文件性质'), rel:T('관련 설비','Related equipment','相关设备'),
  natureV:T('발주 요구 사양 — 세부 설계는 제작사 제안에 따름','Procurement requirement — detailed design per manufacturer\'s proposal','采购需求规格 — 详细设计以制造商方案为准'),
  siteV:T('인텍코리아 안산공장','Intec Korea Ansan Plant','Intec Korea 安山工厂'),
  authV:T('인시스 AI혁신 연구개발실 (ys.kim@in-sys.co.kr)','INSYS AI Innovation R&D Office (ys.kim@in-sys.co.kr)','INSYS AI创新研发室 (ys.kim@in-sys.co.kr)')
};
let Q={};   // 질문 저장 {docKey.itemId: text}
const gi=id=>document.getElementById(id);
function qbox(id){
  const key=curDoc()+'.'+id;
  return '<div class="q"><span class="qt">'+L(UI.q)+'</span><textarea data-q="'+key+'" placeholder="'+L(UI.qph)+'" onchange="Q[this.dataset.q]=this.value">'+(Q[key]||'').replace(/</g,'&lt;')+'</textarea></div>';
}
function curDoc(){return gi('docSel').value;}
function card(n,title,body){return '<div class="card"><div class="ch"><span class="cn">'+n+'</span><span class="cl">'+L(title)+'</span></div><div class="cb">'+body+'</div></div>';}
function render(){
  const D=DOCS[curDoc()];
  gi('hdrT').textContent=L(D.name); gi('hdrS').textContent=L(UI.org);
  gi('btnPdf').textContent=L(UI.pdf); gi('btnSave').textContent=L(UI.save); gi('btnLoad').textContent=L(UI.load); gi('btnMail').textContent=L(UI.mail);
  document.title=L(D.name)+' v1.6';
  let h='';
  h+=card(0,SECT.s0,'<table><colgroup><col style="width:16%"><col></colgroup>'
    +'<tr><td class="k">'+L(SECT.docno)+'</td><td>'+D.no+'</td></tr>'
    +'<tr><td class="k">'+L(SECT.ver)+'</td><td>'+D.ver+'</td></tr>'
    +'<tr><td class="k">'+L(SECT.auth)+'</td><td>'+L(SECT.authV)+'</td></tr>'
    +'<tr><td class="k">'+L(SECT.site)+'</td><td>'+L(SECT.siteV)+'</td></tr>'
    +'<tr><td class="k">'+L(SECT.nature)+'</td><td>'+L(SECT.natureV)+'</td></tr>'
    +'<tr><td class="k">'+L(SECT.rel)+'</td><td>'+L(D.rel)+'</td></tr></table>');
  // 1
  let b='<table><colgroup><col style="width:11%"><col style="width:23%"><col></colgroup><tr><th>'+L(UI.item)+'</th><th>'+L(UI.req)+'</th><th>'+L(UI.note)+'</th></tr>';
  D.target.forEach(r=>{b+='<tr><td class="k">'+L(r[0])+'</td><td class="v">'+L(r[1])+'</td><td>'+L(r[2])+'</td></tr>';});
  b+='</table>'+qbox('target');
  const cg = D.sizeHead.length===5 ? '<colgroup><col style="width:8%"><col style="width:19%"><col style="width:10%"><col style="width:10%"><col></colgroup>'
                                    : '<colgroup><col style="width:8%"><col style="width:19%"><col style="width:12%"><col></colgroup>';
  b+='<h3>'+L(D.sizeTitle)+'</h3><table>'+cg+'<tr>'+D.sizeHead.map(x=>'<th>'+L(x)+'</th>').join('')+'</tr>';
  D.sizes.forEach(r=>{b+='<tr>'+r.map((x,i)=>'<td class="'+(i===0?'k c':(i===1?'v c n':(i<r.length-1?'c n':'')))+'">'+L(x)+'</td>').join('')+'</tr>';});
  b+='</table><div class="note">'+L(D.sizeNote)+'</div>'+qbox('size');
  h+=card(1,SECT.s1,b);
  // 2
  b='<table><colgroup><col style="width:11%"><col style="width:26%"><col></colgroup><tr><th>'+L(UI.proc)+'</th><th>'+L(UI.qty)+'</th><th>'+L(UI.crit)+'</th></tr>';
  D.cap.forEach(r=>{b+='<tr><td class="k">'+L(r[0])+'</td><td class="v">'+L(r[1])+'</td><td>'+L(r[2])+'</td></tr>';});
  b+='</table>'+qbox('cap');
  h+=card(2,SECT.s2,b);
  // 3
  b='<div class="note"><ul>'+ENERGY.map(x=>'<li>'+L(x)+'</li>').join('')+'<li>'+L(D.filt)+'</li></ul></div>'+qbox('energy');
  h+=card(3,SECT.s3,b);
  // 4
  b='<table><colgroup><col style="width:18%"><col></colgroup><tr><th>'+L(UI.item)+'</th><th>'+L(UI.content)+'</th></tr>';
  D.ref.forEach((r,i)=>{b+='<tr><td class="k">'+L(r[0])+'</td><td>'+L(r[1])+'</td></tr><tr><td colspan="2" style="padding:0 6px;border-top:0;">'+qbox('ref'+i)+'</td></tr>';});
  b+='</table>';
  h+=card(4,SECT.s4,b);
  // 5
  b='<div class="warn"><ul>'+D.sub.map(x=>'<li>'+L(x)+'</li>').join('')+'</ul></div>'+qbox('submit');
  h+=card(5,SECT.s5,b);
  gi('doc').innerHTML=h;
  gi('foot').textContent=L(UI.foot);
}
function setLang(l){LANG=l;['ko','en','zh'].forEach(k=>gi('l'+k).classList.toggle('on',k===l));document.documentElement.lang=l==='zh'?'zh-CN':l;render();}
function setView(v){gi('wrap').classList.toggle('mobile',v==='mobile');gi('bp').classList.toggle('on',v==='pc');gi('bm').classList.toggle('on',v==='mobile');}

// ══════════════ Firebase(REST) 질문 저장 ══════════════
const FB='https://firestore.googleapis.com/v1/projects/insys-work/databases/(default)/documents/spec_questions';
const KEY='AIzaSyC4DWFGGJjJmVlqnfmZaVDdKJWCXK0Yr_g';
function docId(){return curDoc()+'_'+LANG;}
function collectQ(){document.querySelectorAll('textarea[data-q]').forEach(t=>{Q[t.dataset.q]=t.value;});}
async function saveQ(){
  collectQ();
  const fields={};Object.keys(Q).forEach(k=>{if(Q[k]&&Q[k].trim())fields[k]={stringValue:Q[k]};});
  fields._updated={stringValue:new Date().toISOString()}; fields._doc={stringValue:curDoc()}; fields._lang={stringValue:LANG};
  try{
    const r=await fetch(FB+'/'+docId()+'?key='+KEY,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({fields})});
    if(!r.ok) throw new Error(r.status);
    gi('status').textContent='✅ '+L(UI.saved)+' ('+new Date().toLocaleString()+')';
  }catch(e){gi('status').textContent='⚠️ '+L(UI.fail)+' ('+e.message+')';}
}
async function loadQ(){
  try{
    const r=await fetch(FB+'/'+docId()+'?key='+KEY);
    if(r.status===404){gi('status').textContent=L(UI.none);return;}
    const j=await r.json(); const f=j.fields||{};
    Object.keys(f).forEach(k=>{if(k[0]!=='_')Q[k]=f[k].stringValue||'';});
    render(); gi('status').textContent='✅ '+L(UI.loaded)+' ('+(f._updated?f._updated.stringValue:'')+')';
  }catch(e){gi('status').textContent='⚠️ '+e.message;}
}
function sendMail(){
  collectQ();
  const D=DOCS[curDoc()];
  const lines=Object.keys(Q).filter(k=>Q[k]&&Q[k].trim()&&k.startsWith(curDoc()+'.')).map(k=>'['+k.split('.')[1]+'] '+Q[k]);
  const body=L(D.name)+' ('+D.no+') — '+LANG.toUpperCase()+'\n\n'+(lines.length?lines.join('\n\n'):L(UI.noq))+'\n\n— '+new Date().toLocaleString();
  gi('status').textContent=L(UI.mailHint);
  location.href='mailto:ys.kim@in-sys.co.kr?subject='+encodeURIComponent(L(UI.mailSubj)+' '+L(D.name))+'&body='+encodeURIComponent(body);
}
render();
