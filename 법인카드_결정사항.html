<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>법인카드 결정사항 입력 v1.0</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">

<style>
/* v1.0 — 법인카드 사용 규정 결정사항 입력 (인시스 AI혁신 연구개발실) */
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --ink:#1f2a44; --ink2:#374151; --mute:#4b5563;
  --navy:#1e3a5f; --navy-l:#e8eef7; --line:#cfd8e3;
  --c1:#e3eefb; --c2:#e6f2e6; --bg:#f3f5f8; --ok:#14532d; --warn:#7c2d12;
  --w:480px;
}
html{font-size:14px}
@media (min-width:768px){html{font-size:16px}}
body{font-family:'Noto Sans KR','Malgun Gothic',sans-serif;background:var(--bg);color:var(--ink);font-size:1rem;line-height:1.5}
body.v-pc{--w:1100px}
body.v-mobile{--w:480px}
button,input,select,textarea{font-family:inherit;font-size:1rem;color:var(--ink)}
.hdr{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:50}
.nav-inner,.wrap{max-width:var(--w);margin:0 auto;padding-left:12px;padding-right:12px}
.nav-inner{padding-top:6px;padding-bottom:6px;display:flex;flex-wrap:wrap;align-items:center;gap:6px;justify-content:space-between}
.ttl{font-weight:700;color:var(--navy);font-size:1.0625rem}
.ttl small{font-weight:400;color:var(--mute);font-size:.875rem;margin-left:4px}
.badge{background:var(--navy-l);color:var(--navy);font-weight:700;font-size:.875rem;padding:1px 6px;border-radius:4px;margin-left:4px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:#fff;padding:3px 10px;cursor:pointer}
.seg button.on{background:var(--navy);color:#fff}
.bar{background:#fff;border-bottom:1px solid var(--line)}
.bar .wrap{padding-top:6px;padding-bottom:6px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.btn{border:1px solid var(--navy);background:#fff;color:var(--navy);padding:4px 10px;border-radius:6px;cursor:pointer;font-weight:500}
.btn.pri{background:var(--navy);color:#fff}
.btn.sm{padding:1px 8px;font-size:.875rem}
.btn:disabled{opacity:.5;cursor:default}
#status{font-size:.875rem;color:var(--mute);margin-left:auto}
#status.dirty{color:var(--warn);font-weight:500}
#status.ok{color:var(--ok)}
.wrap{padding-top:8px;padding-bottom:8px}
.card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin:8px 0}
.card h2{font-size:1.0625rem;color:var(--navy);padding:2px 0}
.princ{color:var(--ink2);font-size:.9375rem;padding:2px 0 4px}
.note{background:var(--navy-l);color:var(--ink);border-radius:6px;padding:6px 10px;font-size:.9375rem;margin:4px 0}
.meta{display:grid;gap:6px;grid-template-columns:1fr}
.meta label{display:block;font-weight:500;font-size:.9375rem}
input[type=text],input[type=date],input[type=password],input[type=number],select,textarea{width:100%;border:1px solid var(--line);border-radius:6px;padding:4px 8px;background:#fff}
textarea{resize:vertical;min-height:56px}
.cols{display:none}
.item{border-top:1px solid var(--line);padding:6px 0;display:grid;gap:4px;grid-template-columns:1fr}
.item:first-of-type{border-top:0}
.lbl{font-weight:700}
.ref{font-size:.9375rem;color:var(--ink);border-radius:6px;padding:3px 8px;display:flex;gap:6px;align-items:flex-start;justify-content:space-between}
.ref.r1{background:var(--c1)}
.ref.r2{background:var(--c2)}
.ref b{white-space:nowrap}
.ref .tx{flex:1}
.inp{display:grid;gap:4px;grid-template-columns:1fr}
.inp .f{display:flex;flex-direction:column}
.inp .f span{font-size:.875rem;color:var(--mute)}
body.v-pc .cols{display:grid;grid-template-columns:1.1fr 1fr 1fr 1.3fr;gap:8px;font-weight:700;background:var(--navy-l);color:var(--navy);padding:4px 8px;border-radius:6px;margin-top:4px}
body.v-pc .item{grid-template-columns:1.1fr 1fr 1fr 1.3fr;gap:8px;align-items:start}
body.v-pc .meta{grid-template-columns:1fr 2fr}
.gate{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:100;padding:12px}
.gate .box{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px;width:100%;max-width:340px;display:grid;gap:8px}
.gate h1{font-size:1.125rem;color:var(--navy)}
.gate .err{color:#9b1c1c;font-size:.9375rem;min-height:1.4em}
.ftr{max-width:var(--w);margin:0 auto;padding:6px 12px;display:flex;justify-content:space-between;color:var(--mute);font-size:.875rem}
.toast{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:6px 14px;border-radius:8px;z-index:200;display:none;max-width:90%}
#printArea{display:none}
@media print{
  @page{size:A4;margin:14mm 12mm}
  body{background:#fff}
  #app,#gate,.toast,.hdr,.bar,.ftr{display:none!important}
  #printArea{display:block;font-size:10.5pt;color:#1f2a44}
  #printArea h1{font-size:15pt;color:#1e3a5f;margin-bottom:2pt}
  #printArea .pm{color:#374151;font-size:9.5pt;margin-bottom:6pt}
  #printArea h2{font-size:11.5pt;color:#1e3a5f;margin:8pt 0 3pt;break-after:avoid}
  #printArea table{width:100%;border-collapse:collapse;margin-bottom:4pt}
  #printArea th,#printArea td{border:1px solid #9aa8b8;padding:2pt 5pt;vertical-align:top;text-align:left}
  #printArea th{background:#e8eef7;color:#1e3a5f}
  #printArea tr{break-inside:avoid}
  #printArea td.l{width:36%;font-weight:500}
  #printArea .un{color:#7c2d12}
  #printArea .pf{margin-top:8pt;font-size:9pt;color:#4b5563;display:flex;justify-content:space-between}
}
</style>
</head>
<body class="v-mobile">

<div class="gate" id="gate">

    <button class="btn" id="bC2" type="button">CASE2 일괄 입력</button>
    <button class="btn" id="bLoad" type="button">다시 불러오기</button>
    <button class="btn" id="bReset" type="button">초기화</button>
    <span id="status">대기 중</span>
  </div></div>
  <main class="wrap" id="main"></main>
  <div class="ftr"><span>인시스 AI혁신 연구개발실 · 2026</span><span id="fv"></span></div>
</div>

<div id="printArea"></div>
<div class="toast" id="toast"></div>

<script>

function hs(str){let h1=0xdeadbeef,h2=0x41c6ce57;for(let i=0,ch;i<str.length;i++){ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677);}
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);
  h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
  return 4294967296*(2097151&h2)+(h1>>>0);}

/* ── 상태 ── */
let data={}, dirty=false, db=null, fbOK=false;
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function lsGet(){try{return localStorage.getItem(LS_KEY)}catch(e){return null}}
function lsSet(v){try{localStorage.setItem(LS_KEY,v)}catch(e){}}
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(toast._t);toast._t=setTimeout(()=>t.style.display='none',2600)}
function setStatus(m,cls){const s=$('status');s.textContent=m;s.className=cls||''}
function fmt(d){const p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes())}

function refText(it,c){const o=it['c'+c];return it.f.map(f=>{const v=o[f.k];if(!v)return '';return f.l?f.l+': '+v:v}).filter(Boolean).join(it.join)}

/* ── 렌더 ── */
function ctl(it,f){
  const key=it.id+'.'+f.k, v=data[key]||'';
  const lab=f.l?'<span>'+esc(f.l)+'</span>':'';
  if(f.t==='sel'){
    return '<div class="f">'+lab+'<select data-k="'+key+'" aria-label="'+esc(it.label)+'"><option value="">선택</option>'+f.o.map(o=>'<option'+(o===v?' selected':'')+'>'+esc(o)+'</option>').join('')+'</select></div>';
  }
  return '<div class="f">'+lab+'<input type="text" data-k="'+key+'" value="'+esc(v)+'" placeholder="'+esc(f.ph||'')+'" aria-label="'+esc(it.label+(f.l?' '+f.l:''))+'"></div>';
}
function render(){
  let h='';
  h+='<section class="card"><h2>회의 정보</h2><div class="meta"><div><label for="m_date">회의일</label><input type="date" id="m_date" data-k="meta.date" value="'+esc(data['meta.date']||'')+'"></div><div><label for="m_memo">메모</label><textarea id="m_memo" data-k="meta.memo" placeholder="회의 메모(선택)">'+esc(data['meta.memo']||'')+'</textarea></div></div>'
    +'<div class="note">CASE1 = 일반 기업 기준 추천 / CASE2 = 인시스 기준 추천 (세무상 허용 범위 내 임원 카드 사용 자율성 확대). 각 항목의 「적용」을 누르면 해당 추천값이 입력됩니다.</div></section>';
  SECTIONS.forEach(sec=>{
    h+='<section class="card" id="'+sec.id+'"><h2>'+esc(sec.title)+'</h2><div class="princ">'+esc(sec.princ)+'</div>'
      +'<div class="cols"><div>항목</div><div>CASE1 · 일반 기업</div><div>CASE2 · 인시스</div><div>우리 회사 결정</div></div>';
    sec.items.forEach(it=>{
      h+='<div class="item"><div class="lbl">'+esc(it.label)+'</div>'
        +'<div class="ref r1"><span class="tx"><b>CASE1</b> '+esc(refText(it,1))+'</span><button type="button" class="btn sm" data-ap="1" data-id="'+it.id+'">적용</button></div>'
        +'<div class="ref r2"><span class="tx"><b>CASE2</b> '+esc(refText(it,2))+'</span><button type="button" class="btn sm" data-ap="2" data-id="'+it.id+'">적용</button></div>'
        +'<div class="inp">'+it.f.map(f=>ctl(it,f)).join('')+'</div></div>';
    });
    h+='</section>';
  });
  $('main').innerHTML=h;
}
function allItems(){return SECTIONS.reduce((a,s)=>a.concat(s.items),[])}
function applyCase(it,c){const o=it['c'+c];it.f.forEach(f=>{data[it.id+'.'+f.k]=o[f.k]||''});}
function markDirty(){dirty=true;setStatus('저장 안 된 변경 있음','dirty');lsSet(JSON.stringify({data,v:VERSION,t:Date.now()}))}

/* ── 이벤트 ── */
function onInput(e){const k=e.target.getAttribute&&e.target.getAttribute('data-k');if(!k)return;data[k]=e.target.value;markDirty()}
$('main').addEventListener('input',onInput);
$('main').addEventListener('change',onInput);
$('main').addEventListener('click',e=>{
  const b=e.target.closest('button[data-ap]');if(!b)return;
  const it=allItems().find(x=>x.id===b.getAttribute('data-id'));if(!it)return;
  applyCase(it,b.getAttribute('data-ap'));markDirty();render();
});
$('bC1').onclick=()=>{allItems().forEach(it=>applyCase(it,1));markDirty();render();toast('CASE1 값을 모두 입력했습니다')};
$('bC2').onclick=()=>{allItems().forEach(it=>applyCase(it,2));markDirty();render();toast('CASE2 값을 모두 입력했습니다')};

    db=firebase.firestore();fbOK=true;
  }catch(e){fbOK=false;console.warn('Firebase 초기화 실패:',e.message)}

async function save(){
  const b=$('bSave');b.disabled=true;
  data['meta.version']=VERSION;
  const payload={data:data,version:VERSION,updatedAt:fmt(new Date())};
  lsSet(JSON.stringify({data,v:VERSION,t:Date.now()}));
  try{
    if(!fbOK)throw new Error('Firebase 미연결');
    await db.collection(COLL).doc(DOCID).set(payload);
    dirty=false;setStatus('저장됨 '+payload.updatedAt+' · Firebase','ok');toast('Firebase에 저장했습니다');
  }catch(e){
    console.warn('저장 실패:',e.message||e);
    setStatus('이 기기에만 저장됨 (Firebase 저장 실패)','dirty');toast('Firebase 저장 실패 — 이 기기에는 저장됨. 보안 규칙을 확인하세요');
  }
  b.disabled=false;
}
async function load(manual){
  try{
    if(!fbOK)throw new Error('Firebase 미연결');
    const s=await db.collection(COLL).doc(DOCID).get();
    if(s.exists){data=(s.data()&&s.data().data)||{};dirty=false;render();setStatus('불러옴 '+(s.data().updatedAt||'')+' · Firebase','ok');if(manual)toast('서버 저장본을 불러왔습니다');return}
    setStatus('서버 저장본 없음 (새 문서)');if(manual)toast('서버에 저장된 내용이 없습니다');
  }catch(e){
    console.warn('불러오기 실패:',e.message||e);
    const l=lsGet();
    if(l){try{data=JSON.parse(l).data||{};render();setStatus('이 기기 임시 저장본 표시 (Firebase 불러오기 실패)','dirty');return}catch(_){}}
    setStatus('Firebase 불러오기 실패','dirty');
  }
}
$('bSave').onclick=save;
$('bLoad').onclick=()=>load(true);

function decText(it){
  const parts=it.f.map(f=>{const v=data[it.id+'.'+f.k];if(!v)return '';return f.l?f.l+': '+v:v}).filter(Boolean);
  return parts.join(it.join);
}

  $('printArea').innerHTML=h;
}

  else{$('gerr').textContent='비밀번호가 올바르지 않습니다.';$('pw').value='';$('pw').focus()}
});
['gv','hv','fv'].forEach(i=>{$(i).textContent=VERSION});
try{if(sessionStorage.getItem('cps_ok')==='1')unlock();else $('pw').focus()}catch(e){$('pw').focus()}
</script>
