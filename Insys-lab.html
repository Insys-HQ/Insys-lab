<!DOCTYPE html>

<head>

<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/8.10.1/firebase-app.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'맑은 고딕','Malgun Gothic','Noto Sans KR',sans-serif;background:#EEF2F7;min-height:100vh;font-size:13px}
input,select,textarea,button{font-family:inherit;font-size:13px}
input,select,textarea{width:100%;padding:7px 10px;border:1px solid #CED4DA;border-radius:5px;outline:none;background:#fff}
input:focus,select:focus,textarea:focus{border-color:#2E75B6;box-shadow:0 0 0 2px rgba(46,117,182,.15)}
textarea{resize:vertical}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-thumb{background:#ccc;border-radius:3px}

/* ── 로그인 화면 ── */
#login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,#1F3864 0%,#2E75B6 100%)}
.login-box{background:#fff;border-radius:12px;padding:36px 40px;width:380px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.login-logo{text-align:center;margin-bottom:24px}
.login-logo-icon{font-size:40px;margin-bottom:8px}
.login-logo-title{font-size:16px;font-weight:700;color:#1F3864}
.login-logo-sub{font-size:11px;color:#ADB5BD;margin-top:3px}
.login-tab{display:flex;border-bottom:2px solid #F0F0F0;margin-bottom:20px}
.login-tab button{flex:1;background:none;border:none;padding:10px;cursor:pointer;font-size:13px;font-weight:500;color:#ADB5BD;border-bottom:2px solid transparent;margin-bottom:-2px}
.login-tab button.active{color:#2E75B6;border-bottom:2px solid #2E75B6}
.login-form-group{margin-bottom:14px}
.login-form-group label{display:block;font-size:11px;font-weight:600;color:#495057;margin-bottom:5px}
.login-btn{width:100%;padding:10px;background:#2E75B6;color:#fff;border:none;border-radius:6px;font-size:14px;font-weight:600;cursor:pointer;margin-top:6px}
.login-btn:hover{background:#1F5A9B}
.login-err{color:#DC3545;font-size:12px;margin-top:8px;text-align:center;min-height:18px}
.login-divider{text-align:center;color:#ADB5BD;font-size:11px;margin:14px 0}

/* ── 승인 대기 화면 ── */

.wait-box{background:#fff;border-radius:12px;padding:40px;text-align:center;width:360px;box-shadow:0 20px 60px rgba(0,0,0,.25)}

/* ── 메인 앱 ── */
#app{display:none;max-width:1100px;margin:0 auto;min-height:100vh;background:#fff;box-shadow:0 0 30px rgba(0,0,0,.1)}
.hdr{background:linear-gradient(135deg,#1F3864,#2E75B6);padding:11px 20px;display:flex;align-items:center;justify-content:space-between}
.hdr-logo{display:flex;align-items:center;gap:12px}
.hdr-icon{background:rgba(255,255,255,.15);border-radius:8px;width:40px;height:40px;display:flex;align-items:center;justify-content:center;font-size:20px}
.hdr-title{color:#fff;font-weight:700;font-size:15px}
.hdr-sub{color:#B3D4F0;font-size:11px;margin-top:2px}
.hdr-right{display:flex;align-items:center;gap:12px}
.user-badge{background:rgba(255,255,255,.15);border-radius:20px;padding:5px 12px;display:flex;align-items:center;gap:7px}
.user-avatar{width:24px;height:24px;border-radius:50%;background:#2E75B6;border:2px solid rgba(255,255,255,.4);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff}
.user-name{color:#fff;font-size:12px;font-weight:500}
.user-role{color:#B3D4F0;font-size:10px}
.logout-btn{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);color:#fff;padding:4px 10px;border-radius:5px;cursor:pointer;font-size:11px}
.logout-btn:hover{background:rgba(255,255,255,.25)}
.tabs{background:#1F3864;display:flex;border-bottom:2px solid #2E75B6;overflow-x:auto}
.tab-btn{background:transparent;border:none;color:#90B4D0;padding:10px 16px;display:flex;align-items:center;gap:5px;font-size:13px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;white-space:nowrap;transition:all .15s}
.tab-btn.active{background:#2E75B6;color:#fff;font-weight:600;border-bottom:2px solid #90CAF9}
.tab-btn:hover:not(.active){color:#fff}
.content{padding:18px 20px;background:#EEF2F7;min-height:calc(100vh - 115px)}
.page{display:none}.page.active{display:block}
.card{background:#fff;border-radius:8px;border:.5px solid #DEE2E6;padding:14px 16px;margin-bottom:12px}
.btn{display:inline-flex;align-items:center;gap:4px;padding:7px 14px;border-radius:6px;font-weight:500;font-size:13px;cursor:pointer;transition:all .15s;border:1px solid transparent}
.btn-p{background:#2E75B6;color:#fff;border-color:#2E75B6}.btn-p:hover{background:#1F5A9B}

.b-완료{background:#D1E7DD;color:#0A3622}.b-보류{background:#F8D7DA;color:#58151C}

.b-대여중{background:#CCE5FF;color:#004085}.b-폐기{background:#F8D7DA;color:#58151C}

.b-승인대기{background:#F8D7DA;color:#58151C}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.toolbar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
.ml-auto{margin-left:auto}
label.lbl{display:block;font-size:11px;font-weight:600;color:#495057;margin-bottom:4px}
.form-r{display:grid;gap:12px;margin-bottom:12px}
.c2{grid-template-columns:1fr 1fr}.c3{grid-template-columns:1fr 1fr 1fr}.c4{grid-template-columns:1fr 1fr 1fr 1fr}
.form-act{display:flex;gap:8px;justify-content:flex-end;padding-top:12px;border-top:1px solid #F0F0F0}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
thead tr{background:#F8F9FA;border-bottom:1px solid #DEE2E6}
th{padding:9px 12px;text-align:left;font-weight:500;color:#495057;white-space:nowrap}

.tc{text-align:center}.tr-r{text-align:right}

.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.stat-card{background:#fff;border-radius:8px;border:.5px solid #DEE2E6;padding:14px 12px;text-align:center}
.ni{background:#EEF6FF;border:1px solid #B8D4F5;border-radius:6px;padding:9px 13px;font-size:12px;color:#1F3864;margin-bottom:12px}
.ng{background:#F0FFF4;border:1px solid #C6F6D5;border-radius:6px;padding:10px 14px;margin-bottom:10px}
.no{background:#FFF8F0;border:1px solid #FED7AA;border-radius:6px;padding:10px 14px;margin-bottom:10px}
.nv{background:#F8F0FF;border:1px solid #D8B4FE;border-radius:6px;padding:9px 13px;font-size:12px;color:#6F42C1;margin-top:10px}
.back-row{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.back-row h3{margin:0;font-size:15px;font-weight:500}
.hint{font-size:11px;color:#ADB5BD}
.empty{background:#fff;border-radius:8px;text-align:center;color:#ADB5BD;padding:50px 20px;border:.5px solid #DEE2E6}
.pre{white-space:pre-wrap;font-size:14px;line-height:1.75;color:#212529}
.ftr{background:#1F3864;padding:10px 20px;text-align:center;color:#6B8FAF;font-size:11px}
#overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(31,56,100,.93);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;color:#fff}
.spin{width:46px;height:46px;border:4px solid rgba(255,255,255,.2);border-top:4px solid #fff;border-radius:50%;animation:sp .8s linear infinite;margin-bottom:14px}
@keyframes sp{to{transform:rotate(360deg)}}
#toast{position:fixed;bottom:24px;right:24px;background:#1F3864;color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .3s;z-index:9998;pointer-events:none;box-shadow:0 4px 12px rgba(0,0,0,.2)}
#toast.show{opacity:1}
.lbl-card{width:227px;height:151px;border:2px solid #1F3864;border-radius:4px;overflow:hidden;background:#fff;position:relative;box-shadow:3px 3px 8px rgba(0,0,0,.15)}
.lbl-hdr{background:#1F3864;padding:4px 8px;display:flex;align-items:center;justify-content:space-between}
.lbl-asset{background:#2E75B6;padding:2px 8px;text-align:center;color:#fff;font-size:11px;font-weight:700;font-family:monospace;letter-spacing:1px}
.lbl-body{padding:5px 8px}
.lbl-nm{font-size:12px;font-weight:700;color:#1F3864;margin-bottom:4px;line-height:1.2}
.lbl-info{display:grid;grid-template-columns:1fr 1fr;gap:1px 6px;font-size:8px}
.lk{color:#999;margin-right:2px}
.lbl-qr{position:absolute;bottom:5px;right:6px;width:38px;height:38px;border:1px solid #DEE2E6;border-radius:3px;display:flex;align-items:center;justify-content:center;background:#F8F9FA;font-size:6px;color:#ADB5BD;text-align:center;line-height:1.3;font-weight:600}
.lbl-ft{position:absolute;bottom:5px;left:8px;font-size:5px;color:#CCC}
@media(max-width:700px){.c2,.c3,.c4{grid-template-columns:1fr}.stat-grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>

<!-- ══ 로딩 오버레이 ══ -->

<div id="login-screen" style="display:none">
  <div class="login-box">
    <div class="login-logo">
      <div class="login-logo-icon">🔬</div>
      <div class="login-logo-title">인시스그룹 AI혁신 R&D센터</div>

    </div>

      <button class="active" onclick="switchTab('login')">로그인</button>

    <!-- 로그인 폼 -->

      <div class="login-form-group">

      <div class="login-form-group">
        <label>비밀번호</label>
        <input type="password" id="login-pw" placeholder="비밀번호 입력" onkeydown="if(event.key==='Enter')doLogin()">
      </div>
      <button class="login-btn" onclick="doLogin()">로그인</button>
      <div class="login-err" id="login-err"></div>
    </div>

    <!-- 계정 신청 폼 -->
    <div id="tab-register" style="display:none">
      <div class="ni" style="margin-bottom:14px;font-size:11px">신청 후 관리자(연구소장) 승인이 필요합니다</div>
      <div class="login-form-group">
        <label>이름</label>
        <input type="text" id="reg-name" placeholder="성명 입력">
      </div>
      <div class="login-form-group">
        <label>이메일</label>
        <input type="email" id="reg-email" placeholder="이메일 주소 입력">
      </div>
      <div class="login-form-group">
        <label>비밀번호</label>
        <input type="password" id="reg-pw" placeholder="8자 이상">
      </div>
      <div class="login-form-group">
        <label>소속 / 직위</label>
        <input type="text" id="reg-dept" placeholder="예) AI혁신 R&D센터 / 연구원">
      </div>
      <button class="login-btn" style="background:#198754" onclick="doRegister()">계정 신청</button>
      <div class="login-err" id="reg-err"></div>
    </div>
  </div>
</div>

<!-- ══ 승인 대기 화면 ══ -->
<div id="wait-screen">
  <div class="wait-box">
    <div style="font-size:48px;margin-bottom:16px">⏳</div>
    <h3 style="color:#1F3864;margin-bottom:10px">승인 대기 중</h3>
    <p style="color:#6C757D;font-size:13px;line-height:1.7;margin-bottom:20px">계정 신청이 완료되었습니다.<br>관리자(연구소장) 승인 후 이용 가능합니다.</p>
    <div id="wait-user-info" style="background:#F8F9FA;border-radius:6px;padding:10px;font-size:12px;color:#495057;margin-bottom:16px"></div>
    <button class="btn btn-g" onclick="doLogout()" style="width:100%;justify-content:center">로그아웃</button>
  </div>
</div>

<!-- ══ 토스트 ══ -->
<div id="toast"></div>

<!-- ══ 메인 앱 ══ -->
<div id="app">
  <div class="hdr">
    <div class="hdr-logo">
      <div class="hdr-icon">🔬</div>
      <div>
        <div class="hdr-title">인시스그룹 AI혁신 R&D센터</div>
        <div class="hdr-sub">연구노트 시스템 v1.0 ☁️ Firebase</div>
      </div>
    </div>
    <div class="hdr-right">
      <div class="user-badge">
        <div class="user-avatar" id="user-avatar">?</div>
        <div>
          <div class="user-name" id="user-name-display">-</div>
          <div class="user-role" id="user-role-display">-</div>
        </div>
      </div>
      <button class="logout-btn" onclick="doLogout()">로그아웃</button>
    </div>
  </div>
  <div class="tabs" id="main-tabs">
    <button class="tab-btn active" data-tab="dashboard">📊 대시보드</button>
    <button class="tab-btn" data-tab="notes">📓 연구노트</button>
    <button class="tab-btn" data-tab="projects">📁 프로젝트</button>
    <button class="tab-btn" data-tab="equipment">🔬 연구장비</button>
    <button class="tab-btn" data-tab="labels">🖨️ 라벨출력</button>
    <button class="tab-btn admin-only" data-tab="users" style="display:none">👥 연구원관리</button>
  </div>
  <div class="content">
    <div id="page-dashboard" class="page active"></div>
    <div id="page-notes" class="page"></div>
    <div id="page-projects" class="page"></div>
    <div id="page-equipment" class="page"></div>
    <div id="page-labels" class="page"></div>
    <div id="page-users" class="page"></div>
  </div>
  <div class="ftr">인시스그룹 AI혁신 R&D센터 연구노트 시스템 v1.0 | ☁️ Firebase Cloud | © 2026 INSYS Group</div>
</div>

<script>
// ══════════════════════════════════════
// FIREBASE 초기화
// ══════════════════════════════════════
const FC = {
  apiKey:"AIzaSyCAIGC4PR49dSXVae9I4IDO1nV1dX5_Auw",
  authDomain:"insys-lab.firebaseapp.com",
  projectId:"insys-lab",
  storageBucket:"insys-lab.firebasestorage.app",
  messagingSenderId:"710000243038",
  appId:"1:710000243038:web:2a93f28352a2269f4e1fcf"
};
firebase.initializeApp(FC);
const fdb = firebase.firestore();
const fauth = firebase.auth();
// 계정생성용 보조 앱 (관리자가 생성시 로그인 상태 유지)
const secApp = firebase.initializeApp(FC, 'secondary');
const secAuth = secApp.auth();

// ── 현재 사용자 ──
let CU = null; // {uid, email, name, role, dept, approved}

// ── TOAST ──
function toast(msg,err){
  const t=document.getElementById('toast');
  t.textContent=msg;t.style.background=err?'#842029':'#1F3864';
  t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);
}

// ── OVERLAY ──
function showOverlay(msg){document.getElementById('overlay-msg').textContent=msg;document.getElementById('overlay').style.display='flex';}
function hideOverlay(){document.getElementById('overlay').style.display='none';}

// ── SCREEN 전환 ──
function showScreen(name){
  document.getElementById('login-screen').style.display='none';
  document.getElementById('wait-screen').style.display='none';
  document.getElementById('app').style.display='none';
  if(name==='login')document.getElementById('login-screen').style.display='flex';
  else if(name==='wait'){document.getElementById('wait-screen').style.display='flex';}
  else if(name==='app')document.getElementById('app').style.display='block';
}

function switchTab(t){
  document.getElementById('tab-login').style.display=t==='login'?'block':'none';
  document.getElementById('tab-register').style.display=t==='register'?'block':'none';
  document.querySelectorAll('.login-tab button').forEach((b,i)=>b.classList.toggle('active',(t==='login'&&i===0)||(t==='register'&&i===1)));
}

// ══════════════════════════════════════
// AUTH
// ══════════════════════════════════════
async function doLogin(){
  const email=document.getElementById('login-email').value.trim();
  const pw=document.getElementById('login-pw').value;
  const err=document.getElementById('login-err');
  err.textContent='';
  if(!email||!pw){err.textContent='이메일과 비밀번호를 입력하세요';return;}
  try{
    showOverlay('로그인 중...');
    await fauth.signInWithEmailAndPassword(email,pw);
  }catch(e){
    hideOverlay();
    err.textContent=e.code==='auth/user-not-found'||e.code==='auth/wrong-password'?'이메일 또는 비밀번호가 올바르지 않습니다':e.message;
  }
}

async function doRegister(){
  const name=document.getElementById('reg-name').value.trim();
  const email=document.getElementById('reg-email').value.trim();
  const pw=document.getElementById('reg-pw').value;
  const dept=document.getElementById('reg-dept').value.trim();
  const err=document.getElementById('reg-err');
  err.textContent='';
  if(!name||!email||!pw){err.textContent='모든 필드를 입력하세요';return;}
  if(pw.length<8){err.textContent='비밀번호는 8자 이상이어야 합니다';return;}
  try{
    showOverlay('계정 신청 중...');
    const cred=await fauth.createUserWithEmailAndPassword(email,pw);
    const profile={uid:cred.user.uid,email,name,dept:dept||'',role:'연구원',approved:false,createdAt:new Date().toISOString()};
    await fdb.collection('users').doc(cred.user.uid).set(profile);
    hideOverlay();
  }catch(e){
    hideOverlay();
    err.textContent=e.code==='auth/email-already-in-use'?'이미 등록된 이메일입니다':e.message;
  }
}

async function doLogout(){
  if(!confirm('로그아웃 하시겠습니까?'))return;
  await fauth.signOut();
}

// ── Auth 상태 감지 ──
fauth.onAuthStateChanged(async user=>{
  if(!user){hideOverlay();showScreen('login');CU=null;return;}
  showOverlay('사용자 정보 확인 중...');
  try{
    let doc=await fdb.collection('users').doc(user.uid).get();
    if(!doc.exists){
      // 최초 관리자 (첫 번째 유저) 처리
      const allUsers=await fdb.collection('users').get();
      const isFirst=allUsers.empty;
      const profile={uid:user.uid,email:user.email,name:user.displayName||user.email.split('@')[0],dept:'AI혁신 R&D센터',role:isFirst?'관리자':'연구원',approved:isFirst,createdAt:new Date().toISOString()};
      await fdb.collection('users').doc(user.uid).set(profile);
      doc=await fdb.collection('users').doc(user.uid).get();
    }
    CU={uid:user.uid,...doc.data()};
    if(!CU.approved){
      hideOverlay();
      document.getElementById('wait-user-info').innerHTML=`<strong>${CU.name}</strong> (${CU.email})<br>${CU.dept||''}`;
      showScreen('wait');return;
    }
    await loadApp();
  }catch(e){hideOverlay();showScreen('login');console.error(e);}
});

async function loadApp(){
  showOverlay('데이터 불러오는 중...');
  const [notes,projects,equip,users]=await Promise.all([
    fdb.collection('notes').get(),
    fdb.collection('projects').get(),
    fdb.collection('equip').get(),
    fdb.collection('users').get()
  ]);
  D.notes=notes.docs.map(d=>({id:d.id,...d.data()}));
  D.equip=equip.docs.map(d=>({id:d.id,...d.data()}));
  D.users=users.docs.map(d=>({id:d.id,...d.data()}));
  if(projects.empty){
    D.projects=DEF_PROJ;
    await Promise.all(DEF_PROJ.map(p=>fdb.collection('projects').doc(p.id).set(p)));
  }else{
    D.projects=projects.docs.map(d=>({id:d.id,...d.data()}));
  }
  // 헤더 사용자 표시
  const initials=CU.name.slice(0,1);

  document.getElementById('user-name-display').textContent=CU.name;
  document.getElementById('user-role-display').textContent=CU.role+(CU.dept?` · ${CU.dept}`:'');

  hideOverlay();
  showScreen('app');
  rDash(document.getElementById('page-dashboard'));
}

function mkLbl(e){return`<div class="lbl-card"><div class="lbl-hdr"><div><div style="color:#fff;font-size:9px;font-weight:700">인시스 그룹</div><div style="color:#90CAF9;font-size:7px">AI혁신 R&D센터</div></div><div style="color:#90CAF9;font-size:7px">연구개발장비</div></div><div class="lbl-asset">${esc(e.assetNo)}</div><div class="lbl-body"><div class="lbl-nm">${esc(e.name)}</div><div class="lbl-info"><div><span class="lk">모델</span>${esc(e.model||'—')}</div><div><span class="lk">분류</span>${esc(e.category)}</div><div><span class="lk">구입</span>${fmt(e.purchaseDate)}</div><div><span class="lk">위치</span>${esc(e.location||'—')}</div>${e.serial?`<div style="grid-column:span 2"><span class="lk">S/N</span><span style="font-family:monospace">${esc(e.serial)}</span></div>`:''}</div></div><div class="lbl-qr">QR<br>CODE</div><div class="lbl-ft">INSYS-LAB | ${new Date().getFullYear()}</div></div>`;}
function prtLbl(){const e=window._SE;if(!e)return alert('장비를 선택하세요');const cnt=Math.max(1,Math.min(10,+(document.getElementById('lblC').value)||1));const L=Array(cnt).fill(0).map(()=>`<div class="L"><div class="H"><div><div class="C">인시스 그룹</div><div class="S">AI혁신 R&D센터</div></div><div class="S">연구개발장비</div></div><div class="A">${esc(e.assetNo)}</div><div class="B"><div class="N">${esc(e.name)}</div><div class="I"><div><span class="K">모델</span>${esc(e.model||'—')}</div><div><span class="K">분류</span>${esc(e.category)}</div><div><span class="K">구입</span>${fmt(e.purchaseDate)}</div><div><span class="K">위치</span>${esc(e.location||'—')}</div>${e.serial?`<div style="grid-column:span 2"><span class="K">S/N</span><span style="font-family:monospace">${esc(e.serial)}</span></div>`:''}</div></div><div class="Q">QR<br>CODE</div><div class="F">INSYS Group R&amp;D | ${new Date().getFullYear()}</div></div>`).join('');const w=window.open('','_blank','width=480,height=400');if(!w){alert('팝업 차단을 해제하세요');return;}w.document.write(`<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>라벨-${esc(e.assetNo)}</title><style>@page{size:60mm 40mm;margin:0}@media print{body{margin:0}.L{page-break-after:always}.L:last-child{page-break-after:auto}}body{font-family:'맑은 고딕',sans-serif;background:#fff;margin:0;padding:2mm}.L{width:60mm;height:40mm;border:1px solid #1F3864;border-radius:1mm;overflow:hidden;position:relative;margin-bottom:2mm;display:inline-block}.H{background:#1F3864;padding:1.5mm 2.5mm;display:flex;align-items:center;justify-content:space-between}.C{color:#fff;font-size:6pt;font-weight:700}.S{color:#90CAF9;font-size:4.5pt}.A{background:#2E75B6;padding:1mm 2mm;text-align:center;color:#fff;font-size:7.5pt;font-weight:700;font-family:monospace;letter-spacing:.5mm}.B{padding:1.5mm 2.5mm}.N{font-size:7pt;font-weight:700;color:#1F3864;margin-bottom:1.5mm;line-height:1.2}.I{display:grid;grid-template-columns:1fr 1fr;gap:.5mm 2mm;font-size:4.5pt}.K{color:#999;margin-right:.5mm}.Q{position:absolute;bottom:2mm;right:2mm;width:11mm;height:11mm;border:.5mm solid #ddd;border-radius:.5mm;display:flex;align-items:center;justify-content:center;background:#f8f9fa;font-size:3.5pt;color:#aaa;text-align:center;line-height:1.3;font-weight:600}.F{position:absolute;bottom:1.5mm;left:2.5mm;font-size:3.5pt;color:#ccc}</style></head><body>${L}<script>window.onload=function(){window.print();setTimeout(function(){window.close();},1200);}<\/script></body></html>`);w.document.close();}

// ══════════════════════════════════════
// 연구원 관리 (관리자 전용)
// ══════════════════════════════════════
function rUsers(el){
  if(CU.role!=='관리자'){el.innerHTML='<div class="empty">관리자만 접근 가능합니다</div>';return;}
  const pending=D.users.filter(u=>!u.approved);
  const approved=D.users.filter(u=>u.approved);
  el.innerHTML=`
    ${pending.length?`<div class="card" style="border:1px solid #FED7AA">
      <div style="font-weight:600;font-size:14px;margin-bottom:12px;color:#9A3412">⏳ 승인 대기 (${pending.length}명)</div>
      <div class="tbl-wrap"><table>
        <thead><tr><th>이름</th><th>이메일</th><th>소속/직위</th><th>신청일</th><th class="tc">승인</th></tr></thead>
        <tbody>${pending.map(u=>`<tr>
          <td style="font-weight:500">${esc(u.name)}</td><td style="color:#6C757D">${esc(u.email)}</td>
          <td style="color:#6C757D">${esc(u.dept||'')}</td>
          <td style="color:#6C757D;font-size:11px">${u.createdAt?u.createdAt.slice(0,10).replace(/-/g,'.'):'—'}</td>
          <td class="tc"><button class="btn btn-s btn-sm" onclick="approveUser('${esc(u.id)}')">✓ 승인</button></td>
        </tr>`).join('')}
        </tbody></table></div></div>`:``}

    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <span style="font-weight:600;font-size:14px">👥 연구원 목록 (${approved.length}명)</span>
        <button class="btn btn-p btn-sm" onclick="showAddUser()">+ 직접 계정 생성</button>
      </div>
      <div class="tbl-wrap"><table>
        <thead><tr><th>이름</th><th>이메일</th><th>소속/직위</th><th class="tc">역할</th><th class="tc">관리</th></tr></thead>
        <tbody>${approved.map(u=>`<tr>
          <td><div style="font-weight:500">${esc(u.name)}</div></td>
          <td style="color:#6C757D;font-size:12px">${esc(u.email)}</td>
          <td style="color:#6C757D">${esc(u.dept||'')}</td>
          <td class="tc">${badge(u.role||'연구원')}</td>
          <td class="tc"><div style="display:flex;gap:3px;justify-content:center">
            ${u.uid!==CU.uid?`
            <button class="btn btn-o btn-sm" onclick="toggleRole('${esc(u.id)}','${esc(u.role)}')">${u.role==='관리자'?'연구원으로':'관리자로'}</button>
            <button class="btn btn-d btn-sm" onclick="revokeUser('${esc(u.id)}')">비활성</button>`:'<span style="font-size:11px;color:#ADB5BD">(본인)</span>'}
          </div></td>
        </tr>`).join('')}
        </tbody></table></div>
    </div>

    <div id="add-user-form" style="display:none">
      <div class="card" style="border:1px solid #B8D4F5">
        <div style="font-weight:600;font-size:14px;margin-bottom:14px;color:#1F3864">+ 연구원 계정 직접 생성</div>
        <div class="form-r c2">
          <div><label class="lbl">이름</label><input id="au-name" placeholder="성명"></div>
          <div><label class="lbl">소속/직위</label><input id="au-dept" placeholder="AI혁신 R&D센터 / 연구원"></div>
        </div>
        <div class="form-r c2">
          <div><label class="lbl">이메일</label><input type="email" id="au-email" placeholder="이메일 주소"></div>
          <div><label class="lbl">임시 비밀번호</label><input type="text" id="au-pw" placeholder="8자 이상 (본인이 변경 안내)"></div>
        </div>
        <div class="form-act">
          <button class="btn btn-g" onclick="document.getElementById('add-user-form').style.display='none'">취소</button>
          <button class="btn btn-p" onclick="createUser()">계정 생성</button>
        </div>
        <div id="au-err" style="color:#DC3545;font-size:12px;margin-top:8px"></div>
      </div>
    </div>`;
}

function showAddUser(){document.getElementById('add-user-form').style.display='block';}

async function approveUser(id){
  if(!confirm('승인하시겠습니까?'))return;
  await fdb.collection('users').doc(id).update({approved:true});
  const u=D.users.find(x=>x.id===id);if(u)u.approved=true;
  toast('✅ 승인되었습니다');rUsers(document.getElementById('page-users'));
}

async function toggleRole(id,currentRole){
  const newRole=currentRole==='관리자'?'연구원':'관리자';
  if(!confirm(`${newRole}(으)로 변경하시겠습니까?`))return;
  await fdb.collection('users').doc(id).update({role:newRole});
  const u=D.users.find(x=>x.id===id);if(u)u.role=newRole;
  toast('✅ 역할이 변경되었습니다');rUsers(document.getElementById('page-users'));
}

async function revokeUser(id){
  if(!confirm('비활성화하시겠습니까? (로그인 불가 처리)'))return;
  await fdb.collection('users').doc(id).update({approved:false});
  const u=D.users.find(x=>x.id===id);if(u)u.approved=false;
  toast('비활성화되었습니다');rUsers(document.getElementById('page-users'));
}

async function createUser(){
  const name=document.getElementById('au-name').value.trim();
  const email=document.getElementById('au-email').value.trim();
  const pw=document.getElementById('au-pw').value;
  const dept=document.getElementById('au-dept').value.trim();
  const errEl=document.getElementById('au-err');
  errEl.textContent='';
  if(!name||!email||!pw)return(errEl.textContent='모든 필드를 입력하세요');
  if(pw.length<8)return(errEl.textContent='비밀번호 8자 이상');
  try{
    // 보조 앱으로 계정 생성 (관리자 세션 유지)
    const cred=await secAuth.createUserWithEmailAndPassword(email,pw);
    const profile={uid:cred.user.uid,email,name,dept,role:'연구원',approved:true,createdAt:new Date().toISOString()};
    await fdb.collection('users').doc(cred.user.uid).set(profile);
    await secAuth.signOut();
    D.users.push({id:cred.user.uid,...profile});
    toast('✅ 계정이 생성되었습니다');
    document.getElementById('add-user-form').style.display='none';
    rUsers(document.getElementById('page-users'));
  }catch(e){errEl.textContent=e.code==='auth/email-already-in-use'?'이미 등록된 이메일입니다':e.message;}
}
</script>
